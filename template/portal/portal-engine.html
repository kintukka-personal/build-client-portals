<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title><!-- @title --></title>
<meta name="description" content="<!-- @description -->">
<!-- @favicon -->
<!-- @fonts -->
<style>
/* @tokens */
/* @/tokens */

/* ---- base ---- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; height: 100%; }
body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); font-size: var(--t-body-size); line-height: var(--t-body-lh); -webkit-font-smoothing: antialiased; }
a { color: var(--link); text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
h1, h2, h3, h4 { margin: 0; font-weight: var(--w-semibold); }
p { margin: 0 0 1em; } p:last-child { margin-bottom: 0; }
svg { display: block; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.g { color: var(--primary); } .a { color: var(--cta); } .muted { color: var(--text-muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ---- shell ---- */
.shell { min-height: 100vh; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 20; background: rgba(0,0,0,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border-quiet); padding-top: env(safe-area-inset-top); }
.top .in { display: flex; align-items: center; justify-content: space-between; height: 60px; padding: 0 16px; }
.top .logo { width: 128px; }
.hamb { width: 36px; height: 24px; display: flex; flex-direction: column; justify-content: space-between; }
.hamb i { display: block; height: 4px; background: var(--primary); }
.rail { display: none; }
main { --gutter: 16px; flex: 1; padding: 0 var(--gutter) calc(84px + env(safe-area-inset-bottom)); max-width: 720px; width: 100%; margin: 0 auto; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(4, 1fr); background: rgba(0,0,0,.96); border-top: 1px solid var(--border-quiet); padding-bottom: env(safe-area-inset-bottom); }
.tabbar a { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 10px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; font-weight: var(--w-semibold); color: var(--text-muted); }
.tabbar a svg { width: 22px; height: 22px; }
/* five tabs leaves each one ~78px, and an uppercase two-word label wraps there and
   makes the whole bar taller than it is for every other audience. The tracking and
   a point of size come back so it sits on one line. */
.tabbar[data-n="5"] a { font-size: 9.5px; letter-spacing: .03em; }
.tabbar[data-n="5"] a span { white-space: nowrap; }
.tabbar a[aria-current] { color: var(--primary); }

@media (min-width: 960px) {
  .shell { flex-direction: row; }
  .top, .tabbar { display: none; }
  .rail { display: flex; flex-direction: column; width: 264px; flex: none; position: sticky; top: 0; height: 100vh; border-right: 1px solid var(--border-quiet); padding: 28px 22px; }
  .rail .logo { width: 150px; margin-bottom: 36px; }
  .rail nav a { display: flex; align-items: center; gap: 14px; padding: 12px 10px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; font-weight: var(--w-semibold); color: var(--text); border-left: 2px solid transparent; }
  .rail nav a svg { width: 20px; height: 20px; }
  .rail nav a[aria-current] { color: var(--primary); border-left-color: var(--primary); background: var(--primary-tint); }
  .rail .aud { margin-top: 28px; grid-template-columns: 1fr; }
  .rail .aud button { justify-content: flex-start; padding: 11px 12px; }
  .rail .foot { margin-top: auto; font-size: 12px; color: var(--text-muted); line-height: 1.5; }
  .rail .foot .btn { width: 100%; margin-bottom: 14px; }
  main { --gutter: 40px; padding: 36px var(--gutter) 60px; max-width: 980px; margin: 0; }
}

/* ---- audience switch ---- */
.aud { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.aud button { text-align: center; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: var(--w-semibold); padding: 10px 4px; border: 1px solid var(--border-quiet); color: var(--text-muted); display: flex; align-items: center; justify-content: center; gap: 6px; }
.aud button svg { width: 11px; height: 11px; }
.aud button.on { border-color: var(--ac); color: var(--ac); background: color-mix(in srgb, var(--ac) 14%, transparent); }
.aud button[data-c="primary"] { --ac: var(--primary); } .aud button[data-c="cta"] { --ac: var(--cta); } .aud button[data-c="white"] { --ac: #fff; }

/* ---- type ---- */
.h1 { font-size: var(--t-h1-size); line-height: var(--t-h1-lh); letter-spacing: var(--t-h1-ls); }
.h2 { font-size: var(--t-h2-size); line-height: var(--t-h2-lh); }
.label { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: var(--cta); font-weight: var(--w-semibold); }
.section { margin-top: 30px; }
.section > .label { margin-bottom: 10px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.section-head h3 { font-size: 18px; display: flex; align-items: center; gap: 7px; }
.section-head h3 svg { width: 16px; height: 16px; flex: none; fill: currentColor; }
.section-head a { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: var(--w-semibold); }

/* ---- buttons ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 12px 24px; background: var(--cta); color: var(--text-on-cta); font-size: 14px; font-weight: var(--w-semibold); letter-spacing: .04em; text-transform: uppercase; border-radius: var(--r-control); text-decoration: none; }
.btn:hover { background: var(--cta-deep); }
.btn.outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
.btn.outline:hover { background: var(--primary-tint); }
.btn.ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border-quiet); }
.btn.ghost:hover { color: var(--text); border-color: var(--text-muted); }
.btn.block { width: 100%; }
.btn.small { min-height: 40px; padding: 8px 16px; font-size: 12px; }
.btn[disabled] { opacity: .45; cursor: default; }
.btn svg { width: 16px; height: 16px; }
.linkmore { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; font-weight: var(--w-medium); color: var(--primary); display: inline-flex; align-items: center; gap: 8px; }
.linkmore svg { width: 20px; height: 10px; }

/* ---- cards ---- */
.card { display: block; background: var(--surface); border: 1px solid var(--border-quiet); padding: 16px; color: inherit; position: relative; height: 100%; }
/* A card is wrapped so the star can sit over it: a button cannot live inside an <a>,
   and the star has to be its own control for anyone on a keyboard or a screen reader. */
.cw { position: relative; display: flex; }
.cw > .card { flex: 1; min-width: 0; }
.cw + .cw { margin-top: 10px; }
.card + .card { margin-top: 10px; }
.fav { position: absolute; top: 3px; right: 4px; z-index: 2; width: 38px; height: 38px; display: grid;
  place-items: center; background: none; border: 0; color: var(--border); padding: 0; }
.fav svg { width: 19px; height: 19px; fill: none; }
.fav.on svg { fill: currentColor; }
.fav:hover { color: var(--text-muted); }
.fav.on { color: var(--cta); }
.fav:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
/* on the item page it is a button among buttons, not a corner affordance */
.fav.wide { position: static; width: auto; height: auto; gap: 8px; grid-auto-flow: column;
  border: 1px solid var(--border); padding: 9px 14px; font-size: 13px; font-weight: var(--w-semibold);
  letter-spacing: .08em; text-transform: uppercase; color: var(--text); }
.fav.wide::after { content: 'Favourite'; }
.fav.wide.on { border-color: var(--cta); color: var(--cta); }
.fav.wide.on::after { content: 'Favourited'; }
.card.active { border: 2px solid var(--primary); padding: 15px; }
a.card:hover { border-color: var(--text-muted); }
.ti { width: 15px; height: 15px; flex: none; }
.card .type { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; padding-right: 30px; min-height: 17px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--primary); font-weight: var(--w-semibold); }
.card .type.amber { color: var(--cta); }
.card .type .dot { color: var(--text-muted); letter-spacing: 0; }
.card h4 { font-size: 17px; margin: 6px 0 4px; }
.card .meta { font-size: 13px; color: var(--text-muted); }
.card .blurb { font-size: 14px; color: var(--text-muted); margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
/* On the type row, not in the corner: the corner belongs to the star, which is the
   control. Two icons stacked on one another was the whole problem. */
.card .state { width: 16px; height: 16px; flex: none; color: var(--primary); }
.card .state.prog { color: var(--cta); }
.card.done h4 { color: var(--text-muted); }
/* One line at the top of a list instead of a chip on every card in it. Twenty-odd
   Demo chips stop being read; one banner above them does not. */
.demobar { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--cta); border-left-width: 3px;
  padding: 12px 14px; margin-top: 16px; font-size: 13.5px; color: var(--text-muted); line-height: 1.5; }
.demobar svg { width: 17px; height: 17px; flex: none; color: var(--cta); margin-top: 1px; }
.demobar b { color: var(--cta); font-weight: var(--w-semibold); letter-spacing: .08em; text-transform: uppercase; font-size: 11px; display: block; margin-bottom: 3px; }
.demo { display: inline-block; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); border: 1px solid var(--border-quiet); padding: 2px 6px; font-weight: var(--w-semibold); }
.prog { height: 4px; background: var(--surface-raised); margin: 12px 0 6px; }
.prog i { display: block; height: 100%; background: var(--cta); transition: width .3s ease; }
.prog.green i { background: var(--primary); }
.row-list .card { display: grid; grid-template-columns: 28px 1fr 22px; gap: 12px; align-items: center; padding: 12px 14px; }
.row-list .card .n { font-size: 12px; color: var(--text-muted); font-weight: var(--w-semibold); }
.row-list .card h4 { margin: 0; font-size: 15px; }
.row-list .card .meta { margin-top: 3px; display: flex; align-items: center; gap: 7px; }
.row-list .card .state { position: static; }
.grid2 { display: grid; gap: 10px; grid-template-columns: 1fr; }
/* One height for all of them. A title on one line against two, or a blurb that runs
   short, used to leave the rows ragged; the card now holds its shape and the text
   sits at the top of it. */
/* Two lines of type, two of title, two of blurb — one height for every card on the
   page, not just within a section, since each group renders its own grid. Measured
   against the longest of them at every width, with 6px to spare. */
.grid2 .card { height: 192px; }
.grid2 .card h4 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
@media (min-width: 720px) { .grid2 { grid-template-columns: 1fr 1fr; } .grid2 .card + .card { margin-top: 0; } }

/* ---- home ---- */
.hero { padding: 22px 0 6px; }
.hero h1 { font-size: 30px; line-height: 1.12; }
@media (min-width: 960px) { .hero h1 { font-size: 40px; } }
.hero p { color: var(--text-muted); margin-top: 8px; }
.hero-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; }
.hero-row .btn { flex: none; }
/* the import panel: longer than a confirm, so it scrolls rather than running off */
dialog.wide { width: min(94vw, 520px); max-height: 86vh; overflow: auto; }
dialog.wide .lead { color: var(--text-muted); font-size: 15px; margin-top: 4px; }
dialog.wide .label { margin-top: 20px; }
dialog.wide ul { margin: 8px 0 0; padding-left: 18px; font-size: 14px; line-height: 1.55; }
dialog.wide li { margin: 5px 0; }
dialog.wide .status { margin-top: 20px; border-left: 2px solid var(--cta); padding: 2px 0 2px 12px; font-size: 14px; color: var(--text-muted); }
.bignum { font-size: 44px; font-weight: var(--w-bold); line-height: 1; letter-spacing: -.02em; color: var(--primary); }
.bignum small { font-size: 16px; font-weight: var(--w-regular); color: var(--text-muted); letter-spacing: 0; margin-left: 6px; }

/* ---- learn ---- */
.search { display: flex; align-items: center; gap: 10px; background: var(--surface-raised); border: 1px solid var(--border); padding: 0 14px; height: 52px; margin-top: 14px; }
.search svg { width: 18px; height: 18px; color: var(--text-muted); flex: none; }
.search input { flex: 1; background: none; border: 0; color: var(--text); font: inherit; font-size: 16px; min-width: 0; }
.search input::placeholder { color: var(--text-muted); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: var(--w-semibold); padding: 8px 12px; border: 1px solid var(--border-quiet); color: var(--text-muted); }
.chips button.on { border-color: var(--primary); color: var(--primary); background: var(--primary-tint); }
.empty { padding: 40px 20px; text-align: center; color: var(--text-muted); border: 1px dashed var(--border-quiet); }

/* ---- item ---- */
.back { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: var(--w-semibold); color: var(--primary); padding: 18px 0 14px; }
.back svg { width: 16px; height: 16px; }
.item-head .type { display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--primary); font-weight: var(--w-semibold); }
.item-head h1 { font-size: 28px; line-height: 1.15; margin: 10px 0 8px; }
@media (min-width: 960px) { .item-head h1 { font-size: 36px; } }
.item-head .meta { font-size: 14px; color: var(--text-muted); }
.item-head .blurb { margin-top: 12px; }
.done-banner { display: flex; align-items: center; gap: 12px; background: var(--primary); color: var(--text-on-primary); padding: 12px 14px; margin-top: 18px; font-size: 14px; font-weight: var(--w-medium); }
.done-banner svg { width: 20px; height: 20px; flex: none; }
.done-banner b { font-weight: var(--w-semibold); }
.frame { margin-top: 20px; border: 1px solid var(--border); background: #000; position: relative; }
.frame iframe { display: block; width: 100%; height: 62vh; min-height: 380px; border: 0; background: #000; }
@media (min-width: 720px) { .frame iframe { height: auto; aspect-ratio: 16 / 9; min-height: 0; } }
/* An item that knows the shape of its capture sets --ratio, and the frame takes that
   shape at every width instead of the 16/9 a screen recording assumes. A photo of the
   lockers is portrait; in a 16/9 box it scrolled inside its own iframe. */
.frame.shaped iframe { height: auto; aspect-ratio: var(--ratio); min-height: 0; max-height: 78vh; }
@media (min-width: 720px) { .frame.shaped iframe { aspect-ratio: var(--ratio); max-height: 72vh; } }
.frame.shaped { max-width: calc(78vh * var(--ratio)); margin-left: auto; margin-right: auto; }
@media (min-width: 720px) { .frame.shaped { max-width: calc(72vh * var(--ratio)); } }
.frame-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; align-items: center; }
.frame-actions .note { font-size: 13px; color: var(--text-muted); flex: 1 1 100%; }
@media (min-width: 720px) { .frame-actions .note { flex: 1; } }
.video-ph { margin-top: 20px; aspect-ratio: 16 / 9; border: 1px solid var(--border-quiet); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 20px; color: var(--text-muted); }
.video-ph svg { width: 64px; height: 64px; color: var(--text); }
video { display: block; width: 100%; margin-top: 20px; background: #000; border: 1px solid var(--border); }
.steps { margin: 20px 0 0; padding: 0; list-style: none; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 32px 1fr 28px; gap: 14px; align-items: start; padding: 14px 0; border-top: 1px solid var(--border-quiet); }
.steps li:first-child { border-top: 0; }
.steps li .n { counter-increment: s; font-size: 13px; font-weight: var(--w-semibold); color: var(--primary); padding-top: 3px; }
.steps li .n::before { content: counter(s, decimal-leading-zero); }
.steps li p { margin: 0; }
.steps li.done p { color: var(--text-muted); text-decoration: line-through; text-decoration-color: var(--border); }
.tick { width: 28px; height: 28px; border: 1.5px solid var(--text-muted); border-radius: 50%; display: grid; place-items: center; color: transparent; }
.tick svg { width: 14px; height: 14px; }
li.done .tick { border-color: var(--primary); background: var(--primary); color: var(--text-on-primary); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; align-items: center; }
.actions .note { font-size: 13px; color: var(--text-muted); flex: 1 1 100%; }
.article { margin-top: 20px; max-width: 64ch; }
.article p { margin-bottom: 1em; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 36px; }
.pager a { border: 1px solid var(--border-quiet); padding: 12px 14px; color: inherit; }
.pager a:hover { border-color: var(--text-muted); }
.pager a .k { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted); font-weight: var(--w-semibold); display: block; margin-bottom: 4px; }
.pager a .t { font-size: 14px; display: block; }
.pager a.next { text-align: right; }

/* ---- look around: the floorplan ---- */
.plan { margin-top: 18px; border: 1px solid var(--border); background: var(--surface); padding: 10px;
  display: flex; justify-content: center; }
/* A portrait plan at full column width runs off the bottom of a phone and you never
   see the whole room at once, which is the one thing a plan is for. Height leads and
   the width follows the shape. */
.plan svg { display: block; width: auto; height: auto; max-width: 100%; max-height: 54vh; }
@media (min-width: 900px) { .plan svg { max-height: 62vh; } }
.zone rect { fill: var(--surface-raised); stroke: var(--border); stroke-width: 1px; vector-effect: non-scaling-stroke; transition: fill .18s, stroke .18s; }
.zone text { fill: var(--text-muted); font-size: 3.4px; font-weight: var(--w-semibold); letter-spacing: .04em;
  text-anchor: middle; dominant-baseline: middle; transition: fill .18s; text-transform: uppercase; }
.zone { cursor: pointer; }
.zone:hover rect { stroke: var(--text-muted); }
/* a hit: the area the search found. Fill and stroke both move, because a stroke alone
   is easy to miss on a plan this size and on a phone in a bright room. */
.zone.hit rect { fill: color-mix(in srgb, var(--primary) 26%, var(--surface-raised)); stroke: var(--primary); stroke-width: 2px; }
.zone.hit text { fill: var(--text); }
.zone.sel rect { fill: color-mix(in srgb, var(--cta) 30%, var(--surface-raised)); stroke: var(--cta); stroke-width: 2px; }
.zone.sel text { fill: var(--text); }
/* searching with no match here: everything else steps back so the hits read */
.plan.filtering .zone:not(.hit):not(.sel) rect { opacity: .45; }
.plan.filtering .zone:not(.hit):not(.sel) text { opacity: .5; }
.plan-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.taglist { display: flex; flex-wrap: nowrap; gap: 8px; margin-top: 14px; overflow-x: auto; scrollbar-width: none;
  /* one row that scrolls, rather than three rows of pills pushing the plan off screen.
     The gutter padding is negative-margined back so the row can run to both edges. */
  margin-left: calc(var(--gutter) * -1); margin-right: calc(var(--gutter) * -1);
  padding: 2px var(--gutter); }
.taglist::-webkit-scrollbar { display: none; }
.taglist button { background: none; border: 1px solid var(--border); color: var(--text-muted); font-size: 13px;
  padding: 6px 12px; font-weight: var(--w-medium); text-transform: capitalize; flex: none; white-space: nowrap; }
.taglist button.on { border-color: var(--primary); color: var(--primary); }

/* ---- a pin per machine ---- */
.pin { cursor: pointer; }
/* Strokes are in viewBox units, and the plan draws ~3.5 units to the pixel — a
   stroke-width of 1 came out ten pixels wide and swallowed the pin. Every stroke
   on a pin is non-scaling, so it is the width it says whatever the plan is scaled to. */
.pin path { fill: var(--cta); stroke: var(--bg); stroke-width: 1.5px; vector-effect: non-scaling-stroke; }
.pin circle:not(.hit) { fill: var(--bg); }
/* the tap target, invisible and much bigger than the pin: a 4-unit teardrop is
   about 14px on a phone, well under what a thumb can hit */
.pin .hit { fill: transparent; stroke: none; }
.pin:hover path, .pin:focus-visible path { fill: var(--primary); }
.pin.on path { fill: var(--primary); }
.pin.on circle:not(.hit) { r: 1.4; }
.pin:focus-visible { outline: none; }
.pin:focus-visible path { stroke: #fff; stroke-width: 2px; vector-effect: non-scaling-stroke; }
.eqtip { position: fixed; z-index: 60; max-width: min(78vw, 280px); background: var(--surface-raised);
  border: 1px solid var(--primary); padding: 10px 12px; pointer-events: none; opacity: 0;
  transition: opacity .14s; transform: translate(-50%, -100%); }
.eqtip.show { opacity: 1; }
.eqtip b { display: block; font-size: 14px; font-weight: var(--w-semibold); }
.eqtip .w { font-size: 12px; color: var(--primary); text-transform: uppercase; letter-spacing: .08em; margin-top: 2px; }
.eqtip .t { font-size: 12px; color: var(--text-muted); text-transform: capitalize; margin-top: 4px; }
.eqtip .n { font-size: 12.5px; color: var(--text); margin-top: 6px; line-height: 1.45; }
.sites { display: flex; gap: 8px; margin-top: 14px; }
.sites button { background: none; border: 1px solid var(--border); color: var(--text-muted); font-size: 13px;
  padding: 7px 14px; font-weight: var(--w-medium); }
.sites button.on { border-color: var(--primary); color: var(--primary); }

/* ---- what's new ---- */

.chip2.drv { color: var(--primary); border-color: color-mix(in srgb, var(--primary) 40%, transparent); }
.pdet { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 10px 16px; font-size: 14px; margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border-quiet); }

.drafts-note { font-size: 13px; color: var(--text-muted); border: 1px dashed var(--border-quiet); padding: 14px; margin-top: 18px; line-height: 1.5; }

.tile { background: var(--surface); border: 1px solid var(--border-quiet); padding: 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }

.tile .v { font-size: 28px; font-weight: var(--w-semibold); line-height: 1.1; letter-spacing: -.01em; }

.plot .yl { position: absolute; right: calc(100% + 8px); transform: translateY(-50%); font-size: 11px; color: var(--text-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

<!-- @config -->
<script>
(function () {
  'use strict';
  const CFG = JSON.parse(document.getElementById('portal-config').textContent);
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const byId = Object.fromEntries(CFG.items.map(i => [i.id, i]));
  /* Sent as a single file the portal cannot reach a sibling content/ folder, so the
     build inlines each simulation and the frame is given srcdoc instead of src. One
     copy of a file serves every item pointing at it; the query string that used to
     carry the placeholder's title and step count rides on the frame's name. */
  const SIMS = (() => { const n = document.getElementById('portal-sims'); try { return n ? JSON.parse(n.textContent) : null; } catch (e) { return null; } })();
  const simSrc = it => { if (!SIMS || !it.src) return null; const [f, q] = it.src.split('?'); return SIMS[f] ? { html: SIMS[f], name: q || '' } : null; };
  const TYPE = { simulation: 'Simulation', hotspot: 'Interactive photo', video: 'Video', guide: 'Guide', checklist: 'Checklist', article: 'Article', link: 'Link' };

  // ---- state ------------------------------------------------------------
  const KEY = CFG.storageKey;
  const fresh = () => ({ name: '', audience: 'employee', landed: false, returnTo: null, unlocked: {}, drafts: [], posts: [], items: {}, checks: {}, favs: [], lastOpened: null, created: new Date().toISOString() });
  let S = fresh();
  try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

  const aud = () => CFG.audiences.find(a => a.id === S.audience) || CFG.audiences[0];
  const unlocked = id => { const a = CFG.audiences.find(x => x.id === id); return !a || !a.key || !!S.unlocked[id]; };
  /* Who sees whose content. It used to be a rule — everyone above an employee sees
     employee content — which was right until members arrived, who must see none of it.
     Each audience now says so itself, and the old rule is the default. */
  const seesOf = a => a.sees || (a.id === 'employee' ? ['employee'] : ['employee', a.id]);
  const visible = () => { const s = seesOf(aud()); return CFG.items.filter(i => s.includes(i.audience)); };
  const pathFor = a => CFG.paths.find(p => p.audience === a);
  /* Favourites: the one you keep coming back for — the sauna speaker, every time.
     Most recent first, kept on the device like everything else here, so it is a
     shortcut rather than an account. */
  const isFav = id => (S.favs || []).includes(id);
  const favs = () => (S.favs || []).map(id => byId[id]).filter(i => i && seesOf(aud()).includes(i.audience));
  function toggleFav(id) { S.favs = S.favs || []; const i = S.favs.indexOf(id);
    if (i < 0) S.favs.unshift(id); else S.favs.splice(i, 1); save(); return i < 0; }
  const status = id => (S.items[id] && S.items[id].status) || 'new';
  const isDone = id => status(id) === 'complete';
  const pathProgress = p => { const done = p.items.filter(isDone).length; return { done, total: p.items.length, pct: p.items.length ? Math.round(done / p.items.length * 100) : 0 }; };

  function complete(id, extra) {
    const it = byId[id]; if (!it) return;
    const was = isDone(id);
    S.items[id] = Object.assign({}, S.items[id], { status: 'complete', completedAt: new Date().toISOString() }, extra || {});
    save();
    if (!was) toast('Completed: ' + it.title);
    render();
  }
  function start(id) {
    if (!S.items[id]) { S.items[id] = { status: 'in-progress', startedAt: new Date().toISOString() }; }
    S.lastOpened = id; save();
  }

  // ---- routing ----------------------------------------------------------
  function route() {
    const h = location.hash.replace(/^#\/?/, '') || 'home';
    const [pathPart, qs] = h.split('?');
    const seg = pathPart.split('/');
    return { view: seg[0] || 'home', id: seg[1] || null, q: new URLSearchParams(qs || '') };
  }
  const go = h => { location.hash = '#/' + String(h).replace(/^#?\/?/, ''); };
  window.addEventListener('hashchange', render);

  // ---- chrome -----------------------------------------------------------
  const navIcon = { home: 'i-home', lookaround: 'i-plan', learn: 'i-learn', reports: 'i-reports', news: 'i-news', support: 'i-support', me: 'i-me' };
  const navItems = () => CFG.nav.filter(n => !n.audiences || n.audiences.includes(S.audience));
  function renderNav() {
    const r = route(); const cur = r.view === 'item' ? 'learn' : (r.view === 'process' ? 'processes' : r.view); const nav = navItems();
    const link = n => `<a href="#/${n.id}" ${cur === n.id ? 'aria-current="page"' : ''}><svg><use href="#${navIcon[n.id]}"/></svg><span>${esc(n.label)}</span></a>`;
    $('#tabbar').innerHTML = nav.map(link).join('');
    $('#tabbar').style.gridTemplateColumns = `repeat(${nav.length}, 1fr)`;
    $('#tabbar').dataset.n = nav.length;
    $('#rail-nav').innerHTML = nav.map(link).join('');
    $('#menu-nav').innerHTML = nav.map(n => `<a href="#/${n.id}" data-close>${esc(n.label)}</a>`).join('');
    const audHtml = CFG.audiences.map(a => `<button type="button" data-aud="${a.id}" data-c="${a.colour}" class="${a.id === S.audience ? 'on' : ''}" aria-pressed="${a.id === S.audience}">${a.key && !S.unlocked[a.id] ? '<svg><use href="#i-lock"/></svg>' : ''}${esc(a.label)}</button>`).join('');
    ['#rail-aud', '#menu-aud'].forEach(s => { $(s).innerHTML = audHtml; });
    $('#rail-login').href = CFG.client.memberLogin; $('#menu-login').href = CFG.client.memberLogin;
    $('#rail-foot').textContent = CFG.client.tradingName + ' · ' + CFG.client.site;
    $('#menu-fine').textContent = CFG.client.tradingName + ' · ' + CFG.client.address;
    $('#footer').textContent = CFG.footer;
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-aud]'); if (b) { switchAudience(b.dataset.aud); return; }
    const fb = e.target.closest('[data-fav]');
    if (fb) { e.preventDefault(); const on = toggleFav(fb.dataset.fav); toast(on ? 'Added to favourites' : 'Removed from favourites'); renderBody(); return; }
    const cp = e.target.closest('[data-copy]');
    if (cp) { const v = cp.dataset.copy; copyText(v).then(ok => toast(ok ? (cp.dataset.what || 'Value') + ' copied: ' + v : 'Copy is blocked here. Long-press the text to select it.')); return; }
    const g = e.target.closest('[data-contact]'); if (g) { openContact(+g.dataset.contact); return; }
    if (e.target.closest('[data-close]')) closeMenu();
  });
  function switchAudience(id) {
    const a = CFG.audiences.find(x => x.id === id); if (!a) return;
    if (a.key && !S.unlocked[id]) { askKey(a); return; }
    S.audience = id; save(); closeMenu(); enter();
  }
  function enter() {
    const back = S.returnTo && !/welcome/.test(S.returnTo) ? S.returnTo : '#/home';
    S.landed = true; S.returnTo = null; save();
    if (location.hash === back) render(); else location.hash = back;
  }
  const openMenu = () => { $('#menu').classList.add('open'); document.body.style.overflow = 'hidden'; };
  const closeMenu = () => { $('#menu').classList.remove('open'); document.body.style.overflow = ''; };
  $('#open-menu').addEventListener('click', openMenu);
  $('#close-menu').addEventListener('click', closeMenu);
  $('#menu-export').addEventListener('click', () => { closeMenu(); exportCard(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });

  // ---- dialogs ----------------------------------------------------------
  function askName() {
    const d = $('#dlg-name'); $('#name-input').value = S.name || '';
    d.showModal();
    $('#name-save').onclick = () => { S.name = $('#name-input').value.trim(); save(); d.close(); render(); };
    $('#name-skip').onclick = () => { S.name = ''; S.nameSkipped = true; save(); d.close(); render(); };
  }
  function askKey(a) {
    const d = $('#dlg-key'); $('#key-title').textContent = a.label + ' area'; $('#key-text').textContent = a.intro + ' Enter the access key to continue. It is remembered on this device.';
    $('#key-input').value = ''; $('#key-err').textContent = '';
    d.showModal(); setTimeout(() => $('#key-input').focus(), 30);
    const tryKey = () => {
      const v = $('#key-input').value.trim().toUpperCase();
      if (v && v === String(a.key).toUpperCase()) { S.unlocked[a.id] = true; S.audience = a.id; save(); d.close(); closeMenu(); enter(); toast(a.label + ' area unlocked'); }
      else { $('#key-err').textContent = 'That key does not match. Check with the manager on duty.'; $('#key-input').select(); }
    };
    $('#key-unlock').onclick = tryKey;
    $('#key-input').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); tryKey(); } };
    $('#key-cancel').onclick = () => d.close();
  }
  function openContact(i) {
    const c = (CFG.support.assistance || [])[i]; if (!c) return;
    const d = $('#dlg-contact');
    $('#contact-name').textContent = c.name;
    $('#contact-role').textContent = c.role;
    const row = (icon, k, v, href, open) => `<div class="crow"><button type="button" class="copy" data-copy="${esc(v)}" data-what="${esc(k)}"><svg><use href="#${icon}"/></svg><span><span class="k">${esc(k)} · tap to copy</span><span class="v">${esc(v)}</span></span></button><a class="open" href="${esc(href)}" aria-label="${esc(open)}"><svg><use href="#i-ext"/></svg></a></div>`;
    $('#contact-rows').innerHTML = [
      c.email ? row('i-mail', 'Email', c.email, 'mailto:' + encodeURI(c.email), 'Open in your email app') : '',

  // ---- reports ------------------------------------------------------------
  const fmt = n => typeof n === 'number' ? n.toLocaleString('en-AU') : String(n);
  function spark(vals) {
    const W = 100, H = 30, pad = 3; const min = Math.min(...vals), max = Math.max(...vals); const span = (max - min) || 1;
    const pts = vals.map((v, i) => [pad + i * (W - 2 * pad) / (vals.length - 1), H - pad - (v - min) / span * (H - 2 * pad)]);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const [lx, ly] = pts[pts.length - 1];
    return `<div class="sparkwrap"><svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="var(--text-muted)" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg><span class="dot" style="left:${(lx / W * 100).toFixed(2)}%;top:${(ly / H * 100).toFixed(2)}%"></span></div>`;
  }
  function kpiTile(t) {
    const neg = /^[−-]/.test(String(t.delta || '')); const dir = t.delta ? ((neg ? !t.upIsGood : t.upIsGood) ? 'up' : 'down') : '';
    return `<div class="tile"><span class="k">${esc(t.label)}</span><span class="v">${esc(t.value)}</span>${t.sub ? `<span class="sub">${esc(t.sub)}</span>` : ''}${t.delta ? `<span class="d ${dir}"><b>${neg ? '▼' : '▲'} ${esc(t.delta)}</b> ${esc(t.deltaLabel || '')}</span>` : ''}${Array.isArray(t.trend) && t.trend.length > 1 ? spark(t.trend) : ''}</div>`;
  }
  function lineChart(c) {
    const vals = c.values, n = vals.length, li = n - 1; const min = Math.min(...vals), max = Math.max(...vals);
    const lo = Math.floor(min / 50) * 50, hi = Math.ceil(max / 50) * 50; const span = (hi - lo) || 1;
    const PT = 10, PB = 4; // percent padding top and bottom inside the plot
    const x = i => i * 100 / li, y = v => PT + (100 - PT - PB) * (1 - (v - lo) / span);
    const ticks = [lo, lo + span / 2, hi];
    const d = vals.map((v, i) => (i ? 'L' : 'M') + x(i).toFixed(2) + ' ' + y(v).toFixed(2)).join(' ');
    const grid = ticks.map(t => `<line x1="0" x2="100" y1="${y(t).toFixed(2)}" y2="${y(t).toFixed(2)}" stroke="var(--border-quiet)" stroke-width="1" vector-effect="non-scaling-stroke"/>`).join('');
    const ylabels = ticks.map(t => `<span class="yl" style="top:${y(t).toFixed(2)}%">${fmt(Math.round(t))}</span>`).join('');
    const hits = vals.map((v, i) => `<rect x="${(x(i) - 50 / li).toFixed(2)}" y="0" width="${(100 / li).toFixed(2)}" height="100" fill="transparent" data-tip="<b>${esc(c.months[i])}</b> · ${fmt(v)}"/>`).join('');
    return `<div class="chart"><h3>${esc(c.title)}</h3><div class="sub">${esc(c.months[0])} to ${esc(c.months[li])}</div>
      <div class="plot">${ylabels}<svg viewBox="0 0 100 100" preserveAspectRatio="none" role="img" aria-label="${esc(c.title)}">${grid}<path d="${d}" fill="none" stroke="var(--primary)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/>${hits}</svg><span class="dot" style="left:100%;top:${y(vals[li]).toFixed(2)}%"></span><span class="end" style="left:100%;top:${y(vals[li]).toFixed(2)}%">${fmt(vals[li])}</span></div>
      <div class="xl">${c.months.map((m, i) => (i === 0 || i === li || i === Math.floor(li / 2)) ? `<span>${esc(m)}</span>` : '').join('')}</div>
      ${tableView(['Month', 'Members'], c.months.map((m, i) => [m, fmt(vals[i])]))}</div>`;
  }
  function barChart(c) {
    const max = c.max || Math.max(...c.rows.map(r => r[1]));
    return `<div class="chart"><h3>${esc(c.title)}</h3><div class="sub">${esc(c.unit === '%' ? 'Per cent of capacity' : 'Number of ' + (c.unit || ''))}</div>
      <div class="hbars">${c.rows.map(([l, v]) => `<div class="hbar" data-tip="<b>${esc(l)}</b> · ${fmt(v)}${c.unit === '%' ? '%' : ''}"><span class="l">${esc(l)}</span><span class="t"><i style="width:${Math.max(0, Math.min(100, v / max * 100)).toFixed(1)}%"></i></span><span class="n">${fmt(v)}${c.unit === '%' ? '%' : ''}</span></div>`).join('')}</div>
      ${tableView(['', c.unit === '%' ? '%' : (c.unit || '')], c.rows.map(([l, v]) => [l, fmt(v)]))}</div>`;
  }
  const tableView = (head, rows) => `<details class="tbl"><summary>Table</summary><table><thead><tr>${head.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></details>`;
  function viewReports() {
    const R = CFG.reports; if (!R) return `<div class="empty" style="margin-top:24px">No reports are configured.</div>`;
    if (R.audiences && !R.audiences.includes(S.audience)) { go('home'); return ''; }
    const ep = pathFor('employee'); const pr = pathProgress(ep);
    const I = R.import;
    return `<div class="hero"><div class="hero-row"><div><h1>${esc(R.title || 'Reports')}</h1><p>${esc(R.asOf || '')}${R.demo ? ' <span class="demo">Demo</span>' : ''}</p></div>
      ${I ? `<button class="btn outline small" id="imp-open" type="button"><svg><use href="#i-import"/></svg>${esc(I.label || 'Import data')}${I.demo ? ' <span class="demo">Soon</span>' : ''}</button>` : ''}</div></div>
      <div class="kpi">${(R.tiles || []).map(kpiTile).join('')}</div>
      <div class="section">${R.members ? lineChart(R.members) : ''}${R.cancellations ? barChart(R.cancellations) : ''}${R.recoverBlocks ? barChart(R.recoverBlocks) : ''}${R.classes ? barChart(R.classes) : ''}</div>
      <div class="section"><div class="label">Team onboarding</div><div class="card"><div class="type">${esc(ep.title)}</div><div class="bignum" style="margin-top:6px">${pr.done}<small>of ${pr.total} on this device</small></div><p class="muted" style="font-size:14px;margin-top:10px">Progress lives on each person's own device. A team view across devices is the first thing that needs hosting; until then, managers read the progress cards their starters export from Me.</p></div></div>
      ${R.note ? `<p class="muted" style="font-size:13px;margin-top:22px">${esc(R.note)}</p>` : ''}`;
  }
  function wireTips() {
    const tip = $('#tip'); let cur = null;
    const show = (el, x, y) => { tip.innerHTML = el.dataset.tip; tip.style.left = x + 'px'; tip.style.top = y + 'px'; tip.classList.add('show'); tip.setAttribute('aria-hidden', 'false'); };
    const hide = () => { tip.classList.remove('show'); tip.setAttribute('aria-hidden', 'true'); cur = null; };
    const view = $('#view');
    view.onpointermove = e => { const el = e.target.closest('[data-tip]'); if (!el) { if (cur) hide(); return; } cur = el; show(el, e.clientX, e.clientY); };
    view.onpointerleave = hide; view.onpointerdown = e => { const el = e.target.closest('[data-tip]'); if (el) { show(el, e.clientX, e.clientY); setTimeout(hide, 1800); } };
  }

  // ---- look around: the floorplan ---------------------------------------
  /* A search matches an equipment name or one of its tags, and every zone holding a
     match lights up, with a pin on each machine that matched. Tapping a zone picks it
     instead and pins everything in it — the other way people use a plan: not "where is
     the leg press" but "what is over there". Pins only ever show for what was asked
     for; fifty-one at once is a plan nobody can read. */
  const planRoot = () => CFG.floorplans || (CFG.floorplan ? { title: CFG.floorplan.title, intro: CFG.floorplan.intro, placeholder: CFG.floorplan.placeholder, sites: [CFG.floorplan] } : null);
  const planSites = () => (planRoot() || {}).sites || [];
  const planSite = id => planSites().find(x => x.id === id) || planSites()[0] || null;
  let SITE = null;   // the site the view is currently drawing
  const planTags = () => { const seen = []; (SITE.equipment || []).forEach(e => (e.tags || []).forEach(t => { if (!seen.includes(t)) seen.push(t); })); return seen.sort(); };
  const zoneById = id => (SITE.zones || []).find(z => z.id === id);
  function planMatches(q) {
    const t = q.trim().toLowerCase(); if (!t) return null;
    return (SITE.equipment || []).filter(e =>
      e.name.toLowerCase().includes(t) ||
      (e.tags || []).some(g => g.toLowerCase().includes(t) || t.includes(g.toLowerCase())) ||
      ((zoneById(e.zone) || {}).label || '').toLowerCase().includes(t));
  }
  const planTitle = R => {
    const base = R.title || 'Look around';
    const site = planSites().length && SITE ? ` ${CFG.client.name} (${SITE.label})` : '';
    return base + site;
  };

  function viewLook(r) {
    const R = planRoot(); if (!R) return `<div class="empty" style="margin-top:24px">No floorplan is configured.</div>`;
    SITE = planSite(r.q.get('site')); if (!SITE) return `<div class="empty" style="margin-top:24px">No floorplan is configured.</div>`;
    const q = r.q.get('q') || ''; const sel = r.q.get('zone') || '';
    const hits = planMatches(q);
    const hitZones = hits ? new Set(hits.map(e => e.zone)) : new Set();
    const filtering = !!(hits || sel);
    const shown = sel ? (SITE.equipment || []).filter(e => e.zone === sel) : (hits || []);
    const selZone = sel ? zoneById(sel) : null;
    const idx = e => (SITE.equipment || []).indexOf(e);

    const zones = (SITE.zones || []).map(z => {
      const cls = z.id === sel ? 'sel' : (hitZones.has(z.id) ? 'hit' : '');
      const n = hits ? hits.filter(e => e.zone === z.id).length : 0;
      // with pins on it the label gets out of the middle and sits along the top
      const ly = filtering ? z.y + 4 : z.y + z.h / 2;
      return `<g class="zone ${cls}" data-zone="${esc(z.id)}" role="button" tabindex="0"
        aria-label="${esc(z.label)}${n ? `, ${n} match${n > 1 ? 'es' : ''}` : ''}">
        <rect x="${z.x}" y="${z.y}" width="${z.w}" height="${z.h}"/>
        <text x="${z.x + z.w / 2}" y="${ly}">${esc(z.label)}</text>
      </g>`;
    }).join('');

    const pins = shown.filter(e => e.x != null && e.y != null).map(e => `<g class="pin" data-eq="${idx(e)}" role="button" tabindex="0" aria-label="${esc(e.name)}, ${esc((zoneById(e.zone) || {}).label || '')}">
      <circle class="hit" cx="${e.x}" cy="${e.y - 2}" r="5"/>
      <path d="M${e.x} ${e.y} l-2.1 -3.2 a2.55 2.55 0 1 1 4.2 0 z"/>
      <circle cx="${e.x}" cy="${e.y - 4}" r="0.95"/>
    </g>`).join('');

    let html = `<div class="hero"><h1>${esc(planTitle(R))}</h1><p>${esc(R.intro || '')}${SITE.demo ? ' <span class="demo">Demo</span>' : ''}</p></div>`;
    if (planSites().length > 1) html += `<div class="sites">${planSites().map(x => `<button type="button" data-site="${esc(x.id)}" class="${x.id === SITE.id ? 'on' : ''}">${esc(x.label)}</button>`).join('')}</div>`;
    html += `<label class="search"><svg><use href="#i-search"/></svg><input id="pq" type="search" placeholder="${esc(R.placeholder || 'Search')}" value="${esc(q)}" aria-label="Search equipment"></label>
      <div class="taglist">${planTags().map(t => `<button type="button" data-tag="${esc(t)}" class="${q.toLowerCase() === t ? 'on' : ''}">${esc(t)}</button>`).join('')}</div>
      <div class="plan ${filtering ? 'filtering' : ''}"><svg viewBox="${esc(SITE.viewBox || '0 0 100 134')}" role="img" aria-label="Floorplan of ${esc(CFG.client.tradingName)}, ${esc(SITE.label)}">${zones}${pins}</svg></div>`;

    if (selZone) {
      html += `<div class="section"><div class="section-head"><h3>${esc(selZone.label)}</h3><a href="#/lookaround${q ? '?q=' + encodeURIComponent(q) : ''}">Clear</a></div>
        ${selZone.blurb ? `<p class="muted" style="font-size:14px;margin:-4px 0 8px">${esc(selZone.blurb)}</p>` : ''}
        <div class="found">${shown.map(e => planRow(e, idx(e))).join('')}</div></div>`;
    } else if (hits) {
      html += hits.length
        ? `<div class="section"><div class="section-head"><h3>${hits.length} match${hits.length > 1 ? 'es' : ''}</h3><span class="muted" style="font-size:13px">in ${hitZones.size} area${hitZones.size > 1 ? 's' : ''}</span></div><div class="found">${hits.map(e => planRow(e, idx(e))).join('')}</div></div>`
        : `<div class="empty" style="margin-top:16px">Nothing matches “${esc(q)}”. Try a body part like legs or back, or ask us at the desk.</div>`;
    } else {
      html += `<p class="muted" style="font-size:14px;margin-top:14px">Tap an area to see what is in it, or search above.</p>`;
    }
    if (SITE.note) html += `<p class="muted" style="font-size:13px;margin-top:22px">${esc(SITE.note)}</p>`;
    return html;
  }
  const planRow = (e, i) => `<div class="row" data-row="${i}"><b>${esc(e.name)}</b><span class="where">${esc((zoneById(e.zone) || {}).label || '')}</span>
    <span class="tg">${esc((e.tags || []).join(' · '))}</span>${e.note ? `<span class="nt">${esc(e.note)}</span>` : ''}</div>`;

  function wireLook() {
    const setQ = v => {
      const r = route(); const p = new URLSearchParams();
      const sv = r.q.get('site'); if (sv) p.set('site', sv);
      if (v) p.set('q', v);
      history.replaceState(null, '', '#/lookaround' + (p.toString() ? '?' + p : ''));
      renderBody();
      const i2 = $('#pq'); if (i2 && document.activeElement !== i2) { i2.focus(); i2.setSelectionRange(i2.value.length, i2.value.length); }
    };
    const input = $('#pq');
    if (input) { let tm; input.addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(() => setQ(input.value), 180); }); }
    document.querySelectorAll('[data-tag]').forEach(b => b.addEventListener('click', () => {
      setQ(route().q.get('q') === b.dataset.tag ? '' : b.dataset.tag);
    }));
    document.querySelectorAll('[data-site]').forEach(b => b.addEventListener('click', () => go('/lookaround?site=' + b.dataset.site)));
    const pick = z => { const r = route(); const p = new URLSearchParams();
      const sv = r.q.get('site'); if (sv) p.set('site', sv);
      const qv = r.q.get('q'); if (qv) p.set('q', qv);
      if (r.q.get('zone') !== z) p.set('zone', z);
      go('/lookaround' + (p.toString() ? '?' + p : '')); };
    document.querySelectorAll('[data-zone]').forEach(g => {
      g.addEventListener('click', e => { if (e.target.closest('.pin')) return; pick(g.dataset.zone); });
      g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(g.dataset.zone); } });
    });
    wirePins();
  }

  /* The pin tooltip. Hover shows it and moving away hides it, which is the desktop
     behaviour; a tap makes it stick, because a phone has no hover and a tooltip that
     vanishes on lift is a tooltip nobody gets to read. */
  function wirePins() {
    const pins = [...document.querySelectorAll('.pin')]; if (!pins.length) return;
    let tip = $('#eqtip');
    if (!tip) { tip = document.createElement('div'); tip.id = 'eqtip'; tip.className = 'eqtip'; tip.setAttribute('role', 'tooltip'); document.body.appendChild(tip); }
    let stuck = null;
    const eqOf = g => (SITE.equipment || [])[+g.dataset.eq];
    const show = g => {
      const e = eqOf(g); if (!e) return;
      tip.innerHTML = `<b>${esc(e.name)}</b><span class="w">${esc((zoneById(e.zone) || {}).label || '')}</span>
        <span class="t">${esc((e.tags || []).join(' · '))}</span>${e.note ? `<span class="n">${esc(e.note)}</span>` : ''}`;
      const r = g.getBoundingClientRect();
      tip.classList.add('show');
      // clamped to the viewport, so a pin at either edge still shows a whole card
      const w = tip.offsetWidth; const half = w / 2 + 8;
      tip.style.left = Math.min(Math.max(r.left + r.width / 2, half), window.innerWidth - half) + 'px';
      tip.style.top = (r.top - 8) + 'px';
      const hl = $(`.found .row[data-row="${g.dataset.eq}"]`);
      document.querySelectorAll('.found .row.on').forEach(x => x.classList.remove('on'));
      if (hl) hl.classList.add('on');
    };
    const hide = () => { tip.classList.remove('show'); document.querySelectorAll('.found .row.on').forEach(x => x.classList.remove('on')); };
    pins.forEach(g => {
      g.addEventListener('pointerenter', () => { if (!stuck) show(g); });
      g.addEventListener('pointerleave', () => { if (!stuck) hide(); });
      g.addEventListener('focus', () => show(g));
      g.addEventListener('blur', () => { if (!stuck) hide(); });
      g.addEventListener('click', ev => {
        ev.stopPropagation();
        if (stuck === g) { stuck = null; g.classList.remove('on'); hide(); return; }
        pins.forEach(x => x.classList.remove('on'));
        stuck = g; g.classList.add('on'); show(g);
      });
      g.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); g.click(); } });
    });
    const off = ev => { if (ev.target.closest && ev.target.closest('.pin')) return; if (!stuck) return; stuck.classList.remove('on'); stuck = null; hide(); };
    document.addEventListener('click', off, { once: false });
    window.addEventListener('scroll', () => { if (stuck) show(stuck); }, { passive: true });
  }

  // ---- what's new -------------------------------------------------------
  /* Config posts and posts written on this device, newest first. A date in the
     future is a scheduled post: its author sees it with the date on it, everyone
     else sees it when the day comes. */
  const newsCfg = () => CFG.news || null;
  const canWrite = () => ((newsCfg() || {}).authors || []).includes(S.audience);
  const today = () => new Date().toISOString().slice(0, 10);
  const isScheduled = p => (p.date || '') > today();
  function newsPosts() {
    const N = newsCfg(); if (!N) return [];
    const all = (N.posts || []).concat(S.posts || []);
    return all.filter(p => canWrite() || !isScheduled(p))
              .sort((x, y) => String(y.date).localeCompare(String(x.date)));
  }
  const postById = id => ((newsCfg() || {}).posts || []).concat(S.posts || []).find(p => p.id === id);
  const fmtPost = s => { const d = new Date(s); return isNaN(d) ? s : d.toLocaleDateString('en-AU', { day: 'numeric', month: 'long', year: 'numeric' }); };
  const schedTag = p => isScheduled(p) ? `<span class="sched">Scheduled · ${esc(fmtPost(p.date))}</span>` : '';

  /* An author lands on a hub — write one, or go and read the blog as a member sees
     it. Everyone else lands straight on the blog, because reading it is all they
     came to do. */
  function viewNews(r) {
    const N = newsCfg(); if (!N) return `<div class="empty" style="margin-top:24px">Nothing posted yet.</div>`;
    if (N.audiences && !N.audiences.includes(S.audience)) { go('home'); return ''; }
    if (canWrite() && !(r && r.q.get('all'))) return viewNewsHub(N);
    return viewBlog(N, canWrite());
  }

  function viewNewsHub(N) {
    const posts = newsPosts();
    const sched = posts.filter(isScheduled).length;
    const mine = (S.posts || []).length;
    return `<div class="hero"><h1>${esc(N.ownerTitle || 'Blog')}</h1><p>${esc(N.ownerIntro || '')}</p></div>
      <div class="tiles">
        <a class="tl solid" href="#/post/new">
          <svg class="go"><use href="#i-arrow-r"/></svg>
          <span class="eb">${esc(N.writeLabel || 'Write a post')}</span>
          <span class="fig"><span class="nt plus"><svg><use href="#i-plus"/></svg>New</span></span>
          <span class="bl">Tag, title, date, body</span>
        </a>
        <a class="tl" href="#/news?all=1">
          <svg class="go"><use href="#i-arrow-r"/></svg>
          <span class="eb">See the blog</span>
          <span class="fig"><span class="big">${posts.length}<small>post${posts.length === 1 ? '' : 's'}</small></span></span>
          <span class="bl">${sched ? `${sched} scheduled, waiting. ` : ''}The page as a member sees it.</span>
        </a>
      </div>
      ${mine ? `<div class="section"><div class="actions"><button class="btn outline small" id="posts-export" type="button"><svg><use href="#i-down"/></svg>Export ${mine} written here</button><span class="note">Written here they live on this device. Hand the file to whoever maintains the portal and they become permanent posts everyone sees, on any device.</span></div></div>` : ''}
      ${N.note ? `<p class="muted" style="font-size:13px;margin-top:22px">${esc(N.note)}</p>` : ''}`;
  }

  function viewBlog(N, author) {
    const posts = newsPosts();
    const back = author ? backTo('#/news', N.ownerTitle || 'Blog') : '';
    const write = author ? `<a class="btn small" href="#/post/new"><svg><use href="#i-plus"/></svg>${esc(N.writeLabel || 'Write a post')}</a>` : '';
    let html = `${back}<div class="hero"><div class="hero-row"><div><h1>${esc(N.title || "What's new")}</h1><p>${esc(N.intro || '')}${N.demo ? ' <span class="demo">Demo</span>' : ''}</p></div>${write}</div></div>`;
    if (!posts.length) return html + `<div class="empty" style="margin-top:16px">Nothing posted yet.${author ? ' Write the first one.' : ''}</div>`;
    const [lead, ...rest] = posts;
    html += `<a class="post-hero" href="#/post/${esc(lead.id)}" style="display:block;color:inherit">
        <span class="tag">${esc(lead.tag || '')}</span>${schedTag(lead)}
        <h2>${esc(lead.title)}</h2>
        <div class="when">${esc(fmtPost(lead.date))}${lead.local ? ' · written on this device' : ''}</div>
        <p class="lead">${esc(lead.lead)}</p>
        <div class="frame-actions" style="margin-top:14px"><span class="btn outline small">Read it<svg style="margin-left:2px"><use href="#i-arrow-r"/></svg></span></div>
      </a>`;
    if (rest.length) html += `<div class="section"><div class="section-head"><h3>Earlier</h3><span class="muted" style="font-size:13px">${rest.length} post${rest.length > 1 ? 's' : ''}</span></div>
      <div class="carousel">${rest.map(p => `<a class="post" href="#/post/${esc(p.id)}"><span class="tag">${esc(p.tag || '')}</span>${schedTag(p)}<h3>${esc(p.title)}</h3><div class="when">${esc(fmtPost(p.date))}${p.local ? ' · this device' : ''}</div><p style="margin-top:8px">${esc(p.lead)}</p></a>`).join('')}</div></div>`;
    if (N.note) html += `<p class="muted" style="font-size:13px;margin-top:22px">${esc(N.note)}</p>`;
    return html;
  }

  function wireNews() {
    const x = $('#posts-export'); if (!x) return;
    x.addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(S.posts || [], null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = `${CFG.client.slug}-posts-${today()}.json`;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
      toast('Posts exported');
    });
  }

  function viewPost(r) {
    if (r.id === 'new') return viewPostNew();
    const p = postById(r.id); if (!p) return `<div class="empty" style="margin-top:24px">That post does not exist. <a href="#/news">Back</a></div>`;
    if (isScheduled(p) && !canWrite()) { go('news'); return ''; }
    return `${backTo('#/news' + (canWrite() ? '?all=1' : ''), (newsCfg() || {}).title || "What's new")}
      <div class="article-head"><span class="tag" style="color:var(--primary);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:var(--w-semibold)">${esc(p.tag || '')}</span>${schedTag(p)}
      <h1>${esc(p.title)}</h1><div class="meta" style="font-size:14px;color:var(--text-muted)">${esc(fmtPost(p.date))}${p.local ? ' · written on this device' : ''}</div>
      <p class="blurb">${esc(p.lead)}</p></div>
      <div class="article">${(p.body || []).map(x => `<p>${esc(x)}</p>`).join('')}</div>
      ${p.local ? `<div class="section"><div class="actions"><button class="btn ghost small" id="post-del" type="button">Delete this post</button><span class="note">It only exists on this device.</span></div></div>` : ''}`;
  }

  /* Writing one. The lead is the first paragraph of the body rather than a fifth
     field to fill in — it is the line that already had to be written well. */
  function viewPostNew() {
    if (!canWrite()) { go('news'); return ''; }
    const N = newsCfg() || {};
    return `${backTo('#/news', N.ownerTitle || N.title || "What's new")}
      <div class="item-head"><h1>Write a post</h1><p class="blurb">It joins the blog as soon as you save it. Date it ahead and it waits until that day — you will see it here with the date on it in the meantime, members will not.</p></div>
      <div class="fstack">
        <div class="field"><label for="p-title">Title</label><input class="input" id="p-title" placeholder="RECOVER is open an hour earlier"></div>

    }
    if (t.kind === 'upnext') {
      const p = pathFor(S.audience); const pend = p ? p.items.filter(id => !isDone(id)) : [];
      const id = (S.lastOpened && pend.includes(S.lastOpened)) ? S.lastOpened : pend[0];
      if (!id) return `<span class="nx"><svg><use href="#i-check"/></svg>All done</span><span class="nt">Nothing waiting on you.</span>`;
      const it = byId[id];
      return `<span class="nx"><svg><use href="#t-${it.type}"/></svg>${TYPE[it.type]} \u00B7 ${esc(it.minutes)} min</span><span class="nt">${esc(it.title)}</span>`;
    }
    if (t.kind === 'progress') {
      const p = pathFor(S.audience); const pr = p ? pathProgress(p) : { done: 0, total: 0 };
      return `<span class="big">${pr.done}<small>of ${pr.total} done</small></span>`;

        <span class="d">${c('documented')} documented \u00B7 ${c('draft') + c('gap')} to write</span>`;

      const F = planSites()[0]; if (!F) return '';

    $('#export').addEventListener('click', exportCard);
    $('#copy').addEventListener('click', async () => { try { await navigator.clipboard.writeText(summaryText()); toast('Summary copied'); } catch (e) { toast('Copy is blocked here. Use Export instead.'); } });
    const lock = $('#lock-all'); if (lock) lock.addEventListener('click', () => { S.unlocked = {}; S.audience = 'employee'; S.landed = false; save(); go('welcome'); toast('Locked'); });
    $('#reset-all').addEventListener('click', () => confirm('Clear all progress?', 'Every completion, tick and score on this device is removed. Your name stays. This cannot be undone.', () => { const n = S.name; S = fresh(); S.name = n; S.nameSkipped = !n; save(); render(); toast('Progress cleared'); }));
  }

  // ---- progress card ----------------------------------------------------
  function cardData() {
    return {
      portal: CFG.client.portalTitle, client: CFG.client.tradingName, site: CFG.client.site, person: S.name || '(no name)', audience: S.audience,
      generatedAt: new Date().toISOString(), device: navigator.userAgent,
      paths: CFG.paths.filter(p => unlocked(p.audience)).map(p => Object.assign({ id: p.id, title: p.title }, pathProgress(p))),
      items: CFG.items.filter(i => unlocked(i.audience)).map(i => { const r = S.items[i.id] || {}; const c = S.checks[i.id]; return { id: i.id, type: i.type, title: i.title, status: r.status || 'new', startedAt: r.startedAt || null, completedAt: r.completedAt || null, score: r.score ?? null, passed: r.passed ?? null, steps: r.steps ?? null, selfMarked: !!r.selfMarked, ticked: c ? c.filter(Boolean).length : null }; })
    };
  }
  function summaryText() {
    const d = cardData();
    return [`${d.portal} · progress card`, `${d.person} · ${d.audience} · ${new Date().toLocaleDateString('en-AU')}`, ...d.paths.map(p => `${p.title}: ${p.done} of ${p.total} complete`), '', ...d.items.filter(i => i.status === 'complete').map(i => `✓ ${i.title}${i.score != null ? ` (${i.score})` : ''}`), ...d.items.filter(i => i.status === 'in-progress').map(i => `… ${i.title}`)].join('\n');
  }
  function exportCard() {
    const d = cardData(); const blob = new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `${CFG.client.slug}-progress-${(S.name || 'unnamed').toLowerCase().replace(/[^a-z0-9]+/g, '-')}-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('Progress card exported');
  }


  // ---- completion from simulations ------------------------------------
  window.addEventListener('message', e => {
    const d = e.data; if (!d || typeof d !== 'object' || d.type !== 'simulation:complete') return;
    const f = $('#sim'); if (!f || e.source !== f.contentWindow || !currentSim) return;
    complete(currentSim, { score: d.score ?? null, passed: d.passed ?? null, steps: d.steps ?? null });
  });
  // SCORM 1.2 and 2004 shims so an export that looks for an LMS in the parent frame finds one.
  const scormData = {};
  const record = (k, v) => {
    scormData[k] = v; if (!currentSim) return;
    if (/lesson_status|completion_status|success_status/.test(k) && /completed|passed/.test(String(v))) complete(currentSim, { scorm: true });
    if (/score\.raw/.test(k)) { S.items[currentSim] = Object.assign({}, S.items[currentSim], { score: Number(v) }); save(); }
    if (/score\.scaled/.test(k)) { S.items[currentSim] = Object.assign({}, S.items[currentSim], { score: Math.round(Number(v) * 100) }); save(); }
  };
  window.API = { LMSInitialize: () => 'true', LMSFinish: () => 'true', LMSGetValue: k => scormData[k] || (k === 'cmi.core.student_name' ? S.name : ''), LMSSetValue: (k, v) => { record(k, v); return 'true'; }, LMSCommit: () => 'true', LMSGetLastError: () => '0', LMSGetErrorString: () => '', LMSGetDiagnostic: () => '' };
  window.API_1484_11 = { Initialize: () => 'true', Terminate: () => 'true', GetValue: k => scormData[k] || (k === 'cmi.learner_name' ? S.name : ''), SetValue: (k, v) => { record(k, v); return 'true'; }, Commit: () => 'true', GetLastError: () => '0', GetErrorString: () => '', GetDiagnostic: () => '' };

  // ---- render -----------------------------------------------------------
  function renderBody() {
    const r = route(); const v = $('#view');
    document.body.classList.toggle('landing', r.view === 'welcome');
    if (r.view === 'welcome') { v.innerHTML = viewWelcome(); return; }
    if (r.view === 'home') v.innerHTML = viewHome();
    else if (r.view === 'learn') { v.innerHTML = viewLearn(r); wireLearn(); }
    else if (r.view === 'item') { v.innerHTML = viewItem(r); wireItem(r); }
    else if (r.view === 'path') v.innerHTML = viewPath();
    else if (r.view === 'processes') { v.innerHTML = viewProcesses(r); wireProcesses(); }
    else if (r.view === 'process') { v.innerHTML = viewProcess(r); if (r.id === 'new') wireProcessNew(); else wireProcess(r); }
    else if (r.view === 'lookaround') { v.innerHTML = viewLook(r); wireLook(); }
    else if (r.view === 'news') { v.innerHTML = viewNews(r); wireNews(); }
    else if (r.view === 'post') { v.innerHTML = viewPost(r); if (r.id === 'new') wirePostNew(); else wirePost(r); }
    else if (r.view === 'reports') { v.innerHTML = viewReports(); wireTips(); const b = $('#imp-open'); if (b) b.addEventListener('click', importPanel); }
    else if (r.view === 'support') v.innerHTML = viewSupport();
    else if (r.view === 'me') { v.innerHTML = viewMe(); wireMe(); }
    else { location.hash = '#/home'; return; }
    if (r.view !== 'item') currentSim = null;
  }
  let lastKey = '';
  function render() {
    const r = route();
    if (!S.landed && r.view !== 'welcome') { S.returnTo = location.hash || '#/home'; save(); location.hash = '#/welcome'; return; }
    const key = r.view + '/' + (r.id || '') + '?' + r.q.toString();
    renderNav(); renderBody();
    if (r.view === 'home' && S.landed && !S.name && !S.nameSkipped && !$('#dlg-name').open) setTimeout(askName, 350);
    if (key !== lastKey && !/^learn/.test(key) && !/^processes/.test(key)) window.scrollTo(0, 0);
    lastKey = key;
  }
  render();
})();
</script>
</body>
</html>
