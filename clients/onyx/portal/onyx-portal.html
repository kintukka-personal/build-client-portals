:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.g { color: var(--primary); } .a { color: var(--cta); } .muted { color: var(--text-muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ---- shell ---- */
.shell { min-height: 100vh; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 20; background: rgba(0,0,0,.94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border-quiet); padding-top: env(safe-area-inset-top); }

.hamb i { display: block; height: 4px; background: var(--primary); }
.rail { display: none; }
main { flex: 1; padding: 0 16px calc(84px + env(safe-area-inset-bottom)); max-width: 720px; width: 100%; margin: 0 auto; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: grid; grid-template-columns: repeat(4, 1fr); background: rgba(0,0,0,.96); border-top: 1px solid var(--border-quiet); padding-bottom: env(safe-area-inset-bottom); }
.tabbar a { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0 10px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; font-weight: var(--w-semibold); color: var(--text-muted); }

.tabbar a[aria-current] { color: var(--primary); }

@media (min-width: 960px) {

  .top, .tabbar { display: none; }
  .rail { display: flex; flex-direction: column; width: 264px; flex: none; position: sticky; top: 0; height: 100vh; border-right: 1px solid var(--border-quiet); padding: 28px 22px; }
  .rail .logo { width: 150px; margin-bottom: 36px; }
  .rail nav a { display: flex; align-items: center; gap: 14px; padding: 12px 10px; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; font-weight: var(--w-semibold); color: var(--text); border-left: 2px solid transparent; }
  .rail nav a svg { width: 20px; height: 20px; }
  .rail nav a[aria-current] { color: var(--primary); border-left-color: var(--primary); background: var(--primary-tint); }
  .rail .aud { margin-top: 28px; grid-template-columns: 1fr; }
  .rail .aud button { justify-content: flex-start; padding: 11px 12px; }
  .rail .foot { margin-top: auto; font-size: 12px; color: var(--text-muted); line-height: 1.5; }
  .rail .foot .btn { width: 100%; margin-bottom: 14px; }
  main { padding: 36px 40px 60px; max-width: 980px; margin: 0; }
}

/* ---- audience switch ---- */
.aud { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }

.aud button svg { width: 11px; height: 11px; }
.aud button.on { border-color: var(--ac); color: var(--ac); background: color-mix(in srgb, var(--ac) 14%, transparent); }
.aud button[data-c="primary"] { --ac: var(--primary); } .aud button[data-c="cta"] { --ac: var(--cta); } .aud button[data-c="white"] { --ac: #fff; }

/* ---- type ---- */
.h1 { font-size: var(--t-h1-size); line-height: var(--t-h1-lh); letter-spacing: var(--t-h1-ls); }
.h2 { font-size: var(--t-h2-size); line-height: var(--t-h2-lh); }

.section-head a { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: var(--w-semibold); }

/* ---- buttons ---- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; padding: 12px 24px; background: var(--cta); color: var(--text-on-cta); font-size: 14px; font-weight: var(--w-semibold); letter-spacing: .04em; text-transform: uppercase; border-radius: var(--r-control); text-decoration: none; }
.btn:hover { background: var(--cta-deep); }
.btn.outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
.btn.outline:hover { background: var(--primary-tint); }
.btn.ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border-quiet); }
.btn.ghost:hover { color: var(--text); border-color: var(--text-muted); }
.btn.block { width: 100%; }
.btn.small { min-height: 40px; padding: 8px 16px; font-size: 12px; }
.btn[disabled] { opacity: .45; cursor: default; }
.btn svg { width: 16px; height: 16px; }
.linkmore { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; font-weight: var(--w-medium); color: var(--primary); display: inline-flex; align-items: center; gap: 8px; }
.linkmore svg { width: 20px; height: 10px; }

/* ---- cards ---- */
.card { display: block; background: var(--surface); border: 1px solid var(--border-quiet); padding: 16px; color: inherit; position: relative; }
.card + .card { margin-top: 10px; }
.card.active { border: 2px solid var(--primary); padding: 15px; }
a.card:hover { border-color: var(--text-muted); }
.ti { width: 15px; height: 15px; flex: none; }
.card .type { display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--primary); font-weight: var(--w-semibold); }
.card .type.amber { color: var(--cta); }
.card .type .dot { color: var(--text-muted); letter-spacing: 0; }
.card h4 { font-size: 17px; margin: 6px 0 4px; }
.card .meta { font-size: 13px; color: var(--text-muted); }
.card .blurb { font-size: 14px; color: var(--text-muted); margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .state { position: absolute; top: 14px; right: 14px; width: 22px; height: 22px; color: var(--primary); }
.card .state.prog { color: var(--cta); }
.card.done h4 { color: var(--text-muted); }
.demo { display: inline-block; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); border: 1px solid var(--border-quiet); padding: 2px 6px; font-weight: var(--w-semibold); }
.prog { height: 4px; background: var(--surface-raised); margin: 12px 0 6px; }
.prog i { display: block; height: 100%; background: var(--cta); transition: width .3s ease; }
.prog.green i { background: var(--primary); }
.row-list .card { display: grid; grid-template-columns: 28px 1fr 22px; gap: 12px; align-items: center; padding: 12px 14px; }
.row-list .card .n { font-size: 12px; color: var(--text-muted); font-weight: var(--w-semibold); }
.row-list .card h4 { margin: 0; font-size: 15px; }
.row-list .card .meta { margin-top: 3px; display: flex; align-items: center; gap: 7px; }
.row-list .card .state { position: static; }
.grid2 { display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 720px) { .grid2 { grid-template-columns: 1fr 1fr; } .grid2 .card + .card { margin-top: 0; } }

/* ---- home ---- */
.hero { padding: 22px 0 6px; }
.hero h1 { font-size: 30px; line-height: 1.12; }
@media (min-width: 960px) { .hero h1 { font-size: 40px; } }
.hero p { color: var(--text-muted); margin-top: 8px; }
.bignum { font-size: 44px; font-weight: var(--w-bold); line-height: 1; letter-spacing: -.02em; color: var(--primary); }
.bignum small { font-size: 16px; font-weight: var(--w-regular); color: var(--text-muted); letter-spacing: 0; margin-left: 6px; }

/* ---- learn ---- */
.search { display: flex; align-items: center; gap: 10px; background: var(--surface-raised); border: 1px solid var(--border); padding: 0 14px; height: 52px; margin-top: 14px; }
.search svg { width: 18px; height: 18px; color: var(--text-muted); flex: none; }
.search input { flex: 1; background: none; border: 0; color: var(--text); font: inherit; font-size: 16px; min-width: 0; }

/* ---- item ---- */
.back { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: var(--w-semibold); color: var(--primary); padding: 18px 0 14px; }

.item-head .type { display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--primary); font-weight: var(--w-semibold); }
.item-head h1 { font-size: 28px; line-height: 1.15; margin: 10px 0 8px; }

.item-head .meta { font-size: 14px; color: var(--text-muted); }

.done-banner { display: flex; align-items: center; gap: 12px; background: var(--primary); color: var(--text-on-primary); padding: 12px 14px; margin-top: 18px; font-size: 14px; font-weight: var(--w-medium); }

.frame { margin-top: 20px; border: 1px solid var(--border); background: #000; position: relative; }
.frame iframe { display: block; width: 100%; height: 62vh; min-height: 380px; border: 0; background: #000; }
@media (min-width: 720px) { .frame iframe { height: auto; aspect-ratio: 16 / 9; min-height: 0; } }
.frame-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; align-items: center; }

@media (min-width: 720px) { .frame-actions .note { flex: 1; } }
.video-ph { margin-top: 20px; aspect-ratio: 16 / 9; border: 1px solid var(--border-quiet); background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 20px; color: var(--text-muted); }
.video-ph svg { width: 64px; height: 64px; color: var(--text); }
video { display: block; width: 100%; margin-top: 20px; background: #000; border: 1px solid var(--border); }
.steps { margin: 20px 0 0; padding: 0; list-style: none; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 32px 1fr 28px; gap: 14px; align-items: start; padding: 14px 0; border-top: 1px solid var(--border-quiet); }
.steps li:first-child { border-top: 0; }
.steps li .n { counter-increment: s; font-size: 13px; font-weight: var(--w-semibold); color: var(--primary); padding-top: 3px; }
.steps li .n::before { content: counter(s, decimal-leading-zero); }
.steps li p { margin: 0; }
.steps li.done p { color: var(--text-muted); text-decoration: line-through; text-decoration-color: var(--border); }
.tick { width: 28px; height: 28px; border: 1.5px solid var(--text-muted); border-radius: 50%; display: grid; place-items: center; color: transparent; }
.tick svg { width: 14px; height: 14px; }
li.done .tick { border-color: var(--primary); background: var(--primary); color: var(--text-on-primary); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 22px; align-items: center; }
.actions .note { font-size: 13px; color: var(--text-muted); flex: 1 1 100%; }
.article { margin-top: 20px; max-width: 64ch; }
.article p { margin-bottom: 1em; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 36px; }
.pager a { border: 1px solid var(--border-quiet); padding: 12px 14px; color: inherit; }
.pager a:hover { border-color: var(--text-muted); }
.pager a .k { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted); font-weight: var(--w-semibold); display: block; margin-bottom: 4px; }
.pager a .t { font-size: 14px; display: block; }
.pager a.next { text-align: right; }

/* ---- support ---- */
.assist .q { list-style: none; margin: 0 0 14px; padding: 0; }
.assist .q li { display: flex; gap: 10px; align-items: flex-start; padding: 4px 0; font-size: 15px; line-height: 1.45; }
.assist .q li::before { content: ""; flex: none; width: 12px; height: 2px; background: var(--primary); margin-top: 10px; }
.assist { padding: 0; }
.assist .q { margin: 16px 16px 14px; }
.assist .goto { border-top: 1px solid var(--border-quiet); padding: 14px 16px; display: grid; grid-template-columns: 1fr 22px; gap: 2px 12px; align-items: center; width: 100%; text-align: left; }
.assist .goto:hover { background: var(--surface-raised); }

.assist .goto .chev { grid-column: 2; grid-row: 1 / -1; width: 22px; height: 22px; color: var(--primary); }
.assist .goto .k { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--cta); font-weight: var(--w-semibold); margin-bottom: 4px; }
.assist .goto .name { font-weight: var(--w-semibold); font-size: 17px; }
.assist .goto .role { color: var(--primary); font-size: 13px; }
.assist .goto .how { font-size: 13px; color: var(--text-muted); }
.contact-rows { display: grid; gap: 8px; margin-top: 18px; }
.crow { display: grid; grid-template-columns: 1fr auto; border: 1px solid var(--border-quiet); }
.crow:hover { border-color: var(--primary); }
.crow .copy { display: grid; grid-template-columns: 20px 1fr; gap: 12px; align-items: center; padding: 14px; text-align: left; min-width: 0; }
.crow .copy:hover { background: var(--primary-tint); }
.crow .open { display: grid; place-items: center; width: 52px; border-left: 1px solid var(--border-quiet); color: var(--primary); }
.crow .open:hover { background: var(--primary-tint); text-decoration: none; }
.crow svg { width: 20px; height: 20px; color: var(--primary); }
.crow .k { display: block; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted); font-weight: var(--w-semibold); }
.crow .v { display: block; font-size: 15px; word-break: break-word; margin-top: 2px; }

details { border-top: 1px solid var(--border-quiet); }

/* ---- me ---- */
.field { display: flex; gap: 10px; align-items: stretch; margin-top: 10px; }
.input { flex: 1; height: 48px; padding: 0 14px; font: inherit; font-size: 16px; color: var(--text); background: var(--surface-raised); border: 1px solid var(--border); border-radius: 0; min-width: 0; }

.hist { margin: 0; padding: 0; list-style: none; }
.hist li { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border-quiet); font-size: 14px; }
.hist li:first-child { border-top: 0; }

/* ---- overlay menu ---- */
.menu { position: fixed; inset: 0; z-index: 40; background: #000; padding: 0 16px calc(24px + env(safe-area-inset-bottom)); overflow-y: auto; display: none; flex-direction: column; }
.menu.open { display: flex; }
.menu .head { display: flex; align-items: center; justify-content: space-between; height: 60px; margin-top: env(safe-area-inset-top); }

.closex::before, .closex::after { content: ""; position: absolute; left: -4px; right: -4px; top: 50%; height: 4px; margin-top: -2px; background: var(--primary); transform: rotate(45deg); }
.closex::after { transform: rotate(-45deg); }
.menu nav a { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; font-size: 18px; font-weight: var(--w-semibold); letter-spacing: .02em; text-transform: uppercase; color: var(--text); border-bottom: 1px solid var(--border-quiet); }

.menu .label { text-align: center; margin: 26px 0 12px; }
.menu .ctas { display: grid; gap: 6px; margin-top: auto; padding-top: 28px; }
.menu .fine { font-size: 12px; color: var(--text-muted); text-align: center; margin-top: 16px; line-height: 1.5; }

/* ---- landing ---- */
body.landing .top, body.landing .tabbar, body.landing .rail, body.landing .footer { display: none; }
body.landing main { max-width: 560px; margin: 0 auto; padding: 0 16px calc(24px + env(safe-area-inset-bottom)); min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
.land { padding: 40px 0 24px; }
.land .logo { width: 180px; margin-bottom: 44px; }
.land h1 { font-size: 34px; line-height: 1.1; margin: 10px 0 10px; }
@media (min-width: 720px) { .land h1 { font-size: 44px; } .land .logo { width: 220px; } }
.land > p { color: var(--text-muted); margin-bottom: 26px; }
.doors { display: grid; gap: 10px; }
.door { display: grid; grid-template-columns: 1fr 24px; gap: 14px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--border-quiet); border-left: 3px solid var(--ac); padding: 18px 18px 18px 20px; width: 100%; }
.door:hover { background: color-mix(in srgb, var(--ac) 8%, var(--surface)); border-color: var(--ac); }
.door[data-c="primary"] { --ac: var(--primary); } .door[data-c="cta"] { --ac: var(--cta); } .door[data-c="white"] { --ac: #fff; }
.door .t { display: block; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; font-weight: var(--w-semibold); color: var(--ac); }
.door .i { display: block; font-size: 15px; color: var(--text); margin-top: 6px; line-height: 1.45; }
.door svg { width: 22px; height: 22px; color: var(--text-muted); }
.land .fine { font-size: 12px; color: var(--text-muted); margin-top: 28px; line-height: 1.5; }

/* ---- dialogs and toast ---- */
dialog { background: var(--surface); color: var(--text); border: 1px solid var(--border); padding: 24px; width: min(92vw, 420px); margin: auto; }
dialog::backdrop { background: rgba(0,0,0,.75); }
dialog h3 { font-size: 20px; margin-bottom: 8px; }
dialog p { color: var(--text-muted); font-size: 15px; }
dialog .field { margin-top: 16px; }
dialog .actions { margin-top: 16px; justify-content: flex-end; }
dialog .err { color: var(--error); font-size: 14px; margin-top: 10px; min-height: 1.4em; }
.toast { word-break: break-word; position: fixed; left: 16px; right: 16px; bottom: calc(92px + env(safe-area-inset-bottom)); z-index: 50; background: var(--primary); color: var(--text-on-primary); padding: 12px 14px; font-size: 14px; font-weight: var(--w-medium); display: flex; align-items: center; gap: 10px; opacity: 0; transform: translateY(8px); transition: opacity .25s, transform .25s; pointer-events: none; }
.toast.show { opacity: 1; transform: none; }
.toast svg { width: 18px; height: 18px; flex: none; }
@media (min-width: 960px) { .toast { left: auto; right: 32px; bottom: 32px; width: 360px; } }
.footer { margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--border-quiet); font-size: 12px; color: var(--text-muted); line-height: 1.5; }

<script id="portal-config" type="application/json">{"_help":"Portal config for ONYX. Built into onyx-portal.html by `node tools/build-portal.js onyx`. Content marked demo:true is plausible placeholder content for the client to confirm or replace.","client":{"slug":"onyx","name":"ONYX","tradingName":"ONYX Gym & Fitness","site":"Alexandria","address":"20 Bowden Street, Alexandria NSW","website":"https://onyxgym.com.au","memberLogin":"https://onyxgym.com.au","portalTitle":"ONYX Learning Hub","tagline":"Not only a gym, but also a community."},"storageKey":"onyx-portal:v2","audiences":[{"id":"employee","label":"Employee","colour":"primary","key":"employee","intro":"Everything you need for your first weeks at ONYX."},{"id":"manager","label":"Manager","colour":"cta","key":"manager","intro":"Running a shift, running the roster, running the team."},{"id":"owner","label":"Owner","colour":"white","key":"owner","intro":"The numbers, the brand, the people and the next site."}],"_keysNote":"Keys are a curtain, not security. They keep the portal off a random phone and hide the manager and owner areas on a shared device. Content that must be genuinely restricted needs a hosted backend.","nav":[{"id":"home","label":"Home"},{"id":"learn","label":"Learn"},{"id":"support","label":"Support"},{"id":"me","label":"Me"}],"paths":[{"id":"week1-frontdesk","audience":"employee","title":"Week 1 at the front desk","blurb":"Everything for your first week, in order. Do them in order or jump around; the portal keeps track either way.","items":["vid-welcome","chk-week1","vid-floor-tour","gd-opening","chk-opening","sim-checkin","gd-fitness-passport","sim-fitness-passport","sim-sell-membership","vid-recover","gd-recover-turnaround","chk-recover-room","sim-book-recover","gd-class-checkin","gd-closing","chk-closing","gd-incident"]},{"id":"manager-essentials","audience":"manager","title":"Running the floor","blurb":"Everything a manager owns: the roster, the team, the awkward conversations and the weekly rhythm.","items":["vid-mgr-welcome","gd-mgr-onboard-starter","gd-mgr-progress-card","chk-mgr-handover","gd-mgr-roster","gd-mgr-cancellation","sim-mgr-refund","gd-mgr-incident-followup","art-mgr-kpis","chk-mgr-week","chk-mgr-monthly"]},{"id":"owner-desk","audience":"owner","title":"Owner's desk","blurb":"The numbers, the brand, the people and the next site.","items":["art-owner-scorecard","art-pricing-snapshot","lnk-owner-site","art-owner-recover","gd-owner-hiring","lnk-brand-sheet","gd-owner-portal","chk-owner-monthly","gd-owner-artarmon"]}],"areas":[{"id":"getting-started","label":"Getting Started","blurb":"Your first week at ONYX. Start here and work down."},{"id":"guides","label":"Guides","blurb":"How to do the job, step by step. Simulations sit with the guide they belong to."},{"id":"checklists","label":"Checklists","blurb":"Run these on shift."}],"items":[{"id":"vid-welcome","type":"video","audience":"employee","area":"getting-started","title":"Welcome from Katie and Joey","minutes":2,"demo":true,"src":null,"blurb":"Why ONYX exists, what the community means here, and what your first week looks like.","group":"getting-started"},{"id":"vid-floor-tour","type":"video","audience":"employee","area":"getting-started","title":"The gym floor and where things live","minutes":3,"demo":true,"src":null,"blurb":"Reception, the floor, the class studio, the RECOVER rooms, the back of house and the fire exits.","group":"getting-started"},{"id":"vid-recover","type":"video","audience":"employee","area":"getting-started","title":"A walk through the RECOVER rooms","minutes":2,"demo":true,"src":null,"blurb":"Infrared sauna, ice bath, the Together room and the Solo room. What members book and what they expect when they arrive.","group":"getting-started"},{"id":"sim-checkin","type":"simulation","audience":"employee","area":"guides","title":"Check a member in at reception","minutes":6,"steps":9,"demo":true,"src":"content/sims/onyx-sim-placeholder.html?title=Check+a+member+in+at+reception&steps=9","blurb":"Find the member, confirm their membership is active, and check them in. What to do when the scan fails.","group":"members"},{"id":"sim-sell-membership","type":"simulation","audience":"employee","area":"guides","title":"Sell a membership and take the joining fee","minutes":8,"steps":12,"demo":true,"src":"content/sims/onyx-sim-placeholder.html?title=Sell+a+membership&steps=12","blurb":"Set up ONYX Black or Platinum, take the $59 joining fee, and book the free Evolt360 scan and RECOVER Solo session that come with it.","group":"members"},{"id":"sim-book-recover","type":"simulation","audience":"employee","area":"guides","title":"Book a RECOVER Together or Solo session","minutes":5,"steps":7,"demo":true,"src":"content/sims/onyx-sim-placeholder.html?title=Book+a+RECOVER+session&steps=7","blurb":"Check room availability, book the right room type, and take payment or apply a membership inclusion.","group":"recover"},{"id":"sim-fitness-passport","type":"simulation","audience":"employee","area":"guides","title":"Process a Fitness Passport visit","minutes":4,"steps":6,"demo":true,"src":"content/sims/onyx-sim-placeholder.html?title=Process+a+Fitness+Passport+visit&steps=6","blurb":"Scan the Fitness Passport, record the visit, and handle a card that will not validate.","group":"members"},{"id":"gd-opening","type":"guide","audience":"employee","area":"guides","title":"Opening the gym at 5am","minutes":6,"demo":true,"blurb":"Twelve steps from the car park to the first member through the door.","steps":["Arrive by 4:45am. Park in the staff bays and check the exterior for anything out of place before you go in.","Disarm the alarm and turn on the entry lights. Prop the front door for now; it closes again at step 10.","Walk the floor with the lights on. Look for equipment left out, spills, and anything broken. Note it in the shift log.","Turn on the reception screens, the music and the class studio displays.","Switch the RECOVER rooms on so the infrared sauna is at temperature for the first booking. Check the ice bath water level and temperature.","Restock towels at reception and in the RECOVER rooms. Check the water station.","Log in to the gym system at reception. Open the day's bookings and the class list.","Check today's class schedule against the coach roster. Message the coach if a class has no cover.","Walk the bathrooms and the change rooms. Restock, and report anything that needs cleaning beyond a wipe-down.","Set the front door to member access at 5:00am sharp. 24/7 members already have fob access; this opens the staffed entrance.","Greet the first members by name where you know it. Ask how their training is going.","Write the opening entry in the shift log: time, anything found, anything reported."],"group":"open-close"},{"id":"chk-opening","type":"checklist","audience":"employee","area":"checklists","title":"Opening checklist","minutes":3,"demo":true,"blurb":"Run it every opening shift. The guide explains why; this is the tick list.","checks":["Exterior checked on arrival and nothing out of place","Alarm disarmed and entry lights on","Floor walked; equipment left out, spills and damage noted in the shift log","Reception screens, music and studio displays on","Infrared sauna on and heating for the first booking","Ice bath level and temperature checked","Towels and water station restocked","Gym system logged in; today's bookings and class list open","Class cover confirmed against the coach roster","Bathrooms and change rooms checked and stocked","Front door set to member access at 5:00am","Opening entry written in the shift log"],"group":"bau"},{"id":"gd-closing","type":"guide","audience":"employee","area":"guides","title":"Closing and lock-up","minutes":5,"demo":true,"blurb":"The staffed day ends; 24/7 access continues. What must be done so the gym runs safely overnight.","steps":["Thirty minutes before close, announce that the staffed desk is closing and RECOVER bookings end at the last slot.","Turn the RECOVER rooms off after the last session. Drain and cover the ice bath as per the room card. Leave the sauna door open to air.","Walk the floor. Rack weights, wipe benches, straighten mats. Report anything broken in the shift log.","Restock towels and water for the overnight members.","Close the till, run the end-of-day report in the gym system and file it as the procedure card says.","Check the bathrooms and change rooms one last time.","Set the front door back to fob-only access. Confirm the after-hours signage and the emergency number are visible.","Turn off reception screens and music. Leave the safety lighting on.","Write the closing entry in the shift log, arm the alarm zones that cover the back of house, and leave through the staff door."],"group":"open-close"},{"id":"chk-closing","type":"checklist","audience":"employee","area":"checklists","title":"Closing up checklist","minutes":3,"demo":true,"blurb":"Staffed hours end; 24/7 access continues. Tick every line before you leave.","checks":["Thirty-minute closing announcement made","Last RECOVER session finished; sauna off and door left open to air","Ice bath drained and covered as per the room card","Floor walked; weights racked, benches wiped, mats straightened","Faults or damage noted in the shift log","Towels and water restocked for overnight members","Till closed; end-of-day report run and filed","Bathrooms and change rooms checked","Front door set to fob-only access; after-hours signage and emergency number visible","Reception screens and music off; safety lighting on","Closing entry written; back-of-house alarm zones armed; left via the staff door"],"group":"bau"},{"id":"gd-recover-turnaround","type":"guide","audience":"employee","area":"guides","title":"Turning a RECOVER room around between sessions","minutes":4,"demo":true,"blurb":"The ten minutes between bookings, done the same way every time.","steps":["Knock and wait for the previous booking to leave. Thank them by name.","Wipe the sauna benches and door handle with the approved cleaner. Replace the bench towel.","Skim the ice bath, check the temperature reading and top up if the level is below the line.","Replace towels, empty the bin, and reset the timer display.","Check the room card: lighting scene, music level, sauna set temperature for the next booking type.","Mark the room as ready in the gym system so the next member can be checked in.","Meet the next booking at reception. Walk them in if it is their first RECOVER session and explain the timer and the call button."],"group":"recover"},{"id":"chk-recover-room","type":"checklist","audience":"employee","area":"checklists","title":"Recovery Room checklist","minutes":2,"demo":true,"blurb":"Every turnaround between RECOVER bookings, the same ten ticks.","checks":["Previous booking has left and the room is clear","Sauna benches and door handle wiped with the approved cleaner","Bench towel replaced","Ice bath skimmed and temperature reading within range","Ice bath topped up to the line","Fresh towels placed and bin emptied","Timer display reset","Room card applied for the next booking type: lighting, music, sauna temperature","Call button tested","Room marked ready in the gym system"],"group":"bau"},{"id":"chk-floor-sweep","type":"checklist","audience":"employee","area":"checklists","group":"bau","title":"Gym floor sweep","minutes":2,"demo":true,"blurb":"Every hour on a staffed shift. Ten minutes, the whole floor.","checks":["Walk the free weights: dumbbells paired and racked in order, plates back on the trees, collars returned","Benches and pads wiped, adjusted back to flat, positioned square","Cable attachments back on their pegs, cables untangled","Machines clear of plates and personal items","Mats rolled or stacked, foam rollers and bands back in their place","Bins emptied if over half full","Spray bottles and towel stations stocked","Water station full and cups stocked","Anything broken tagged and noted in the shift log","Said hello to at least a few members while you walked"]},{"id":"chk-class-studio","type":"checklist","audience":"employee","area":"checklists","group":"bau","title":"Class studio setup and pack down","minutes":3,"demo":true,"blurb":"Before the coach arrives, and after the last member leaves.","checks":["Studio floor clear and swept before setup","Equipment set out to the coach's plan, one station per booked attendee plus two spare","Weights checked for the class: matched pairs, nothing damaged","Sound system on and tested at a sensible level","Lighting scene set for the class type","Air conditioning set and the room aired if the previous class was full","Water and towels stocked at the door","Class list open on the tablet and check-in ready","After class: all equipment wiped and returned to its home","After class: floor swept, mirrors spot-cleaned, room reset for the next booking","Attendance closed off and any no-shows marked"]},{"id":"chk-tour","type":"checklist","audience":"employee","area":"checklists","group":"bau","title":"Showing a prospect around","minutes":3,"demo":true,"blurb":"A tour is a conversation with a route. Ask first, walk second, ask again at the end.","checks":["Greeted them by name and got theirs","Asked what they are training for before showing them anything","Asked when they usually train, so you can show them the gym as it will be for them","Walked the free weights and the machines, matched to what they said they want","Showed the class studio and named two classes that suit them","Showed the RECOVER rooms and explained Together and Solo","Showed the change rooms and the 24/7 entry","Explained the membership options that fit, not all of them","Named the joining fee and what is included, without being asked twice","Offered to sign them up today, once","Took their name and number if they are thinking about it, and logged the enquiry","Thanked them and walked them to the door"]},{"id":"chk-new-member","type":"checklist","audience":"employee","area":"checklists","group":"bau","title":"A new member's first visit","minutes":2,"demo":true,"blurb":"The first week decides whether they stay a year. Ten minutes well spent.","checks":["Welcomed them by name and checked their fob works on the door they will actually use","Confirmed the app is installed and they can book a class","Walked them to the change rooms and the water station","Showed them where to find staff outside staffed hours","Booked their free Evolt360 scan if their membership includes it","Booked their free RECOVER Solo session if their membership includes it","Introduced them to a coach on the floor","Asked what they are training for and noted it on their account","Told them what to expect in their first class and offered to book one","Logged the first visit so the manager can follow up in week two"]},{"id":"chk-evolt","type":"checklist","audience":"employee","area":"checklists","group":"bau","title":"Running an Evolt360 body scan","minutes":2,"demo":true,"blurb":"Same conditions every time, or the comparison is worthless.","checks":["Booking confirmed and the member knows to arrive hydrated and without shoes or socks","Checked the member has no pacemaker or implanted electronic device; if unsure, do not scan and refer to the manager","Asked whether they have eaten or trained in the last two hours and noted it","Scanner plates wiped before and after","Member's profile set up or found: height, age, sex","Member positioned as the on-screen guide shows, heels and balls of both feet on the plates","Scan run without talking or movement","Report sent to the member's email and saved to their account","Walked them through the first page rather than handing over a number","Next scan suggested and booked, same time of day"]},{"id":"chk-deep-clean","type":"checklist","audience":"employee","area":"checklists","group":"bau","title":"Weekly deep clean","minutes":4,"demo":true,"blurb":"The jobs the daily clean does not reach. One shift a week, rostered.","checks":["Machine upholstery cleaned, not just wiped","Cable and pulley housings dusted","Mirrors cleaned floor to ceiling","Rubber flooring mopped with the approved product","Skirting boards and corners done","Vents and fans dusted","Change room lockers emptied of abandoned items and wiped inside","Showers descaled and drains cleared","RECOVER sauna benches treated as per the room card","Ice bath filter cleaned or replaced","Reception desk, screens and eftpos terminal cleaned","Cleaning log signed and anything needing a contractor flagged"]},{"id":"chk-emergency","type":"checklist","audience":"employee","area":"checklists","group":"bau","title":"Evacuation","minutes":2,"demo":true,"blurb":"Read it now, not during. Drill or real thing, the order is the same.","checks":["Alarm heard or emergency called: stop what you are doing and take the floor plan and phone","000 called if it is real and not already done","Music and screens off so people can hear instructions","Walked the gym floor calling the evacuation, loudly and calmly","Checked the class studio","Checked both RECOVER rooms and knocked on every door","Checked all change rooms, showers and toilets","Checked the back of house and the office","Directed everyone to the assembly point, not the car park","Head count taken against the check-in list at the assembly point","Nobody re-enters until the fire brigade or the manager on duty says so","Incident report written the same day"]},{"id":"gd-fitness-passport","type":"guide","audience":"employee","area":"guides","title":"Handling a Fitness Passport member","minutes":3,"demo":true,"blurb":"What Fitness Passport is, what it covers here, and what it does not.","steps":["Fitness Passport is a workplace program. The member's employer pays; they show a Fitness Passport card or the app at the desk.","Every visit is scanned and recorded. No scan, no visit recorded, and ONYX is not paid for it.","It covers gym access and group fitness classes. It does not cover RECOVER sessions, personal training or the Evolt360 scan. Those are paid at the desk like any casual purchase.","If the card or app will not validate, take the member's name and Fitness Passport number, let them train, and log it for the manager to follow up.","A Fitness Passport member who wants RECOVER on a regular basis is a lead for a RECOVER membership. Mention it once, warmly, and leave it there."],"group":"members"},{"id":"gd-class-checkin","type":"guide","audience":"employee","area":"guides","title":"Class check-in and no-shows","minutes":3,"demo":true,"blurb":"Every membership includes unlimited classes. The desk keeps the class list honest.","steps":["Open the class in the gym system fifteen minutes before it starts.","Check members in as they arrive. Anyone not booked can join if there is space; add them so the coach's list is right.","Five minutes after the start, mark the unarrived as no-shows.","A member with repeat no-shows gets a friendly word from the coach or manager, not from the desk.","Close the class list once it has started so the numbers reported are what actually trained."],"group":"members"},{"id":"gd-incident","type":"guide","audience":"employee","area":"guides","title":"Incidents and first aid basics","minutes":5,"demo":true,"blurb":"What to do in the first two minutes, and what to write down afterwards.","steps":["Stay calm and go to the person. Ask if they are okay and what happened. Do not move someone who has fallen and says they are in pain.","If they are unresponsive, not breathing normally, or bleeding heavily, call 000 first. Then start first aid. The defibrillator location is on the floor plan by reception.","Send another member or staff member to reception to fetch the first aid kit and to meet the ambulance at the door.","For minor injuries, treat from the kit, offer ice, and stay with them until they are comfortable.","Once the person is safe, write the incident report the same day: who, what, where, when, who was present, what was done. Facts only.","Tell the manager on duty before you leave the shift. They decide on any follow-up with the member.","Restock whatever you used from the kit and note it in the shift log."],"group":"safety"},{"id":"chk-week1","type":"checklist","audience":"employee","area":"getting-started","title":"Week 1 checklist","minutes":2,"demo":true,"blurb":"Tick these off as your first week goes by.","checks":["Collected my staff fob and confirmed it opens the staff door and the front door","Logged in to the gym system with my own account","Met the coaches on this week's roster","Shadowed a full opening shift","Shadowed a full closing shift","Turned a RECOVER room around with someone watching","Completed the four simulations in this portal","Watched the three welcome videos","Read the incident guide and know where the first aid kit and defibrillator are","Know who the manager on duty is for each of my shifts"],"group":"getting-started"},{"id":"gd-mgr-onboard-starter","type":"guide","audience":"manager","area":"guides","title":"Onboarding a new starter with this portal","minutes":4,"demo":true,"blurb":"The portal does the teaching. You do the shadowing and the sign-off.","steps":["Before day one, open this portal on the reception tablet and on the starter's own phone. It is one link; nothing to install.","Have them enter their name on first open. The progress card carries it.","Point them at the Week 1 path. The order is deliberate: videos first, the opening shift, then the systems simulations.","Pair each simulation with a shadowed real shift the same week. The simulation teaches the clicks; the shift teaches the people.","At the end of week one, ask for their progress card. Read it against the checklist and sign them off, or agree what week two covers.","Anything the portal got wrong or missing goes to the person maintaining it. It is updated for everyone, not just for the next starter."],"group":"team"},{"id":"gd-mgr-progress-card","type":"guide","audience":"manager","area":"guides","title":"Reading a progress card","minutes":2,"demo":true,"blurb":"What the export from the Me page tells you, and what it does not.","steps":["A progress card is a file the starter exports from their own device. It lists every item, its status, the date completed and the simulation score where there is one.","Simulation scores come straight from the simulation player: steps completed, wrong attempts, time taken. A pass is set inside each simulation.","Guides and checklists are self-marked. Treat them as a conversation starter, not proof.","The card is only as complete as the device it came from. Progress does not sync between phones in this version; the person's own phone is their record.","Keep the card with your onboarding notes. When the portal gains a hosted team view, these cards import into it."],"group":"team"},{"id":"chk-mgr-handover","type":"checklist","audience":"manager","area":"checklists","title":"Shift handover","minutes":2,"demo":true,"blurb":"Five things every handover covers.","checks":["Shift log read and anything open discussed","RECOVER bookings for the next shift confirmed and rooms ready","Class cover confirmed for the next shift","Any incident reports written and handed over","Till reconciled and end-of-day report filed"],"group":"bau"},{"id":"vid-mgr-welcome","type":"video","audience":"manager","area":"getting-started","title":"What we expect of a manager at ONYX","minutes":4,"demo":true,"src":null,"blurb":"Katie and Joey on the standard: how the floor should feel, how the team should be spoken to, and what you decide without asking.","group":"getting-started"},{"id":"gd-mgr-roster","type":"guide","audience":"manager","area":"guides","title":"Building the weekly roster","minutes":6,"demo":true,"blurb":"Published Thursday for the week starting Monday. Cover first, preferences second.","steps":["Open the roster for the coming week by Wednesday morning. Anything published later than Thursday afternoon is late.","Block the fixed points first: every group fitness class with its coach, and the staffed desk hours at each end of the day.","Fill the opening and closing shifts next. These are the two that cannot be left uncovered, and they need someone signed off on the opening and closing checklists.","Layer in RECOVER cover for the busy blocks: weekday mornings before 9, and weekday evenings after 5.","Now apply leave and availability. Anything requested more than two weeks out is honoured unless it leaves a shift uncovered.","Check nobody is rostered to close then open the next morning. It is legal and it is still a bad shift pattern.","Sanity-check the hours against budget before publishing. Flag to Joey if the week is over.","Publish, then message the team. Swaps go through you, not between staff directly."],"group":"team"},{"id":"gd-mgr-incident-followup","type":"guide","audience":"manager","area":"guides","title":"Following up an incident report","minutes":5,"demo":true,"blurb":"The staff member wrote the report. What you do with it in the next 48 hours.","steps":["Read the report the same shift it was written. If anything is vague, ask the person while they still remember it.","Call the member within 24 hours. Ask how they are, not whether they intend to complain. Write down what they say.","Photograph anything involved: the equipment, the floor, the spill, the sign that was or was not there.","If equipment was involved, take it out of service with a tag until it has been checked. A tag is cheaper than a second incident.","Decide whether it is reportable. Anything involving an ambulance, a head injury or a member who cannot continue goes to Joey and Katie the same day.","Write your follow-up under the original report: what you found, who you spoke to, what changed.","Close the loop with the staff member. They will handle the next one better if they hear what happened."],"group":"safety"},{"id":"gd-mgr-cancellation","type":"guide","audience":"manager","area":"guides","title":"Cancellations, freezes and difficult conversations","minutes":6,"demo":true,"blurb":"Most cancellations are a life change, not a complaint about the gym. Find out which one you are in.","steps":["Take the conversation off the desk. A member cancelling in front of a queue will not tell you the real reason.","Ask what has changed. Moving, money, injury, or unhappy with something here. The answer decides everything that follows.","Injury or illness: offer a freeze first. A frozen membership comes back; a cancelled one usually does not.","Money: name the cheaper plan honestly rather than defending the current one.","Unhappy: let them finish, write it down, and say what you will do. Do not discount your way out of a service problem.","Moving or genuinely done: process it cleanly and thank them. A graceful exit is how you get the referral.","Check the terms and conditions for notice and any remaining commitment before you agree to anything.","Log the reason in the gym system. The pattern across a month is worth more than any single conversation."],"group":"members"},{"id":"sim-mgr-refund","type":"simulation","audience":"manager","area":"guides","title":"Process a freeze and a partial refund","minutes":7,"steps":10,"demo":true,"src":"content/sims/onyx-sim-placeholder.html?title=Process+a+freeze+and+a+partial+refund&steps=10","blurb":"Freeze a membership with an end date, then refund a part month and record the reason against the account.","group":"members"},{"id":"art-mgr-kpis","type":"article","audience":"manager","area":"guides","title":"What we look at each week","minutes":3,"demo":true,"blurb":"Five numbers, read every Monday. Reference only; the gym system is the source of truth.","body":["Five numbers tell you how the week went. Read them every Monday morning before the team arrives.","Visits per active member. The single best predictor of whether someone stays. Under one visit a week across a month and that member is drifting.","Class attendance against capacity. A class under half full twice in a row is a timetable problem, not a coach problem.","RECOVER utilisation by room and by block. Empty weekday middays are normal; empty weekday evenings are not.","New joins against cancellations. The net number matters less than the two lines moving in the same direction.","Cancellation reasons, grouped. Three of the same reason in a month is a thing to fix, not a run of bad luck."],"group":"business"},{"id":"chk-mgr-week","type":"checklist","audience":"manager","area":"checklists","title":"Weekly manager checklist","minutes":3,"demo":true,"blurb":"Run through it once a week, same day each week.","checks":["Roster for next week published by Thursday","Class cover confirmed for every session","Shift logs from the week read and anything open actioned","Incident reports followed up and closed","New starters' progress cards reviewed","RECOVER room faults and consumables checked","Equipment fault list reviewed with Joey","Cancellation reasons from the week logged","Till and end-of-day reports reconciled for all seven days","One thing worth fixing raised with Katie or Joey"],"group":"bau"},{"id":"chk-mgr-monthly","type":"checklist","audience":"manager","area":"checklists","title":"Monthly compliance checklist","minutes":4,"demo":true,"blurb":"The dull one that matters when something goes wrong.","checks":["First aid kits checked and restocked at reception and in RECOVER","Defibrillator pads and battery in date","Fire exits clear, signage lit, evacuation plan visible","Emergency lighting tested","Cleaning schedule signed off for every week of the month","RECOVER water quality logs complete","Staff certifications current: first aid, CPR, coaching accreditation","Incident register reviewed for patterns","Chemical and cleaning products stored and labelled correctly","Anything outstanding escalated with a date against it"],"group":"bau"},{"id":"lnk-brand-sheet","type":"link","audience":"owner","area":"guides","title":"The ONYX brand portfolio","minutes":5,"href":"../brand/onyx-brand-sheet.html","blurb":"Colours, type, logo rules, components and the SimStudio kit, as captured from onyxgym.com.au. Every simulation and this portal follow it.","group":"brand"},{"id":"art-pricing-snapshot","type":"article","audience":"owner","area":"guides","title":"Membership snapshot, September 2026","minutes":3,"demo":true,"blurb":"The three plans as shown on the site on 17 September 2026. Reference only; the gym system is the source of truth for live prices.","body":["Three plans were on the site on 17 September 2026, all with 24/7 access and unlimited group fitness classes, and a $59 joining fee on the direct-debit plans.","ONYX Platinum, 6 months: $34.99 per week, billed fortnightly at $69.98. Marked most popular.","ONYX Black, 12 months: $28.99 per week, billed fortnightly at $57.98. Includes a free Evolt360 body scan and report valued at $50, and a free RECOVER Solo session valued at $45.","ONYX Black, paid in full: $1299 once for 12 months, the equivalent of $24.98 per week. Same inclusions as the 12-month plan.","RECOVER by ONYX is sold separately as monthly memberships and session packages, in Together and Solo rooms."],"group":"business"},{"id":"gd-owner-artarmon","type":"guide","audience":"owner","area":"guides","title":"Opening Artarmon: what the portal needs","minutes":3,"demo":true,"blurb":"The second site reuses everything here. Five things change.","steps":["A second site entry in the portal config: name, address, and which guides differ. Opening and closing will differ; the systems simulations will not.","Fresh captures of any screen in the gym system that differs by site, replaced in the simulation with Replace image. The overlays stay where they are.","The site's own photos for the onboarding videos and the floor tour.","A site switcher on the Me page so a person who works both sites sees the right guides.","The same brand, the same portal, the same progress card. Nothing is rebuilt."],"group":"business"},{"id":"art-owner-scorecard","type":"article","audience":"owner","area":"guides","title":"The monthly scorecard","minutes":4,"demo":true,"blurb":"What to read on the first Monday of the month, and in what order.","body":["Read it in this order. The order is the point: members before money, because the money follows.","Active members, and the split between month-to-month and committed terms. A base tilting toward month-to-month is a base that can leave quickly.","Net movement. Joins minus cancellations, plotted across twelve months rather than compared to last month.","Visit frequency across the whole base. This is the leading indicator. It falls a month or two before cancellations rise.","Revenue per active member, including RECOVER, personal training and the Evolt360 scans. A flat membership price with rising revenue per member means the extras are working.","RECOVER utilisation and its share of revenue. The rooms have fixed running costs, so utilisation is the number that decides whether they earn their floor space.","Personal training hours sold, by coach. It is both a revenue line and a read on which coaches members trust.","Cancellation reasons, grouped and ranked. Then pick one to fix this month. One, properly, beats five noted."],"group":"business"},{"id":"art-owner-recover","type":"article","audience":"owner","area":"guides","title":"RECOVER: how the rooms earn their space","minutes":4,"demo":true,"blurb":"The commercial case for contrast therapy, in plain terms. Reference only; the accountant has the real numbers.","body":["A RECOVER room costs the same whether it runs empty or full: the heat, the water, the space it takes on the floor plan. Everything therefore turns on utilisation.","Two products serve two motivations. Together is social and fills weekends and evenings. Solo is a premium private slot and fills weekday mornings.","The free Solo session bundled into the ONYX Black memberships is an acquisition cost, not a giveaway. It exists so a member experiences the room once; conversion after that first session is what to measure.","Memberships beat casual sessions for a recovery product, because the habit is weekly and a package makes the member plan around it.","The room is also a retention tool for the gym membership itself. A member who books RECOVER weekly has a second reason to keep coming, and second reasons are what stop cancellations.","Watch three things: utilisation by block, the split between Together and Solo, and how many RECOVER members are also gym members. The third one tells you whether the room is growing the business or just moving revenue around inside it."],"group":"recover"},{"id":"gd-owner-hiring","type":"guide","audience":"owner","area":"guides","title":"Hiring a coach","minutes":6,"demo":true,"blurb":"Qualifications get them in the room. Temperament decides the hire.","steps":["Write the role around the gap, not the person. A powerlifting coach and a group fitness coach are different hires with different weeks.","Screen for the non-negotiables on paper: current certification, first aid and CPR, insurance and a working with children check where relevant.","Phone screen for fifteen minutes. You are only checking whether they can hold a warm conversation with a stranger, which is most of the job.","Run a floor trial, paid, during a busy block. Watch whether they approach members unprompted or wait to be approached.","Give them one coaching scenario: a member doing something unsafe who did not ask for help. The way they interrupt tells you how they will treat the floor.","Ask what they do when they do not know the answer. The good answer involves finding out and coming back.","Reference-check the last two employers, and ask specifically whether members asked for that person by name.","Onboard through this portal from day one. Same path, same checklists, same standard as everyone else."],"group":"team"},{"id":"gd-owner-portal","type":"guide","audience":"owner","area":"guides","title":"Keeping this portal current","minutes":4,"demo":true,"blurb":"A portal nobody updates is worse than no portal. Five habits keep it true.","steps":["One owner. Somebody's name is against this portal, and everyone knows whose.","Corrections come from the floor. The staff who use it find the errors first, and the Support page tells them where to send them.","When the gym system changes, the screenshots change. Reopen the SimStudio project, use Replace image on the affected steps, export again. The overlays stay where they are.","When a procedure changes, the guide changes the same week. A guide that contradicts the floor teaches the team to ignore the portal.","Review the whole thing quarterly against what actually happens on shift. Delete anything nobody uses; dead content makes the rest look stale.","Roll a new site in by reusing everything. Only the opening and closing guides and the site photos differ."],"group":"brand"},{"id":"chk-owner-monthly","type":"checklist","audience":"owner","area":"checklists","title":"Owner's monthly review","minutes":3,"demo":true,"blurb":"First Monday of the month. Thirty minutes, done properly.","checks":["Scorecard read in order and last month's numbers compared","Cancellation reasons reviewed and one chosen to fix","RECOVER utilisation checked by room and block","Personal training hours reviewed by coach","Roster hours against budget for the month","Incident register reviewed","Compliance checklist confirmed complete by the manager","Team: anyone thriving, anyone struggling, anyone owed a conversation","Marketing spend against joins for the month","Artarmon progress reviewed against its plan"],"group":"bau"},{"id":"lnk-owner-site","type":"link","audience":"owner","area":"guides","title":"Live memberships page","minutes":1,"href":"https://onyxgym.com.au/gym/memberships-pricing/","blurb":"What a prospective member sees today. Check it against the snapshot in this portal whenever pricing moves.","group":"business"}],"support":{"faq":[{"q":"A member's fob or card will not scan.","a":"Check the membership is active in the gym system by name. If it is, let them in, note the fob number in the shift log, and reissue at the desk. If it is not active, explain kindly and offer to take a payment or book them in with the manager."},{"q":"Two RECOVER bookings clash for the same room.","a":"The system booking wins. Offer the other member the other room type at the same price, or the next free slot with a complimentary extension. Log it so the manager can see how it happened."},{"q":"The Fitness Passport app will not load.","a":"Take the member's name and Fitness Passport number, let them train, and log it for the manager to record the visit later."},{"q":"Someone wants to cancel a membership at the desk.","a":"Do not process it at the desk. Take their details and the reason, and book them a call with the manager. Cancellations follow the terms and conditions and need the manager's sign-off."},{"q":"Who do I call after hours?","a":"The manager on duty for the day is on the shift log. Anything urgent about safety is 000 first, then the manager."}],"assistance":[{"queries":["Anything on shift you are unsure about","A member's fob, card or check-in","A booking, a class list or the till","Where something is kept","An incident, injury or safety concern","A refund, cancellation or complaint","Roster and shift changes"],"name":"Manager on duty","role":"Rostered per shift, named on the shift log","how":"Find them on the floor first. Safety emergencies are 000 before anyone else.","email":"duty.manager@onyxgym.com.au","phone":"+61255500118","phoneLabel":"(02) 5550 0118","demo":true},{"queries":["Brand, marketing and social media","Membership and pricing decisions","Partnerships and Fitness Passport"],"name":"Katie King","role":"Co Founder","how":"Via the manager on duty for anything urgent.","email":"katie@onyxgym.com.au","phone":"+61491570156","phoneLabel":"0491 570 156","demo":true},{"queries":["Training programs and the gym floor","Coaches and the class schedule","Equipment faults and orders"],"name":"Joey","role":"Co Founder","how":"Via the manager on duty for anything urgent.","email":"joey@onyxgym.com.au","phone":"+61491570157","phoneLabel":"0491 570 157","demo":true},{"queries":["Coaching standards","Member experience and feedback","Personal training enquiries"],"name":"Mick Abboud","role":"Head of Excellence","how":"Via the manager on duty for anything urgent.","email":"mick@onyxgym.com.au","phone":"+61491570158","phoneLabel":"0491 570 158","demo":true}],"_assistanceNote":"Each card leads with the problems it covers, then the person. Email and phone are placeholders on ONYX's own domain and on Australia's reserved fictitious number ranges; replace with the real details and drop the demo flag. phone is what tel: dials, phoneLabel is what a person reads.","reportIssue":{"label":"Something wrong in this portal?","text":"Tell the manager on duty what page you were on and what you expected. Corrections go to whoever maintains the portal and are updated for everyone."}},"footer":"ONYX Learning Hub · Built beside SimStudio · Content marked Demo is for ONYX to confirm.","_areasNote":"Areas are the Learn filters. Groups are the subheadings inside them, in this order.","groups":[{"id":"getting-started","area":"getting-started","label":"Getting Started","blurb":"Your first week. Start here."},{"id":"open-close","area":"guides","label":"Opening and closing","blurb":"The two shifts that cannot be left uncovered."},{"id":"members","area":"guides","label":"Helping members","blurb":"The desk, the system and the conversations."},{"id":"recover","area":"guides","label":"RECOVER","blurb":"The sauna and ice bath rooms."},{"id":"safety","area":"guides","label":"Safety and incidents","blurb":"What to do, and what happens next."},{"id":"team","area":"guides","label":"Team and roster","blurb":"Hiring, onboarding and covering the week."},{"id":"business","area":"guides","label":"The business","blurb":"The numbers, the pricing and the next site."},{"id":"brand","area":"guides","label":"Brand and this portal","blurb":"How ONYX looks, and how this portal stays true."},{"id":"bau","area":"checklists","label":"BAU","blurb":"Business as usual. The tick lists you run on shift."}]}</script>
<script>
(function () {
  'use strict';
  const CFG = JSON.parse(document.getElementById('portal-config').textContent);
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const byId = Object.fromEntries(CFG.items.map(i => [i.id, i]));
  const TYPE = { simulation: 'Simulation', video: 'Video', guide: 'Guide', checklist: 'Checklist', article: 'Article', link: 'Link' };

  // ---- state ------------------------------------------------------------
  const KEY = CFG.storageKey;
  const fresh = () => ({ name: '', audience: 'employee', landed: false, returnTo: null, unlocked: {}, items: {}, checks: {}, lastOpened: null, created: new Date().toISOString() });
  let S = fresh();
  try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

  const aud = () => CFG.audiences.find(a => a.id === S.audience) || CFG.audiences[0];
  const unlocked = id => { const a = CFG.audiences.find(x => x.id === id); return !a || !a.key || !!S.unlocked[id]; };
  const visible = () => CFG.items.filter(i => i.audience === S.audience || (S.audience !== 'employee' && i.audience === 'employee'));
  const pathFor = a => CFG.paths.find(p => p.audience === a);
  const status = id => (S.items[id] && S.items[id].status) || 'new';
  const isDone = id => status(id) === 'complete';
  const pathProgress = p => { const done = p.items.filter(isDone).length; return { done, total: p.items.length, pct: p.items.length ? Math.round(done / p.items.length * 100) : 0 }; };

  function complete(id, extra) {
    const it = byId[id]; if (!it) return;
    const was = isDone(id);
    S.items[id] = Object.assign({}, S.items[id], { status: 'complete', completedAt: new Date().toISOString() }, extra || {});
    save();
    if (!was) toast('Completed: ' + it.title);
    render();
  }
  function start(id) {
    if (!S.items[id]) { S.items[id] = { status: 'in-progress', startedAt: new Date().toISOString() }; }
    S.lastOpened = id; save();
  }

  // ---- routing ----------------------------------------------------------
  function route() {
    const h = location.hash.replace(/^#\/?/, '') || 'home';
    const [pathPart, qs] = h.split('?');
    const seg = pathPart.split('/');
    return { view: seg[0] || 'home', id: seg[1] || null, q: new URLSearchParams(qs || '') };
  }
  const go = h => { location.hash = h; };
  window.addEventListener('hashchange', render);

  // ---- chrome -----------------------------------------------------------
  const navIcon = { home: 'i-home', learn: 'i-learn', support: 'i-support', me: 'i-me' };
  function renderNav() {
    const r = route(); const cur = r.view === 'item' ? 'learn' : r.view;
    const link = n => `<a href="#/${n.id}" ${cur === n.id ? 'aria-current="page"' : ''}><svg><use href="#${navIcon[n.id]}"/></svg><span>${esc(n.label)}</span></a>`;

  async function copyText(t) {

      document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, t.length);

      <div class="section"><div class="label">${esc(p.title)}</div><div class="bignum">${pr.done}<small>of ${pr.total} complete</small></div><div class="prog green"><i style="width:${pr.pct}%"></i></div></div>
      <div class="section"><div class="label">Access</div><div class="kv">${CFG.audiences.map(a => `<span class="k">${esc(a.label)}</span><span>${a.key ? (S.unlocked[a.id] ? 'Unlocked on this device' : 'Locked') : 'Open to everyone'}</span>`).join('')}</div>
        <div class="actions"><a class="btn ghost small" href="#/welcome">Choose who you are here as</a>${CFG.audiences.some(a => a.key && S.unlocked[a.id]) ? `<button class="btn ghost small" id="lock-all" type="button">Lock this device</button>` : ''}</div></div>
      <div class="section"><div class="label">Completed</div>${doneList.length ? `<ul class="hist">${doneList.map(([id, v]) => `<li><span>${esc((byId[id] || {}).title || id)}${v.score != null ? ` <span class="muted">· ${esc(v.score)}</span>` : ''}</span><span>${esc(fmtDate(v.completedAt))}</span></li>`).join('')}</ul>` : `<div class="empty">Nothing yet. Start with the Week 1 path on Home.</div>`}</div>
      <div class="section"><div class="label">Progress card</div><p class="muted" style="font-size:14px">A file with every item, its status, dates and simulation scores. Send it to your manager; it is the record of your onboarding.</p>
        <div class="actions"><button class="btn" id="export" type="button"><svg><use href="#i-down"/></svg>Export progress card</button><button class="btn outline" id="copy" type="button">Copy summary</button></div></div>
      <div class="section"><div class="label">Reset</div><div class="actions"><button class="btn ghost small" id="reset-all" type="button">Clear all progress on this device</button></div></div>`;
  }
  function wireMe() {
    $('#me-save').addEventListener('click', () => { S.name = $('#me-name').value.trim(); save(); toast('Name saved'); render(); });
    $('#export').addEventListener('click', exportCard);
    $('#copy').addEventListener('click', async () => { try { await navigator.clipboard.writeText(summaryText()); toast('Summary copied'); } catch (e) { toast('Copy is blocked here. Use Export instead.'); } });
    const lock = $('#lock-all'); if (lock) lock.addEventListener('click', () => { S.unlocked = {}; S.audience = 'employee'; S.landed = false; save(); go('welcome'); toast('Locked'); });
    $('#reset-all').addEventListener('click', () => confirm('Clear all progress?', 'Every completion, tick and score on this device is removed. Your name stays. This cannot be undone.', () => { const n = S.name; S = fresh(); S.name = n; S.nameSkipped = !n; save(); render(); toast('Progress cleared'); }));
  }

  // ---- progress card ----------------------------------------------------
  function cardData() {
    return {
      portal: CFG.client.portalTitle, client: CFG.client.tradingName, site: CFG.client.site, person: S.name || '(no name)', audience: S.audience,
      generatedAt: new Date().toISOString(), device: navigator.userAgent,
      paths: CFG.paths.filter(p => unlocked(p.audience)).map(p => Object.assign({ id: p.id, title: p.title }, pathProgress(p))),
      items: CFG.items.filter(i => unlocked(i.audience)).map(i => { const r = S.items[i.id] || {}; const c = S.checks[i.id]; return { id: i.id, type: i.type, title: i.title, status: r.status || 'new', startedAt: r.startedAt || null, completedAt: r.completedAt || null, score: r.score ?? null, passed: r.passed ?? null, steps: r.steps ?? null, selfMarked: !!r.selfMarked, ticked: c ? c.filter(Boolean).length : null }; })
    };
  }
  function summaryText() {
    const d = cardData();
    return [`${d.portal} · progress card`, `${d.person} · ${d.audience} · ${new Date().toLocaleDateString('en-AU')}`, ...d.paths.map(p => `${p.title}: ${p.done} of ${p.total} complete`), '', ...d.items.filter(i => i.status === 'complete').map(i => `✓ ${i.title}${i.score != null ? ` (${i.score})` : ''}`), ...d.items.filter(i => i.status === 'in-progress').map(i => `… ${i.title}`)].join('\n');
  }
  function exportCard() {
    const d = cardData(); const blob = new Blob([JSON.stringify(d, null, 2)], { type: 'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = `${CFG.client.slug}-progress-${(S.name || 'unnamed').toLowerCase().replace(/[^a-z0-9]+/g, '-')}-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('Progress card exported');
  }
  function fmtDate(iso) { if (!iso) return ''; try { return new Date(iso).toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' }); } catch (e) { return iso; } }

  // ---- completion from simulations ------------------------------------
  window.addEventListener('message', e => {
    const d = e.data; if (!d || typeof d !== 'object' || d.type !== 'simulation:complete') return;
    const f = $('#sim'); if (!f || e.source !== f.contentWindow || !currentSim) return;
    complete(currentSim, { score: d.score ?? null, passed: d.passed ?? null, steps: d.steps ?? null });
  });
  // SCORM 1.2 and 2004 shims so an export that looks for an LMS in the parent frame finds one.
  const scormData = {};
  const record = (k, v) => {
    scormData[k] = v; if (!currentSim) return;
    if (/lesson_status|completion_status|success_status/.test(k) && /completed|passed/.test(String(v))) complete(currentSim, { scorm: true });
    if (/score\.raw/.test(k)) { S.items[currentSim] = Object.assign({}, S.items[currentSim], { score: Number(v) }); save(); }
    if (/score\.scaled/.test(k)) { S.items[currentSim] = Object.assign({}, S.items[currentSim], { score: Math.round(Number(v) * 100) }); save(); }
  };
  window.API = { LMSInitialize: () => 'true', LMSFinish: () => 'true', LMSGetValue: k => scormData[k] || (k === 'cmi.core.student_name' ? S.name : ''), LMSSetValue: (k, v) => { record(k, v); return 'true'; }, LMSCommit: () => 'true', LMSGetLastError: () => '0', LMSGetErrorString: () => '', LMSGetDiagnostic: () => '' };
  window.API_1484_11 = { Initialize: () => 'true', Terminate: () => 'true', GetValue: k => scormData[k] || (k === 'cmi.learner_name' ? S.name : ''), SetValue: (k, v) => { record(k, v); return 'true'; }, Commit: () => 'true', GetLastError: () => '0', GetErrorString: () => '', GetDiagnostic: () => '' };

  // ---- render -----------------------------------------------------------
  function renderBody() {
    const r = route(); const v = $('#view');
    document.body.classList.toggle('landing', r.view === 'welcome');
    if (r.view === 'welcome') { v.innerHTML = viewWelcome(); return; }
    if (r.view === 'home') v.innerHTML = viewHome();
    else if (r.view === 'learn') { v.innerHTML = viewLearn(r); wireLearn(); }
    else if (r.view === 'item') { v.innerHTML = viewItem(r); wireItem(r); }
    else if (r.view === 'support') v.innerHTML = viewSupport();
    else if (r.view === 'me') { v.innerHTML = viewMe(); wireMe(); }
    else { location.hash = '#/home'; return; }
    if (r.view !== 'item') currentSim = null;
  }
  let lastKey = '';
  function render() {
    const r = route();
    if (!S.landed && r.view !== 'welcome') { S.returnTo = location.hash || '#/home'; save(); location.hash = '#/welcome'; return; }
    const key = r.view + '/' + (r.id || '') + '?' + r.q.toString();
    renderNav(); renderBody();
    if (r.view === 'home' && S.landed && !S.name && !S.nameSkipped && !$('#dlg-name').open) setTimeout(askName, 350);
    if (key !== lastKey && !/^learn/.test(key) ) window.scrollTo(0, 0);
    lastKey = key;
  }
  render();
})();
</script>
</body>
</html>
