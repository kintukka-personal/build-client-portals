The numbers, the brand, the people and the next site.","homeTiles":[{"id":"t-reports","to":"reports","eyebrow":"Reports and analytics","kind":"stat","statFrom":"active","blurb":"Members, revenue, RECOVER and classes, month to date.","span":2,"accent":"cta"},{"id":"t-upnext","to":"upnext","eyebrow":"Up next","kind":"upnext","blurb":"Pick up where you left off."},{"id":"t-processes","to":"processes","eyebrow":"Process library","kind":"processes","blurb":"Every process, and the training it drives."},{"id":"t-news","to":"news","eyebrow":"What's new","kind":"news","blurb":"The member blog. Write one, or schedule it."},{"id":"t-desk","to":"path","eyebrow":"Owner's desk","kind":"progress","blurb":"The nine things worth your time."},{"id":"t-team","to":"learn","eyebrow":"Team library","kind":"count","countOf":"items","blurb":"Everything your team can see."},{"id":"t-brand","to":"../brand/onyx-brand-sheet.html","external":true,"eyebrow":"Brand and standards","kind":"mark","blurb":"Colours, type, logo and tone, as one source of truth.","span":2}],"sees":["employee","owner"]}],"_keysNote":"Keys are a curtain, not security. They keep the portal off a random phone and hide the manager and owner areas on a shared device. Content that must be genuinely restricted needs a hosted backend.","nav":[{"id":"home","label":"Home"},{"id":"lookaround","label":"Look around","audiences":["member"]},{"id":"learn","label":"Learn","audiences":["employee","manager"]},{"id":"learn","label":"Tips","audiences":["member"]},{"id":"reports","label":"Reports","audiences":["owner"]},{"id":"news","label":"Blog","audiences":["owner"]},{"id":"news","label":"News","audiences":["member"]},{"id":"support","label":"Support"},{"id":"me","label":"Me","audiences":["employee","manager","owner"]}],"paths":[{"id":"week1-frontdesk","audience":"employee","title":"Week 1 at the front desk","blurb":"Everything for your first week, in order. Do them in order or jump around; the portal keeps track either way.","items":["vid-welcome","chk-week1","vid-floor-tour","hot-lockers","gd-opening","chk-opening","sim-checkin","gd-fitness-passport","sim-fitness-passport","sim-sell-membership","vid-recover","gd-recover-turnaround","chk-recover-room","sim-book-recover","gd-class-checkin","gd-closing","chk-closing","gd-incident"]},{"id":"manager-essentials","audience":"manager","title":"Running the floor","blurb":"Everything a manager owns: the roster, the team, the awkward conversations and the weekly rhythm.","items":["vid-mgr-welcome","gd-mgr-onboard-starter","gd-mgr-progress-card","chk-mgr-handover","gd-mgr-roster","gd-mgr-cancellation","sim-mgr-refund","gd-mgr-incident-followup","art-mgr-kpis","chk-mgr-week","chk-mgr-monthly"]},{"id":"owner-desk","audience":"owner","title":"Owner's desk","blurb":"The numbers, the brand, the people and the next site.","items":["art-owner-scorecard","gd-owner-reports","art-pricing-snapshot","lnk-owner-site","art-owner-recover","gd-owner-hiring","lnk-brand-sheet","gd-owner-portal","chk-owner-monthly","gd-owner-artarmon"]}],"areas":[{"id":"getting-started","label":"Getting Started","blurb":"Your first week at ONYX. Start here and work down."},{"id":"guides","label":"Guides","blurb":"How to do the job, step by step. Simulations sit with the guide they belong to."},{"id":"checklists","label":"Checklists","blurb":"Run these on shift."},{"id":"tips","label":"Helpful tips","blurb":"The things people ask us at the desk most, answered once."}],"items":[{"id":"vid-welcome","type":"video","audience":"employee","area":"getting-started","title":"Welcome from Katie and Joey","minutes":2,"demo":true,"src":null,"blurb":"Why ONYX exists, what the community means here, and what your first week looks like.","group":"getting-started"},{"id":"vid-floor-tour","type":"video","audience":"employee","area":"getting-started","title":"The gym floor and where things live","minutes":3,"demo":true,"src":null,"blurb":"Reception, the floor, the class studio, the RECOVER rooms, the back of house and the fire exits.","group":"getting-started"},{"id":"vid-recover","type":"video","audience":"employee","area":"getting-started","title":"A walk through the RECOVER rooms","minutes":2,"demo":true,"src":null,"blurb":"Infrared sauna, ice bath, the Together room and the Solo room. What members book and what they expect when they arrive.","group":"getting-started"},{"id":"hot-lockers","type":"hotspot","audience":"employee","area":"guides","title":"The member lockers: locking and unlocking","minutes":2,"hotspots":3,"demo":false,"src":"content/sims/onyx-sim-lockers.html","ratio":"818 / 1220","blurb":"A photo of the lockers with the keypad steps on it. Tap a marker for how a member locks one, how they unlock it, and what to do when they have forgotten the code.","group":"members"},{"id":"sim-checkin","type":"simulation","audience":"employee","area":"guides","title":"Check a member in at reception","minutes":6,"steps":9,"demo":true,"src":"content/sims/onyx-sim-placeholder.html?title=Check+a+member+in+at+reception&steps=9","blurb":"Find the member, confirm their membership is active, and check them in. What to do when the scan fails.","group":"members"},{"id":"sim-sell-membership","type":"simulation","audience":"employee","area":"guides","title":"Sell a membership and take the joining fee","minutes":8,"steps":12,"demo":true,"src":"content/sims/onyx-sim-placeholder.html?title=Sell+a+membership&steps=12","blurb":"Set up ONYX Black or Platinum, take the $59 joining fee, and book the free Evolt360 scan and RECOVER Solo session that come with it.","group":"members"},{"id":"sim-book-recover","type":"simulation","audience":"employee","area":"guides","title":"Book a RECOVER Together or Solo session","minutes":5,"steps":7,"demo":true,"src":"content/sims/onyx-sim-placeholder.html?title=Book+a+RECOVER+session&steps=7","blurb":"Check room availability, book the right room type, and take payment or apply a membership inclusion.","group":"recover"},{"id":"sim-fitness-passport","type":"simulation","audience":"employee","area":"guides","title":"Process a Fitness Passport visit","minutes":4,"steps":6,"demo":true,"src":"content/sims/onyx-sim-placeholder.html?title=Process+a+Fitness+Passport+visit&steps=6","blurb":"Scan the Fitness Passport, record the visit, and handle a card that will not validate.","group":"members"},{"id":"gd-opening","type":"guide","audience":"employee","area":"guides","title":"Opening the gym at 5am","minutes":6,"demo":true,"blurb":"Twelve steps from the car park to the first member through the door.","steps":["Arrive by 4:45am. Park in the staff bays and check the exterior for anything out of place before you go in.","Disarm the alarm and turn on the entry lights. Prop the front door for now; it closes again at step 10.","Walk the floor with the lights on. Look for equipment left out, spills, and anything broken. Note it in the shift log.","Turn on the reception screens, the music and the class studio displays.","Switch the RECOVER rooms on so the infrared sauna is at temperature for the first booking. Check the ice bath water level and temperature.","Restock towels at reception and in the RECOVER rooms. Check the water station.","Log in to the gym system at reception. Open the day's bookings and the class list.","Check today's class schedule against the coach roster. Message the coach if a class has no cover.","Walk the bathrooms and the change rooms. Restock, and report anything that needs cleaning beyond a wipe-down.","Set the front door to member access at 5:00am sharp. 24/7 members already have fob access; this opens the staffed entrance.","Greet the first members by name where you know it. Ask how their training is going.","Write the opening entry in the shift log: time, anything found, anything reported."],"group":"open-close"},{"id":"chk-opening","type":"checklist","audience":"employee","area":"checklists","title":"Opening checklist","minutes":3,"demo":true,"blurb":"Run it every opening shift. The guide explains why; this is the tick list.","checks":["Exterior checked on arrival and nothing out of place","Alarm disarmed and entry lights on","Floor walked; equipment left out, spills and damage noted in the shift log","Reception screens, music and studio displays on","Infrared sauna on and heating for the first booking","Ice bath level and temperature checked","Towels and water station restocked","Gym system logged in; today's bookings and class list open","Class cover confirmed against the coach roster","Bathrooms and change rooms checked and stocked","Front door set to member access at 5:00am","Opening entry written in the shift log"],"group":"bau"},{"id":"gd-closing","type":"guide","audience":"employee","area":"guides","title":"Closing and lock-up","minutes":5,"demo":true,"blurb":"The staffed day ends; 24/7 access continues. What must be done so the gym runs safely overnight.","steps":["Thirty minutes before close, announce that the staffed desk is closing and RECOVER bookings end at the last slot.","Turn the RECOVER rooms off after the last session. Drain and cover the ice bath as per the room card. Leave the sauna door open to air.","Walk the floor. Rack weights, wipe benches, straighten mats. Report anything broken in the shift log.","Restock towels and water for the overnight members.","Close the till, run the end-of-day report in the gym system and file it as the procedure card says.","Check the bathrooms and change rooms one last time.","Set the front door back to fob-only access. Confirm the after-hours signage and the emergency number are visible.","Turn off reception screens and music. Leave the safety lighting on.","Write the closing entry in the shift log, arm the alarm zones that cover the back of house, and leave through the staff door."],"group":"open-close"},{"id":"chk-closing","type":"checklist","audience":"employee","area":"checklists","title":"Closing up checklist","minutes":3,"demo":true,"blurb":"Staffed hours end; 24/7 access continues. Tick every line before you leave.","checks":["Thirty-minute closing announcement made","Last RECOVER session finished; sauna off and door left open to air","Ice bath drained and covered as per the room card","Floor walked; weights racked, benches wiped, mats straightened","Faults or damage noted in the shift log","Towels and water restocked for overnight members","Till closed; end-of-day report run and filed","Bathrooms and change rooms checked","Front door set to fob-only access; after-hours signage and emergency number visible","Reception screens and music off; safety lighting on","Closing entry written; back-of-house alarm zones armed; left via the staff door"],"group":"bau"},{"id":"gd-recover-turnaround","type":"guide","audience":"employee","area":"guides","title":"Turning a RECOVER room around between sessions","minutes":4,"demo":true,"blurb":"The ten minutes between bookings, done the same way every time.","steps":["Knock and wait for the previous booking to leave. Thank them by name.","Wipe the sauna benches and door handle with the approved cleaner. Replace the bench towel.","Skim the ice bath, check the temperature reading and top up if the level is below the line.","Replace towels, empty the bin, and reset the timer display.","Check the room card: lighting scene, music level, sauna set temperature for the next booking type.","Mark the room as ready in the gym system so the next member can be checked in.","Meet the next booking at reception. Walk them in if it is their first RECOVER session and explain the timer and the call button."],"group":"recover"},{"id":"chk-recover-room","type":"checklist","audience":"employee","area":"checklists","title":"Recovery Room checklist","minutes":2,"demo":true,"blurb":"Every turnaround between RECOVER bookings, the same ten ticks.","checks":["Previous booking has left and the room is clear","Sauna benches and door handle wiped with the approved cleaner","Bench towel replaced","Ice bath skimmed and temperature reading within range","Ice bath topped up to the line","Fresh towels placed and bin emptied","Timer display reset","Room card applied for the next booking type: lighting, music, sauna temperature","Call button tested","Room marked ready in the gym system"],"group":"bau"},{"id":"chk-floor-sweep","type":"checklist","audience":"employee","area":"checklists","group":"bau","title":"Gym floor sweep","minutes":2,"demo":true,"blurb":"Every hour on a staffed shift. Ten minutes, the whole floor.","checks":["Walk the free weights: dumbbells paired and racked in order, plates back on the trees, collars returned","Benches and pads wiped, adjusted back to flat, positioned square","Cable attachments back on their pegs, cables untangled","Machines clear of plates and personal items","Mats rolled or stacked, foam rollers and bands back in their place","Bins emptied if over half full","Spray bottles and towel stations stocked","Water station full and cups stocked","Anything broken tagged and noted in the shift log","Said hello to at least a few members while you walked"]},{"id":"chk-class-studio","type":"checklist","audience":"employee","area":"checklists","group":"bau","title":"Class studio setup and pack down","minutes":3,"demo":true,"blurb":"Before the coach arrives, and after the last member leaves.","checks":["Studio floor clear and swept before setup","Equipment set out to the coach's plan, one station per booked attendee plus two spare","Weights checked for the class: matched pairs, nothing damaged","Sound system on and tested at a sensible level","Lighting scene set for the class type","Air conditioning set and the room aired if the previous class was full","Water and towels stocked at the door","Class list open on the tablet and check-in ready","After class: all equipment wiped and returned to its home","After class: floor swept, mirrors spot-cleaned, room reset for the next booking","Attendance closed off and any no-shows marked"]},{"id":"chk-tour","type":"checklist","audience":"employee","area":"checklists","group":"bau","title":"Showing a prospect around","minutes":3,"demo":true,"blurb":"A tour is a conversation with a route. Ask first, walk second, ask again at the end.","checks":["Greeted them by name and got theirs","Asked what they are training for before showing them anything","Asked when they usually train, so you can show them the gym as it will be for them","Walked the free weights and the machines, matched to what they said they want","Showed the class studio and named two classes that suit them","Showed the RECOVER rooms and explained Together and Solo","Showed the change rooms and the 24/7 entry","Explained the membership options that fit, not all of them","Named the joining fee and what is included, without being asked twice","Offered to sign them up today, once","Took their name and number if they are thinking about it, and logged the enquiry","Thanked them and walked them to the door"]},{"id":"chk-new-member","type":"checklist","audience":"employee","area":"checklists","group":"bau","title":"A new member's first visit","minutes":2,"demo":true,"blurb":"The first week decides whether they stay a year. Ten minutes well spent.","checks":["Welcomed them by name and checked their fob works on the door they will actually use","Confirmed the app is installed and they can book a class","Walked them to the change rooms and the water station","Showed them where to find staff outside staffed hours","Booked their free Evolt360 scan if their membership includes it","Booked their free RECOVER Solo session if their membership includes it","Introduced them to a coach on the floor","Asked what they are training for and noted it on their account","Told them what to expect in their first class and offered to book one","Logged the first visit so the manager can follow up in week two"]},{"id":"chk-evolt","type":"checklist","audience":"employee","area":"checklists","group":"bau","title":"Running an Evolt360 body scan","minutes":2,"demo":true,"blurb":"Same conditions every time, or the comparison is worthless.","checks":["Booking confirmed and the member knows to arrive hydrated and without shoes or socks","Checked the member has no pacemaker or implanted electronic device; if unsure, do not scan and refer to the manager","Asked whether they have eaten or trained in the last two hours and noted it","Scanner plates wiped before and after","Member's profile set up or found: height, age, sex","Member positioned as the on-screen guide shows, heels and balls of both feet on the plates","Scan run without talking or movement","Report sent to the member's email and saved to their account","Walked them through the first page rather than handing over a number","Next scan suggested and booked, same time of day"]},{"id":"chk-deep-clean","type":"checklist","audience":"employee","area":"checklists","group":"bau","title":"Weekly deep clean","minutes":4,"demo":true,"blurb":"The jobs the daily clean does not reach. One shift a week, rostered.","checks":["Machine upholstery cleaned, not just wiped","Cable and pulley housings dusted","Mirrors cleaned floor to ceiling","Rubber flooring mopped with the approved product","Skirting boards and corners done","Vents and fans dusted","Change room lockers emptied of abandoned items and wiped inside","Showers descaled and drains cleared","RECOVER sauna benches treated as per the room card","Ice bath filter cleaned or replaced","Reception desk, screens and eftpos terminal cleaned","Cleaning log signed and anything needing a contractor flagged"]},{"id":"chk-emergency","type":"checklist","audience":"employee","area":"checklists","group":"bau","title":"Evacuation","minutes":2,"demo":true,"blurb":"Read it now, not during. Drill or real thing, the order is the same.","checks":["Alarm heard or emergency called: stop what you are doing and take the floor plan and phone","000 called if it is real and not already done","Music and screens off so people can hear instructions","Walked the gym floor calling the evacuation, loudly and calmly","Checked the class studio","Checked both RECOVER rooms and knocked on every door","Checked all change rooms, showers and toilets","Checked the back of house and the office","Directed everyone to the assembly point, not the car park","Head count taken against the check-in list at the assembly point","Nobody re-enters until the fire brigade or the manager on duty says so","Incident report written the same day"]},{"id":"gd-fitness-passport","type":"guide","audience":"employee","area":"guides","title":"Handling a Fitness Passport member","minutes":3,"demo":true,"blurb":"What Fitness Passport is, what it covers here, and what it does not.","steps":["Fitness Passport is a workplace program. The member's employer pays; they show a Fitness Passport card or the app at the desk.","Every visit is scanned and recorded. No scan, no visit recorded, and ONYX is not paid for it.","It covers gym access and group fitness classes. It does not cover RECOVER sessions, personal training or the Evolt360 scan. Those are paid at the desk like any casual purchase.","If the card or app will not validate, take the member's name and Fitness Passport number, let them train, and log it for the manager to follow up.","A Fitness Passport member who wants RECOVER on a regular basis is a lead for a RECOVER membership. Mention it once, warmly, and leave it there."],"group":"members"},{"id":"gd-class-checkin","type":"guide","audience":"employee","area":"guides","title":"Class check-in and no-shows","minutes":3,"demo":true,"blurb":"Every membership includes unlimited classes. The desk keeps the class list honest.","steps":["Open the class in the gym system fifteen minutes before it starts.","Check members in as they arrive. Anyone not booked can join if there is space; add them so the coach's list is right.","Five minutes after the start, mark the unarrived as no-shows.","A member with repeat no-shows gets a friendly word from the coach or manager, not from the desk.","Close the class list once it has started so the numbers reported are what actually trained."],"group":"members"},{"id":"gd-incident","type":"guide","audience":"employee","area":"guides","title":"Incidents and first aid basics","minutes":5,"demo":true,"blurb":"What to do in the first two minutes, and what to write down afterwards.","steps":["Stay calm and go to the person. Ask if they are okay and what happened. Do not move someone who has fallen and says they are in pain.","If they are unresponsive, not breathing normally, or bleeding heavily, call 000 first. Then start first aid. The defibrillator location is on the floor plan by reception.","Send another member or staff member to reception to fetch the first aid kit and to meet the ambulance at the door.","For minor injuries, treat from the kit, offer ice, and stay with them until they are comfortable.","Once the person is safe, write the incident report the same day: who, what, where, when, who was present, what was done. Facts only.","Tell the manager on duty before you leave the shift. They decide on any follow-up with the member.","Restock whatever you used from the kit and note it in the shift log."],"group":"safety"},{"id":"chk-week1","type":"checklist","audience":"employee","area":"getting-started","title":"Week 1 checklist","minutes":2,"demo":true,"blurb":"Tick these off as your first week goes by.","checks":["Collected my staff fob and confirmed it opens the staff door and the front door","Logged in to the gym system with my own account","Met the coaches on this week's roster","Shadowed a full opening shift","Shadowed a full closing shift","Turned a RECOVER room around with someone watching","Completed the four simulations in this portal","Watched the three welcome videos","Read the incident guide and know where the first aid kit and defibrillator are","Know who the manager on duty is for each of my shifts"],"group":"getting-started"},{"id":"gd-mgr-onboard-starter","type":"guide","audience":"manager","area":"guides","title":"Onboarding a new starter with this portal","minutes":4,"demo":true,"blurb":"The portal does the teaching. You do the shadowing and the sign-off.","steps":["Before day one, open this portal on the reception tablet and on the starter's own phone. It is one link; nothing to install.","Have them enter their name on first open. The progress card carries it.","Point them at the Week 1 path. The order is deliberate: videos first, the opening shift, then the systems simulations.","Pair each simulation with a shadowed real shift the same week. The simulation teaches the clicks; the shift teaches the people.","At the end of week one, ask for their progress card. Read it against the checklist and sign them off, or agree what week two covers.","Anything the portal got wrong or missing goes to the person maintaining it. It is updated for everyone, not just for the next starter."],"group":"team"},{"id":"gd-mgr-progress-card","type":"guide","audience":"manager","area":"guides","title":"Reading a progress card","minutes":2,"demo":true,"blurb":"What the export from the Me page tells you, and what it does not.","steps":["A progress card is a file the starter exports from their own device. It lists every item, its status, the date completed and the simulation score where there is one.","Simulation scores come straight from the simulation player: steps completed, wrong attempts, time taken. A pass is set inside each simulation.","Guides and checklists are self-marked. Treat them as a conversation starter, not proof.","The card is only as complete as the device it came from. Progress does not sync between phones in this version; the person's own phone is their record.","Keep the card with your onboarding notes. When the portal gains a hosted team view, these cards import into it."],"group":"team"},{"id":"chk-mgr-handover","type":"checklist","audience":"manager","area":"checklists","title":"Shift handover","minutes":2,"demo":true,"blurb":"Five things every handover covers.","checks":["Shift log read and anything open discussed","RECOVER bookings for the next shift confirmed and rooms ready","Class cover confirmed for the next shift","Any incident reports written and handed over","Till reconciled and end-of-day report filed"],"group":"bau"},{"id":"vid-mgr-welcome","type":"video","audience":"manager","area":"getting-started","title":"What we expect of a manager at ONYX","minutes":4,"demo":true,"src":null,"blurb":"Katie and Joey on the standard: how the floor should feel, how the team should be spoken to, and what you decide without asking.","group":"getting-started"},{"id":"gd-mgr-roster","type":"guide","audience":"manager","area":"guides","title":"Building the weekly roster","minutes":6,"demo":true,"blurb":"Published Thursday for the week starting Monday. Cover first, preferences second.","steps":["Open the roster for the coming week by Wednesday morning. Anything published later than Thursday afternoon is late.","Block the fixed points first: every group fitness class with its coach, and the staffed desk hours at each end of the day.","Fill the opening and closing shifts next. These are the two that cannot be left uncovered, and they need someone signed off on the opening and closing checklists.","Layer in RECOVER cover for the busy blocks: weekday mornings before 9, and weekday evenings after 5.","Now apply leave and availability. Anything requested more than two weeks out is honoured unless it leaves a shift uncovered.","Check nobody is rostered to close then open the next morning. It is legal and it is still a bad shift pattern.","Sanity-check the hours against budget before publishing. Flag to Joey if the week is over.","Publish, then message the team. Swaps go through you, not between staff directly."],"group":"team"},{"id":"gd-mgr-incident-followup","type":"guide","audience":"manager","area":"guides","title":"Following up an incident report","minutes":5,"demo":true,"blurb":"The staff member wrote the report. What you do with it in the next 48 hours.","steps":["Read the report the same shift it was written. If anything is vague, ask the person while they still remember it.","Call the member within 24 hours. Ask how they are, not whether they intend to complain. Write down what they say.","Photograph anything involved: the equipment, the floor, the spill, the sign that was or was not there.","If equipment was involved, take it out of service with a tag until it has been checked. A tag is cheaper than a second incident.","Decide whether it is reportable. Anything involving an ambulance, a head injury or a member who cannot continue goes to Joey and Katie the same day.","Write your follow-up under the original report: what you found, who you spoke to, what changed.","Close the loop with the staff member. They will handle the next one better if they hear what happened."],"group":"safety"},{"id":"gd-mgr-cancellation","type":"guide","audience":"manager","area":"guides","title":"Cancellations, freezes and difficult conversations","minutes":6,"demo":true,"blurb":"Most cancellations are a life change, not a complaint about the gym. Find out which one you are in.","steps":["Take the conversation off the desk. A member cancelling in front of a queue will not tell you the real reason.","Ask what has changed. Moving, money, injury, or unhappy with something here. The answer decides everything that follows.","Injury or illness: offer a freeze first. A frozen membership comes back; a cancelled one usually does not.","Money: name the cheaper plan honestly rather than defending the current one.","Unhappy: let them finish, write it down, and say what you will do. Do not discount your way out of a service problem.","Moving or genuinely done: process it cleanly and thank them. A graceful exit is how you get the referral.","Check the terms and conditions for notice and any remaining commitment before you agree to anything.","Log the reason in the gym system. The pattern across a month is worth more than any single conversation."],"group":"members"},{"id":"sim-mgr-refund","type":"simulation","audience":"manager","area":"guides","title":"Process a freeze and a partial refund","minutes":7,"steps":10,"demo":true,"src":"content/sims/onyx-sim-placeholder.html?title=Process+a+freeze+and+a+partial+refund&steps=10","blurb":"Freeze a membership with an end date, then refund a part month and record the reason against the account.","group":"members"},{"id":"art-mgr-kpis","type":"article","audience":"manager","area":"guides","title":"What we look at each week","minutes":3,"demo":true,"blurb":"Five numbers, read every Monday. Reference only; the gym system is the source of truth.","body":["Five numbers tell you how the week went. Read them every Monday morning before the team arrives.","Visits per active member. The single best predictor of whether someone stays. Under one visit a week across a month and that member is drifting.","Class attendance against capacity. A class under half full twice in a row is a timetable problem, not a coach problem.","RECOVER utilisation by room and by block. Empty weekday middays are normal; empty weekday evenings are not.","New joins against cancellations. The net number matters less than the two lines moving in the same direction.","Cancellation reasons, grouped. Three of the same reason in a month is a thing to fix, not a run of bad luck."],"group":"business"},{"id":"chk-mgr-week","type":"checklist","audience":"manager","area":"checklists","title":"Weekly manager checklist","minutes":3,"demo":true,"blurb":"Run through it once a week, same day each week.","checks":["Roster for next week published by Thursday","Class cover confirmed for every session","Shift logs from the week read and anything open actioned","Incident reports followed up and closed","New starters' progress cards reviewed","RECOVER room faults and consumables checked","Equipment fault list reviewed with Joey","Cancellation reasons from the week logged","Till and end-of-day reports reconciled for all seven days","One thing worth fixing raised with Katie or Joey"],"group":"bau"},{"id":"chk-mgr-monthly","type":"checklist","audience":"manager","area":"checklists","title":"Monthly compliance checklist","minutes":4,"demo":true,"blurb":"The dull one that matters when something goes wrong.","checks":["First aid kits checked and restocked at reception and in RECOVER","Defibrillator pads and battery in date","Fire exits clear, signage lit, evacuation plan visible","Emergency lighting tested","Cleaning schedule signed off for every week of the month","RECOVER water quality logs complete","Staff certifications current: first aid, CPR, coaching accreditation","Incident register reviewed for patterns","Chemical and cleaning products stored and labelled correctly","Anything outstanding escalated with a date against it"],"group":"bau"},{"id":"lnk-brand-sheet","type":"link","audience":"owner","area":"guides","title":"The ONYX brand portfolio","minutes":5,"href":"../brand/onyx-brand-sheet.html","blurb":"Colours, type, logo rules, components and the SimStudio kit, as captured from onyxgym.com.au. Every simulation and this portal follow it.","group":"brand"},{"id":"art-pricing-snapshot","type":"article","audience":"owner","area":"guides","title":"Membership snapshot, September 2026","minutes":3,"demo":true,"blurb":"The three plans as shown on the site on 17 September 2026. Reference only; the gym system is the source of truth for live prices.","body":["Three plans were on the site on 17 September 2026, all with 24/7 access and unlimited group fitness classes, and a $59 joining fee on the direct-debit plans.","ONYX Platinum, 6 months: $34.99 per week, billed fortnightly at $69.98. Marked most popular.","ONYX Black, 12 months: $28.99 per week, billed fortnightly at $57.98. Includes a free Evolt360 body scan and report valued at $50, and a free RECOVER Solo session valued at $45.","ONYX Black, paid in full: $1299 once for 12 months, the equivalent of $24.98 per week. Same inclusions as the 12-month plan.","RECOVER by ONYX is sold separately as monthly memberships and session packages, in Together and Solo rooms."],"group":"business"},{"id":"gd-owner-artarmon","type":"guide","audience":"owner","area":"guides","title":"Opening Artarmon: what the portal needs","minutes":3,"demo":true,"blurb":"The second site reuses everything here. Five things change.","steps":["A second site entry in the portal config: name, address, and which guides differ. Opening and closing will differ; the systems simulations will not.","Fresh captures of any screen in the gym system that differs by site, replaced in the simulation with Replace image. The overlays stay where they are.","The site's own photos for the onboarding videos and the floor tour.","A site switcher on the Me page so a person who works both sites sees the right guides.","The same brand, the same portal, the same progress card. Nothing is rebuilt."],"group":"business"},{"id":"art-owner-scorecard","type":"article","audience":"owner","area":"guides","title":"The monthly scorecard","minutes":4,"demo":true,"blurb":"What to read on the first Monday of the month, and in what order.","body":["Read it in this order. The order is the point: members before money, because the money follows.","Active members, and the split between month-to-month and committed terms. A base tilting toward month-to-month is a base that can leave quickly.","Net movement. Joins minus cancellations, plotted across twelve months rather than compared to last month.","Visit frequency across the whole base. This is the leading indicator. It falls a month or two before cancellations rise.","Revenue per active member, including RECOVER, personal training and the Evolt360 scans. A flat membership price with rising revenue per member means the extras are working.","RECOVER utilisation and its share of revenue. The rooms have fixed running costs, so utilisation is the number that decides whether they earn their floor space.","Personal training hours sold, by coach. It is both a revenue line and a read on which coaches members trust.","Cancellation reasons, grouped and ranked. Then pick one to fix this month. One, properly, beats five noted."],"group":"business"},{"id":"art-owner-recover","type":"article","audience":"owner","area":"guides","title":"RECOVER: how the rooms earn their space","minutes":4,"demo":true,"blurb":"The commercial case for contrast therapy, in plain terms. Reference only; the accountant has the real numbers.","body":["A RECOVER room costs the same whether it runs empty or full: the heat, the water, the space it takes on the floor plan. Everything therefore turns on utilisation.","Two products serve two motivations. Together is social and fills weekends and evenings. Solo is a premium private slot and fills weekday mornings.","The free Solo session bundled into the ONYX Black memberships is an acquisition cost, not a giveaway. It exists so a member experiences the room once; conversion after that first session is what to measure.","Memberships beat casual sessions for a recovery product, because the habit is weekly and a package makes the member plan around it.","The room is also a retention tool for the gym membership itself. A member who books RECOVER weekly has a second reason to keep coming, and second reasons are what stop cancellations.","Watch three things: utilisation by block, the split between Together and Solo, and how many RECOVER members are also gym members. The third one tells you whether the room is growing the business or just moving revenue around inside it."],"group":"recover"},{"id":"gd-owner-hiring","type":"guide","audience":"owner","area":"guides","title":"Hiring a coach","minutes":6,"demo":true,"blurb":"Qualifications get them in the room. Temperament decides the hire.","steps":["Write the role around the gap, not the person. A powerlifting coach and a group fitness coach are different hires with different weeks.","Screen for the non-negotiables on paper: current certification, first aid and CPR, insurance and a working with children check where relevant.","Phone screen for fifteen minutes. You are only checking whether they can hold a warm conversation with a stranger, which is most of the job.","Run a floor trial, paid, during a busy block. Watch whether they approach members unprompted or wait to be approached.","Give them one coaching scenario: a member doing something unsafe who did not ask for help. The way they interrupt tells you how they will treat the floor.","Ask what they do when they do not know the answer. The good answer involves finding out and coming back.","Reference-check the last two employers, and ask specifically whether members asked for that person by name.","Onboard through this portal from day one. Same path, same checklists, same standard as everyone else."],"group":"team"},{"id":"gd-owner-reports","type":"guide","audience":"owner","area":"guides","title":"Updating the reports with your own numbers","minutes":4,"demo":true,"blurb":"What the Reports page will read, where each file comes from, and what happens to the member-level rows. Read this before the first import is set up.","group":"business","steps":["Open Reports and tap Import data. That panel is the short version of this guide and is the one to show anyone asking what the page will do.","Pull a month of each export you already have: members, bookings, takings. One real file from each source is what the mapping gets built from — a sample or a blank template is not enough, because the shape of the real data is the thing being read.","Check each file has a date column and something that identifies the member consistently. Where two systems name the same person differently, say so; matching across files is the part that takes the work and guessing it is how numbers go wrong.","Send the files through once. The mapping gets written against your column names, so nothing has to be renamed or reformatted at your end, this month or any month after.","Confirm the first month's figures against what you already know. Active members and takings are the two to check hardest; if those are right the rest usually follows.","From then on it is drop the files in and the page redraws. Same exports, same place, once a month.","Know what is kept: the totals behind the charts, and the twelve-month history. Member-level rows are read to work out the totals and discarded. Nothing identifying anyone is stored in the portal."]},{"id":"gd-owner-portal","type":"guide","audience":"owner","area":"guides","title":"Keeping this portal current","minutes":4,"demo":true,"blurb":"A portal nobody updates is worse than no portal. Five habits keep it true.","steps":["One owner. Somebody's name is against this portal, and everyone knows whose.","Corrections come from the floor. The staff who use it find the errors first, and the Support page tells them where to send them.","When the gym system changes, the screenshots change. Reopen the SimStudio project, use Replace image on the affected steps, export again. The overlays stay where they are.","When a procedure changes, the guide changes the same week. A guide that contradicts the floor teaches the team to ignore the portal.","Review the whole thing quarterly against what actually happens on shift. Delete anything nobody uses; dead content makes the rest look stale.","Roll a new site in by reusing everything. Only the opening and closing guides and the site photos differ."],"group":"brand"},{"id":"chk-owner-monthly","type":"checklist","audience":"owner","area":"checklists","title":"Owner's monthly review","minutes":3,"demo":true,"blurb":"First Monday of the month. Thirty minutes, done properly.","checks":["Scorecard read in order and last month's numbers compared","Cancellation reasons reviewed and one chosen to fix","RECOVER utilisation checked by room and block","Personal training hours reviewed by coach","Roster hours against budget for the month","Incident register reviewed","Compliance checklist confirmed complete by the manager","Team: anyone thriving, anyone struggling, anyone owed a conversation","Marketing spend against joins for the month","Artarmon progress reviewed against its plan"],"group":"bau"},{"id":"lnk-owner-site","type":"link","audience":"owner","area":"guides","title":"Live memberships page","minutes":1,"href":"https://onyxgym.com.au/gym/memberships-pricing/","blurb":"What a prospective member sees today. Check it against the snapshot in this portal whenever pricing moves.","group":"business"},{"id":"m-sauna","type":"guide","audience":"member","area":"tips","group":"m-recover","title":"In the sauna: how long, and how we leave it","minutes":2,"demo":true,"blurb":"Booking it, how long to sit, and what to do on your way out.","steps":["Book it first, at the desk or in GymMaster. Turning up on spec does not work — the room may be someone else's for the next half hour.","Check the door tag on your way in. Green means the room is free, red means the booking before yours is still running and the room is already at temperature.","Take a towel in and sit on it. Everyone after you would rather you did.","Fifteen to twenty minutes is plenty. Come out earlier if you feel light-headed — there is nothing to prove in here.","Do not go straight from the sauna into the ice bath. Cool down on your own first.","Turn the panel off on your way out and wipe the bench with the spray and paper by the door.","Drink water. The station is by reception."]},{"id":"m-sauna-panel","type":"guide","audience":"member","area":"tips","title":"How to use the sauna panel","minutes":2,"demo":true,"blurb":"Turning it on, setting the temperature, and how long it takes to come up from cold.","group":"m-recover","steps":["The panel is on the wall to your right as you walk in, at shoulder height.","Press the power button once. The display wakes and shows the temperature the room is at right now, not the one it is set to.","Press it again to see the target. It flashes for a few seconds, and the up and down arrows change it while it is flashing.","45 to 55 degrees suits most people. The room maxes out at 65, which is hotter than almost anyone needs.","From cold it takes about ten minutes to come up. If the door tag was red when you arrived, it is already there.","The fan button runs the circulation fan. Leave it on — it is what stops the room feeling stuffy rather than hot.","Hold power for two seconds to turn it off. Do that on your way out even if someone is waiting; they will set their own."]},{"id":"m-sauna-light","type":"guide","audience":"member","area":"tips","title":"Changing the light colour in the sauna","minutes":1,"demo":true,"blurb":"The colour therapy button, what each colour is for, and how to get back to plain white.","group":"m-recover","steps":["The light button is the one with the bulb icon, under the temperature arrows.","Each press moves to the next colour: white, red, blue, green, amber, then off.","Hold it for two seconds to jump straight back to white from wherever you are.","Red is the one most people come for — it is the colour used for skin and recovery. Blue and green are calmer to sit in. There is no wrong answer.","The colour does nothing to the heat. The panel still reads the real temperature whatever the room looks like.","Leave it on white when you finish, so the next person walks into a room they can see in."]},{"id":"m-sauna-speaker","type":"guide","audience":"member","area":"tips","title":"Connecting your phone to the sauna speaker","minutes":2,"demo":true,"blurb":"Pairing over Bluetooth, what to do when it will not connect, and the one rule about volume.","group":"m-recover","steps":["Turn the speaker on at the panel: the button with the note icon. A blue light blinks while it waits to pair.","On your phone open Bluetooth and look for ONYX Sauna. Tap it. The blinking light goes solid once you are connected.","Not in the list? Someone else is still paired — a phone holds the connection from outside the room. Hold the note button for three seconds to drop the old device, then look again.","Play from whatever app you like. Volume is on your phone, not on the panel.","Keep it at a level the room can live with. The door is not thick and the RECOVER rooms are next door. If someone else is in with you, ask first.","Take your phone out with you. Do not leave it in there — the heat is well past what a phone is built for."]},{"id":"m-icebath","type":"guide","audience":"member","area":"tips","group":"m-recover","title":"The ice bath, first time","minutes":2,"demo":true,"blurb":"What to expect, how long to stay in, and who should ask us first.","steps":["Shower first. It keeps the water clean and everyone gets a better bath.","Check the thermometer on the rim. We hold it between 8 and 12 degrees.","Get in slowly and sit down to your shoulders. The first 30 seconds are the hardest part; breathe out longer than you breathe in.","Two to three minutes is a full session. There is a timer on the wall.","Get out under your own steam, dry off, and move around until you warm up. Do not go straight into the sauna.","Talk to us first if you are pregnant, or if you have a heart condition, low blood pressure or Raynaud's. Same if you are not sure."]},{"id":"m-lockers","type":"hotspot","audience":"member","area":"tips","group":"m-floor","title":"The lockers: locking and unlocking","minutes":2,"hotspots":3,"demo":false,"src":"content/sims/onyx-sim-lockers.html","ratio":"818 / 1220","blurb":"A photo of the lockers with the keypad steps on it. Tap a marker for how to lock one, how to unlock it, and what to do if you forget the code."},{"id":"m-booking","type":"simulation","audience":"member","area":"tips","group":"m-booking","title":"Book a class in GymMaster","minutes":4,"steps":8,"demo":true,"src":"content/sims/onyx-sim-placeholder.html?title=Book+a+class+in+GymMaster&steps=8","blurb":"Finding the timetable, booking a spot, getting on the waitlist, and cancelling without losing your place next week."},{"id":"m-recover-booking","type":"simulation","audience":"member","area":"tips","group":"m-booking","title":"Book a RECOVER room","minutes":3,"steps":6,"demo":true,"src":"content/sims/onyx-sim-placeholder.html?title=Book+a+RECOVER+room&steps=6","blurb":"Together or Solo, picking a time, and using the sessions your membership already includes."},{"id":"m-included","type":"article","audience":"member","area":"tips","group":"m-booking","title":"What your membership already includes","minutes":2,"demo":true,"blurb":"The things people pay for that they did not need to.","body":["ONYX Black and Platinum both come with an Evolt360 body scan and a RECOVER Solo session when you join. Plenty of people never claim either. Ask at the desk and we will book them in.","Classes are included, not extra. Book a spot so we know to expect you; if you cannot make it, cancel and someone on the waitlist gets in.","Everything in RECOVER is booked: the infrared sauna, the ice bath, and the Together and Solo rooms. Book at the desk or in GymMaster. The rooms run one booking at a time, which is the whole point — you are not sharing them with whoever wanders in.","Bring a friend on a guest pass once a month. Tell us the day before so we can have them ready at the desk rather than filling in forms while you wait.","If you are away for a while, freeze rather than cancel. It keeps your joining rate. The desk will book you a call with the manager to sort it out."]},{"id":"m-etiquette","type":"guide","audience":"member","area":"tips","group":"m-floor","title":"How we leave the floor","minutes":2,"demo":true,"blurb":"Six habits that make the difference between a good gym and a great one.","steps":["Put weights back on the number they came from. Every plate and dumbbell has a home.","Wipe down a bench or a pad after you use it. Spray and paper are at both ends of the floor.","Do not sit on a machine between sets if someone is waiting. Offer to work in.","Phones on speaker belong in the change room, not the floor.","Drop the bar on the platforms, not on the rubber. That is what the platforms are for.","If something is broken or loose, tell us at the desk. We would rather hear it from you than find it next week."]},{"id":"m-firstweek","type":"video","audience":"member","area":"tips","group":"m-floor","title":"Your first week at ONYX","minutes":3,"demo":true,"src":null,"blurb":"A walk through the floor, where everything lives, and what to do on day one."}],"support":{"audience":{"member":{"intro":"The questions we get asked at the desk most. If yours is not here, ask us.","faq":[{"q":"I have forgotten my locker code.","a":"There is no master code at the desk — you set your own and the lock only knows that one. Come and find us and the manager on duty will open it. Check you are at the right locker first; most of the time it is the wrong door rather than a forgotten code."},{"q":"The class I want is full.","a":"Get on the waitlist in GymMaster. Roughly one in five booked spots frees up on the day, and the app tells you the moment one does. Turning up on spec and hoping is the one thing that does not work — the coach takes the list as it stands."},{"q":"I need to cancel a class booking.","a":"Cancel it in GymMaster rather than just not coming. It takes a second and it gives the spot to whoever is next on the waitlist. Repeatedly not showing up without cancelling is the only thing that puts your booking privileges at risk."},{"q":"Do I need to book the sauna or the ice bath?","a":"Yes. Everything in RECOVER is booked — the infrared sauna and the ice bath as well as the Together and Solo rooms. Book at the front desk or in GymMaster, the same way you book a class. It is worth doing ahead: the rooms run one booking at a time and the early mornings go first."},{"q":"How do I freeze my membership?","a":"Talk to us and we will book you a call with the manager. Freezing keeps the rate you joined on, which cancelling and rejoining does not, so it is almost always the better option if you are going away for a while."},{"q":"My Fitness Passport app will not load.","a":"Do not stand at the desk fighting it. Give us your name and your Passport number, go and train, and we will record the visit for you."},{"q":"Something is broken or does not feel safe.","a":"Tell us at the desk straight away, however small it seems. A loose pin or a frayed cable is a five-minute fix if we know about it and a much bigger problem if we find out next week."},{"q":"I have lost something.","a":"Ask at the desk. Lost property is kept behind reception for a month. Anything valuable — keys, a wallet, a phone — goes somewhere locked, so it will not be in the box."}],"contact":{"label":"Still stuck?","text":"Come and see whoever is on the desk — that is what we are there for. Outside opening hours these reach us and someone will get back to you.","name":"ONYX Gym & Fitness, Alexandria","address":"20 Bowden Street, Alexandria NSW","email":"hello@onyxgym.com.au","phone":"+61255500100","phoneLabel":"(02) 5550 0100","demo":true}}},"faq":[{"q":"A member's fob or card will not scan.","a":"Check the membership is active in the gym system by name. If it is, let them in, note the fob number in the shift log, and reissue at the desk. If it is not active, explain kindly and offer to take a payment or book them in with the manager."},{"q":"Two RECOVER bookings clash for the same room.","a":"The system booking wins. Offer the other member the other room type at the same price, or the next free slot with a complimentary extension. Log it so the manager can see how it happened."},{"q":"A member has forgotten their locker code.","a":"The lockers are keypad locks the member sets themselves, so there is no code at the desk to look up. Check they are at the right locker first — most of these turn out to be the wrong door rather than a forgotten code. If it really is their locker, get the manager on duty; opening it is theirs to decide, not yours. The photo guide in Learn shows how the lock is set."},{"q":"The Fitness Passport app will not load.","a":"Take the member's name and Fitness Passport number, let them train, and log it for the manager to record the visit later."},{"q":"Someone wants to cancel a membership at the desk.","a":"Do not process it at the desk. Take their details and the reason, and book them a call with the manager. Cancellations follow the terms and conditions and need the manager's sign-off."},{"q":"Who do I call after hours?","a":"The manager on duty for the day is on the shift log. Anything urgent about safety is 000 first, then the manager."}],"assistance":[{"queries":["Anything on shift you are unsure about","A member's fob, card or check-in","A booking, a class list or the till","Where something is kept","An incident, injury or safety concern","A refund, cancellation or complaint","Roster and shift changes"],"name":"Manager on duty","role":"Rostered per shift, named on the shift log","how":"Find them on the floor first. Safety emergencies are 000 before anyone else.","email":"duty.manager@onyxgym.com.au","phone":"+61255500118","phoneLabel":"(02) 5550 0118","demo":true},{"queries":["Brand, marketing and social media","Membership and pricing decisions","Partnerships and Fitness Passport"],"name":"Katie King","role":"Co Founder","how":"Via the manager on duty for anything urgent.","email":"katie@onyxgym.com.au","phone":"+61491570156","phoneLabel":"0491 570 156","demo":true},{"queries":["Training programs and the gym floor","Coaches and the class schedule","Equipment faults and orders"],"name":"Joey","role":"Co Founder","how":"Via the manager on duty for anything urgent.","email":"joey@onyxgym.com.au","phone":"+61491570157","phoneLabel":"0491 570 157","demo":true},{"queries":["Coaching standards","Member experience and feedback","Personal training enquiries"],"name":"Mick Abboud","role":"Head of Excellence","how":"Via the manager on duty for anything urgent.","email":"mick@onyxgym.com.au","phone":"+61491570158","phoneLabel":"0491 570 158","demo":true}],"_assistanceNote":"Each card leads with the problems it covers, then the person. Email and phone are placeholders on ONYX's own domain and on Australia's reserved fictitious number ranges; replace with the real details and drop the demo flag. phone is what tel: dials, phoneLabel is what a person reads.","reportIssue":{"label":"Something wrong in this portal?","text":"Tell the manager on duty what page you were on and what you expected. Corrections go to whoever maintains the portal and are updated for everyone."}},"footer":"ONYX Learning Hub · Built beside SimStudio · Content marked Demo is for ONYX to confirm.","_areasNote":"Areas are the Learn filters. Groups are the subheadings inside them, in this order.","groups":[{"id":"getting-started","area":"getting-started","label":"Getting Started","blurb":"Your first week. Start here."},{"id":"open-close","area":"guides","label":"Opening and closing","blurb":"The two shifts that cannot be left uncovered."},{"id":"members","area":"guides","label":"Helping members","blurb":"The desk, the system and the conversations."},{"id":"recover","area":"guides","label":"RECOVER","blurb":"The sauna and ice bath rooms."},{"id":"safety","area":"guides","label":"Safety and incidents","blurb":"What to do, and what happens next."},{"id":"team","area":"guides","label":"Team and roster","blurb":"Hiring, onboarding and covering the week."},{"id":"business","area":"guides","label":"The business","blurb":"The numbers, the pricing and the next site."},{"id":"brand","area":"guides","label":"Brand and this portal","blurb":"How ONYX looks, and how this portal stays true."},{"id":"bau","area":"checklists","label":"BAU","blurb":"Business as usual. The tick lists you run on shift."},{"id":"m-recover","area":"tips","label":"RECOVER rooms","blurb":"The sauna, the ice bath and the two rooms you book."},{"id":"m-floor","area":"tips","label":"On the floor","blurb":"Lockers, kit you have not used before, and how we leave the place."},{"id":"m-booking","area":"tips","label":"Booking and your membership","blurb":"GymMaster, classes, and what your membership already includes."}],"reports":{"audiences":["owner"],"title":"Reports","asOf":"September 2026, month to date","note":"Demo figures. The gym system is the source of truth; these show the shape of the page, not ONYX's numbers.","demo":true,"tiles":[{"id":"active","label":"Active members","value":"1,284","delta":"+38","deltaLabel":"vs August","upIsGood":true,"trend":[1052,1068,1041,1120,1163,1181,1198,1215,1224,1240,1246,1284]},{"id":"net","label":"Net movement","value":"+38","sub":"71 joined · 33 cancelled","delta":"+12","deltaLabel":"vs August","upIsGood":true,"trend":[14,16,-27,79,43,18,17,17,9,16,6,38]},{"id":"visits","label":"Visits per member per week","value":"1.9","delta":"−0.1","deltaLabel":"vs August","upIsGood":true,"trend":[2.1,2,1.7,2.2,2.2,2.1,2,2,1.9,2,2,1.9]},{"id":"rpm","label":"Revenue per member","value":"$146","sub":"per month, all products","delta":"+$4","deltaLabel":"vs August","upIsGood":true,"trend":[131,132,130,136,138,139,141,142,142,143,142,146]},{"id":"recover","label":"RECOVER utilisation","value":"58%","delta":"+6 pts","deltaLabel":"vs August","upIsGood":true,"trend":[38,40,36,44,47,49,50,52,51,53,52,58]},{"id":"classes","label":"Class attendance vs capacity","value":"71%","delta":"+3 pts","deltaLabel":"vs August","upIsGood":true,"trend":[64,63,58,67,69,70,70,71,68,69,68,71]}],"members":{"title":"Active members, twelve months","months":["Oct","Nov","Dec","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep"],"values":[1052,1068,1041,1120,1163,1181,1198,1215,1224,1240,1246,1284]},"cancellations":{"title":"Cancellation reasons, September","unit":"members","rows":[["Moving away",9],["Cost",8],["Injury or illness",6],["Not using it",5],["Switched gyms",3],["Other",2]]},"recoverBlocks":{"title":"RECOVER utilisation by block","unit":"%","max":100,"rows":[["Weekday 5–9am",82],["Weekday 9am–4pm",31],["Weekday 4–9pm",76],["Saturday",64],["Sunday",47]]},"classes":{"title":"Class attendance vs capacity, by type","unit":"%","max":100,"rows":[["Strength",84],["HIIT",78],["Boxing",66],["Mobility",52]]},"import":{"label":"Import data","title":"Importing your own numbers","intro":"The figures on this page are demo figures. This is where your own would come in: the exports you already pull, dropped in each month, turned into the charts above.","takes":["The member export from your gym system — actives, joins, cancellations with reasons","The bookings export — classes and RECOVER, booked against capacity","The takings export from the POS or payment provider","Anything else you keep in a spreadsheet, as long as the columns are the same shape each month"],"does":["Reads each file against a mapping written once for your system, so the column names can be whatever your export calls them","Matches the same member across files, which is the part that takes the work","Rolls everything up to the figures on this page and keeps the twelve-month history","Stores the totals only. Member-level rows are read and discarded, never saved into the portal"],"status":"Not connected yet. The button is here so you can see where it goes and tell us which exports you actually have; the mapping is built per client once we have a real file from each source.","cta":"Talk to us about your exports","demo":true}},"processes":{"audiences":["owner"],"title":"Process library","blurb":"One place for how this business works. Every process here drives the guides, checklists and simulations your team sees, so the training and the procedure can never say different things.","demo":true,"note":"Demo content. Processes, owners and review dates are placeholders for ONYX to confirm.","statuses":[{"id":"documented","label":"Documented","blurb":"Written up and driving live content."},{"id":"draft","label":"Draft","blurb":"Captured, not yet turned into training."},{"id":"gap","label":"Gap","blurb":"Known to be needed, not yet written."}],"areas":[{"id":"front-desk","label":"Front desk"},{"id":"operations","label":"Operations"},{"id":"recover","label":"RECOVER"},{"id":"classes","label":"Classes"},{"id":"people","label":"People"},{"id":"money","label":"Money"},{"id":"compliance","label":"Compliance"}],"items":[{"id":"pr-checkin","name":"Checking a member in","area":"front-desk","owner":"Manager on duty","status":"documented","reviewed":"2026-08-14","reviewCycle":"6 months","drives":["sim-checkin"],"summary":"Find the member, confirm the membership is active, record the visit, and handle a fob or card that will not scan."},{"id":"pr-sell","name":"Selling a membership","area":"front-desk","owner":"Manager on duty","status":"documented","reviewed":"2026-08-14","reviewCycle":"6 months","drives":["sim-sell-membership","chk-tour"],"summary":"From the tour to the signed membership: the plan, the joining fee, and the inclusions that come with it."},{"id":"pr-passport","name":"Fitness Passport visits","area":"front-desk","owner":"Manager on duty","status":"documented","reviewed":"2026-07-02","reviewCycle":"12 months","drives":["gd-fitness-passport","sim-fitness-passport"],"summary":"What Fitness Passport covers here, what it does not, how every visit is scanned, and what to do when the app will not load."},{"id":"pr-newmember","name":"A new member's first visit","area":"front-desk","owner":"Manager on duty","status":"documented","reviewed":"2026-08-20","reviewCycle":"12 months","drives":["chk-new-member"],"summary":"The ten minutes that decide whether a new member is still here in a year."},{"id":"pr-tour","name":"Showing a prospect around","area":"front-desk","owner":"Manager on duty","status":"documented","reviewed":"2026-08-20","reviewCycle":"12 months","drives":["chk-tour"],"summary":"A tour is a conversation with a route. Ask what they are training for before showing them anything."},{"id":"pr-evolt","name":"Running an Evolt360 body scan","area":"front-desk","owner":"Head of Excellence","status":"documented","reviewed":"2026-06-11","reviewCycle":"12 months","drives":["chk-evolt"],"summary":"Same conditions every time, including the contraindication check, or the comparison between scans is worthless."},{"id":"pr-open","name":"Opening the gym","area":"operations","owner":"Manager on duty","status":"documented","reviewed":"2026-09-01","reviewCycle":"6 months","drives":["gd-opening","chk-opening"],"summary":"Everything from the car park at 4:45am to the first member through the door at 5:00am."},{"id":"pr-close","name":"Closing and lock-up","area":"operations","owner":"Manager on duty","status":"documented","reviewed":"2026-09-01","reviewCycle":"6 months","drives":["gd-closing","chk-closing"],"summary":"The staffed day ends and 24/7 access continues. What must be true before the last staff member leaves."},{"id":"pr-sweep","name":"Gym floor sweep","area":"operations","owner":"Manager on duty","status":"documented","reviewed":"2026-08-20","reviewCycle":"12 months","drives":["chk-floor-sweep"],"summary":"The hourly walk on a staffed shift. Ten minutes, the whole floor, and a hello to whoever is training."},{"id":"pr-deepclean","name":"Weekly deep clean","area":"operations","owner":"Manager on duty","status":"documented","reviewed":"2026-08-20","reviewCycle":"12 months","drives":["chk-deep-clean"],"summary":"The jobs the daily clean does not reach, rostered to one shift a week."},{"id":"pr-equipment","name":"Equipment fault and repair","area":"operations","owner":"Joey","status":"draft","reviewed":"2026-09-10","reviewCycle":"12 months","drives":[],"summary":"Tagging a machine out of service, logging the fault, getting a contractor in, and telling members when it will be back.","note":"Captured from a floor conversation. Needs the contractor list and the approval limit before it becomes a guide."},{"id":"pr-stock","name":"Stock and consumables ordering","area":"operations","owner":"Manager on duty","status":"gap","reviewed":null,"reviewCycle":"12 months","drives":[],"summary":"Towels, cleaning product, first aid, RECOVER consumables. Who orders, at what trigger, and against whose budget.","note":"Currently held by one person. First on the list to document."},{"id":"pr-recover-turn","name":"RECOVER room turnaround","area":"recover","owner":"Manager on duty","status":"documented","reviewed":"2026-08-14","reviewCycle":"6 months","drives":["gd-recover-turnaround","chk-recover-room"],"summary":"The ten minutes between bookings, done the same way every time."},{"id":"pr-recover-book","name":"Booking a RECOVER session","area":"recover","owner":"Manager on duty","status":"documented","reviewed":"2026-08-14","reviewCycle":"6 months","drives":["sim-book-recover"],"summary":"Room availability, Together against Solo, payment or a membership inclusion."},{"id":"pr-recover-water","name":"RECOVER water quality and plant","area":"recover","owner":"Joey","status":"draft","reviewed":"2026-09-12","reviewCycle":"6 months","drives":[],"summary":"Ice bath water testing, filter changes, sauna maintenance and the logs that have to be kept.","note":"Half written. The compliance requirement needs confirming before this drives a checklist."},{"id":"pr-class-checkin","name":"Class check-in and no-shows","area":"classes","owner":"Manager on duty","status":"documented","reviewed":"2026-07-02","reviewCycle":"12 months","drives":["gd-class-checkin"],"summary":"Opening the class, checking members in, marking no-shows, and closing the list so the numbers are real."},{"id":"pr-class-setup","name":"Class studio setup and pack down","area":"classes","owner":"Head of Excellence","status":"documented","reviewed":"2026-08-20","reviewCycle":"12 months","drives":["chk-class-studio"],"summary":"Before the coach arrives and after the last member leaves."},{"id":"pr-class-cover","name":"Finding class cover","area":"classes","owner":"Manager on duty","status":"gap","reviewed":null,"reviewCycle":"12 months","drives":[],"summary":"A coach calls in sick two hours before a full class. Who is called, in what order, and what members are told.","note":"Happens monthly and is handled differently every time."},{"id":"pr-roster","name":"Building the weekly roster","area":"people","owner":"Manager on duty","status":"documented","reviewed":"2026-09-05","reviewCycle":"6 months","drives":["gd-mgr-roster"],"summary":"Published Thursday for the week starting Monday. Cover first, preferences second."},{"id":"pr-handover","name":"Shift handover","area":"people","owner":"Manager on duty","status":"documented","reviewed":"2026-09-05","reviewCycle":"12 months","drives":["chk-mgr-handover"],"summary":"Five things every handover covers, so the next shift starts informed."},{"id":"pr-onboard","name":"Onboarding a new starter","area":"people","owner":"Manager on duty","status":"documented","reviewed":"2026-09-05","reviewCycle":"6 months","drives":["gd-mgr-onboard-starter","chk-week1"],"summary":"The portal does the teaching. The manager does the shadowing and the sign-off."},{"id":"pr-hiring","name":"Hiring a coach","area":"people","owner":"Katie King","status":"documented","reviewed":"2026-08-28","reviewCycle":"12 months","drives":["gd-owner-hiring"],"summary":"Qualifications screen the applicant in. Temperament decides the hire."},{"id":"pr-cancel","name":"Cancellations and freezes","area":"money","owner":"Manager on duty","status":"documented","reviewed":"2026-09-05","reviewCycle":"6 months","drives":["gd-mgr-cancellation","sim-mgr-refund"],"summary":"Diagnose the reason before offering anything. A freeze comes back; a cancellation usually does not."},{"id":"pr-eod","name":"End of day and till reconciliation","area":"money","owner":"Manager on duty","status":"draft","reviewed":"2026-09-12","reviewCycle":"6 months","drives":[],"summary":"Closing the till, running the report, filing it, and what to do when it does not balance.","note":"Written from the current practice. Needs the finance sign-off on the variance threshold."},{"id":"pr-complaint","name":"Member complaint escalation","area":"money","owner":"Katie King","status":"gap","reviewed":null,"reviewCycle":"12 months","drives":[],"summary":"What the desk can resolve, what goes to the manager, what reaches a founder, and the timeframe for each.","note":"Nothing written. The most common source of inconsistent outcomes."},{"id":"pr-incident","name":"Incidents and first aid","area":"compliance","owner":"Manager on duty","status":"documented","reviewed":"2026-09-01","reviewCycle":"6 months","drives":["gd-incident","gd-mgr-incident-followup"],"summary":"The first two minutes, then the report, then the 48 hours of follow-up."},{"id":"pr-evac","name":"Evacuation","area":"compliance","owner":"Manager on duty","status":"documented","reviewed":"2026-09-01","reviewCycle":"6 months","drives":["chk-emergency"],"summary":"Drill or real, the order is the same, including both RECOVER rooms and every change room."},{"id":"pr-compliance","name":"Monthly compliance round","area":"compliance","owner":"Manager on duty","status":"documented","reviewed":"2026-09-05","reviewCycle":"6 months","drives":["chk-mgr-monthly"],"summary":"First aid, defibrillator, fire, lighting, water logs, certifications. The dull one that matters when something goes wrong."},{"id":"pr-artarmon","name":"Artarmon pre-opening","area":"compliance","owner":"Katie King","status":"draft","reviewed":"2026-09-15","reviewCycle":"3 months","drives":["gd-owner-artarmon"],"summary":"Everything that must exist before a second site opens its doors.","note":"Live document. Updated as the fit-out progresses."}]},"news":{"title":"What's new","intro":"Timetable changes, new kit, and what is on at Alexandria.","demo":true,"note":"Demo posts. A post written here is saved on this device and joins the list straight away; export it and it goes into the config as a permanent one. A date in the future holds it back until then.","posts":[{"id":"n-recover-hours","title":"RECOVER is open an hour earlier","date":"2026-09-18","tag":"Facilities","lead":"The sauna and the ice bath now open at 5am on weekdays, so you can get a round in before work.","body":["The sauna and the ice bath are now on from 5am Monday to Friday, an hour earlier than before. Weekend hours have not changed.","This came out of the member survey: the morning crowd was arriving at 5 and waiting until 6 for the rooms to come up to temperature. They are now on a timer and hot when the doors open.","The Together and Solo rooms still start at 6am, because they need someone on to turn them over between bookings. If early Solo sessions are something you would use, tell us at the desk — enough of you asking is how the sauna hours changed."]},{"id":"n-plates","title":"New bumper plates on the platforms","date":"2026-09-11","tag":"Equipment","lead":"A full set of calibrated bumpers has gone in, and the old chipped ones have gone out.","body":["Both platforms have a new set of bumper plates, 5 kg through 25 kg, colour coded the standard way.","The old set had taken enough of a beating that the 20s were no longer 20. If you have been wondering why your lifts felt different between platforms, that was why.","Please keep them on the platforms. They are softer than the iron and they mark up fast on the rubber."]},{"id":"n-timetable","title":"Timetable changes from October","date":"2026-09-04","tag":"Classes","lead":"Two new evening strength classes, and Saturday mobility moves to 8am.","body":["From 1 October there are two more evening strength classes, Tuesday and Thursday at 6.30pm. Both are 45 minutes.","Saturday mobility moves from 7am to 8am. The 7am slot was the least booked hour on the timetable and the 8am waitlist was the longest, so we swapped them.","Bookings for October open in GymMaster a fortnight ahead. If a class you want is full, get on the waitlist — roughly one in five booked spots frees up on the day."]},{"id":"n-evolt","title":"Evolt360 scans every second Saturday","date":"2026-08-21","tag":"Community","lead":"The scanner is in twice a month now, and your first one is included.","body":["Evolt360 is at Alexandria every second Saturday, 8am to noon. Book a slot at the desk or in GymMaster.","If you joined on Black or Platinum, your first scan is included and plenty of people have not claimed theirs.","Come in fasted if you can, and try to book the same time of day each round. Comparing a Saturday morning scan to a Wednesday evening one tells you more about your day than your training."]},{"id":"n-fitness-passport","title":"Fitness Passport members are welcome","date":"2026-08-07","tag":"Memberships","lead":"If your workplace is on Fitness Passport, you can train here.","body":["Alexandria takes Fitness Passport. Scan at the desk on the way in, the same as any other visit.","Classes are included for Passport members too — book them in GymMaster like everyone else.","If the app will not load, do not stand at the desk fighting it. Give us your name and Passport number, go and train, and we will record the visit."]}],"audiences":["member","owner"],"authors":["owner"],"writeLabel":"Write a post","tags":["Facilities","Equipment","Classes","Community","Memberships","Opening hours"]},"floorplans":{"title":"Look around","intro":"Search a machine, or a body part like legs or back. Tap a pin for what it is.","placeholder":"Try legs, chest, treadmill, sauna","sites":[{"id":"alexandria","label":"Alexandria","viewBox":"0 0 100 134","demo":true,"note":"Demo layout. The real plan of Alexandria goes in here once ONYX marks up where everything sits, and each machine's pin moves to where it actually stands; the search and the list work the same way against it.","zones":[{"id":"studio","label":"Studio","x":2,"y":2,"w":58,"h":30,"blurb":"Classes run in here. Doors shut while a class is on."},{"id":"recover","label":"RECOVER","x":64,"y":2,"w":34,"h":44,"blurb":"Infrared sauna, ice bath, and the Together and Solo rooms you book."},{"id":"cardio","label":"Cardio","x":2,"y":34,"w":58,"h":26,"blurb"
