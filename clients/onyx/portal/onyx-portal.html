":["arms"],"x":89.8,"y":85.8},{"name":"Sled","zone":"turf","tags":["legs","glutes","cardio","full body"],"x":10.4,"y":74.9},{"name":"Battle ropes","zone":"turf","tags":["arms","shoulders","core","cardio"],"x":18.1,"y":74.9},{"name":"Medicine balls","zone":"turf","tags":["core","full body"],"x":25.9,"y":74.9},{"name":"Plyo boxes","zone":"turf","tags":["legs","glutes"],"x":33.6,"y":74.9},{"name":"Slam balls","zone":"turf","tags":["core","full body"],"x":14.2,"y":80.6},{"name":"TRX straps","zone":"turf","tags":["core","back","arms","full body"],"x":29.8,"y":80.6},{"name":"Mats","zone":"stretch","tags":["mobility","core"],"x":54.1,"y":108.8},{"name":"Foam rollers","zone":"stretch","tags":["mobility"],"x":65.4,"y":108.8},{"name":"Resistance bands","zone":"stretch","tags":["mobility","shoulders","glutes"],"x":76.6,"y":108.8},{"name":"Stretching frame","zone":"stretch","tags":["mobility","back"],"x":87.9,"y":108.8},{"name":"Infrared sauna","zone":"recover","tags":["recovery"],"note":"Booked at the desk or in GymMaster. The panel guide is in Helpful tips.","x":74.8,"y":19.4},{"name":"Ice bath","zone":"recover","tags":["recovery"],"x":87.2,"y":19.4,"note":"Booked at the desk or in GymMaster."},{"name":"RECOVER Together room","zone":"recover","tags":["recovery"],"note":"Booked at the desk or in GymMaster.","x":74.8,"y":34.1},{"name":"RECOVER Solo room","zone":"recover","tags":["recovery"],"note":"Booked at the desk or in GymMaster.","x":87.2,"y":34.1},{"name":"Lockers","zone":"change","tags":["facilities"],"note":"Set your own 4-digit code. The photo guide is in Helpful tips.","x":15.8,"y":126.8},{"name":"Showers","zone":"change","tags":["facilities"],"x":34.2,"y":126.8},{"name":"Water station","zone":"reception","tags":["facilities"],"x":74,"y":126.8},{"name":"Class studio","zone":"studio","tags":["cardio","full body"],"note":"Timetable is on the site and in GymMaster.","x":31,"y":19.8}]}]}}</script>
<script id="portal-sims" type="application/json">{"content/sims/onyx-sim-lockers.html":"<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n<meta name=\"generator\" content=\"SimStudio 4.4.0\">\n<link rel=\"icon\" href=\"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d10'/%3E%3Crect x='6' y='9' width='20' height='14' rx='3' fill='none' stroke='%23f59e0b' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='2.6' fill='%23f59e0b'/%3E%3C/svg%3E\">\n<title>Interactive simulation</title>\n<style>\n\n/* ---------- the root, and nothing outside it ----------\n   An LMS's HTML import can inject this markup straight into its own page. At\n   that point a rule on html, body or * is a rule on the host's page: the dark\n   ground repainted their lesson, overflow:hidden stopped it scrolling, and a\n   fixed overlay covered the whole window whatever height the embed was given.\n   That is why no height fixed it — nothing about the height was the problem.\n\n   So the root carries what the body used to, every selector is scoped under\n   it, and nothing in here is position:fixed. In page mode — where the export\n   really is the document — the player sets the document's own margin itself,\n   because then it owns it. */\n#sim{\n  position:relative; overflow:hidden; text-align:left;\n  background:var(--sim-bg,#0b0d10); color:var(--sim-fg,#e7ebf2);\n  font:14px/1.5 \"Segoe UI\",Inter,system-ui,-apple-system,sans-serif;\n  -webkit-font-smoothing:antialiased;\n}\n#sim,#sim *,#sim *::before,#sim *::after{box-sizing:border-box}\n/* :where() so this keeps the weight a bare element selector had. Scoped under\n   the id it outranks a class, and color:inherit then beat the glossary link's\n   own blue — a check caught it. No backticks in here: this file is a template\n   literal and one would end the string. */\n:where(#sim) button{font:inherit;color:inherit;cursor:pointer}\n/* page: the export is the whole document, or an iframe of its own, so it\n   fills what it has been given — which is what it has always done */\n#sim.page{height:100vh}\n@supports (height:100dvh){ #sim.page{height:100dvh} }\n/* block: the export is a guest in someone else's page. Its height comes from\n   the shape of the capture, the way an image sizes a figure, so it occupies a\n   block of the lesson and never claims a viewport it does not own. */\n#sim.block{width:100%}\n#sim.block .sim-shell{height:auto}\n#sim.block .sim-stage{padding:0}\n#sim.block .sim-frame{width:100%;aspect-ratio:auto;max-height:none}\n#sim.block .sim-frame > img.cap{width:100%;height:auto;max-height:none}\n.sim-shell{display:flex;flex-direction:column;height:100%;position:relative}\n/* bare: the author has taken the bars off. Embedded in a lesson page they are\n   a second set of chrome inside the page's own, which is the whole of the\n   complaint. display rather than visibility, so the controls leave the tab\n   order along with the pixels. Nothing is reachable only from here — a click\n   target advances by being clicked, and a card carries its own way onward. */\n#sim.bare .sim-top,#sim.bare .sim-foot{display:none}\n/* and the stage stops insetting the capture from an edge that has nothing on\n   it any more — with the bars off that inset is just more black */\n#sim.bare .sim-stage{padding:0}\n/* the one way back to the bars when they are hidden only while embedded: full\n   screen brings them with it. Drawn only where full screen can actually be\n   had, and never when the author said never. */\n.sim-expand{\n  position:absolute;right:10px;bottom:10px;z-index:30;\n  width:30px;height:30px;padding:0;display:grid;place-items:center;\n  background:rgba(12,16,22,.72);color:#fff;border:1px solid rgba(255,255,255,.3);\n  border-radius:8px;opacity:.5;transition:opacity .2s;\n}\n.sim-expand:hover,.sim-expand:focus-visible{opacity:1}\n.sim-expand svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;\n  stroke-linecap:round;stroke-linejoin:round}\n\n/* ---------- header ---------- */\n.sim-top{\n  display:flex;align-items:center;gap:12px;padding:10px 16px;\n  background:#11141a;border-bottom:1px solid #232a34;flex:0 0 auto;\n}\n.sim-title{font-weight:650;display:flex;align-items:center;gap:9px;min-width:0}\n.sim-title .dot{width:8px;height:8px;border-radius:50%;background:var(--sim-accent);box-shadow:0 0 10px var(--sim-accent);flex:0 0 auto}\n.sim-title span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n.sim-top .spacer{flex:1}\n.sim-counter{font-size:12px;color:#9aa4b4;font-variant-numeric:tabular-nums;white-space:nowrap}\n.chips{display:flex;border:1px solid #2f3743;border-radius:8px;overflow:hidden}\n.chips button{background:#171b22;border:0;border-right:1px solid #232a34;padding:5px 10px;font-size:12px;color:#9aa4b4}\n.chips button:last-child{border-right:0}\n.chips button.on{background:var(--sim-accent);color:var(--sim-ink,#1a1206);font-weight:650}\n.tbtn{\n  background:#171b22;border:1px solid #2f3743;border-radius:8px;padding:5px 11px;font-size:12px;color:#c3cbd8;\n}\n.tbtn:hover{background:#1f252f;color:#fff}\n.tbtn.primary{background:var(--sim-accent);border-color:var(--sim-accent);color:var(--sim-ink,#1a1206);font-weight:650}\n.tbtn[disabled]{opacity:.4;cursor:not-allowed}\n\n\n/* ---------- stage ---------- */\n.sim-stage{position:relative;flex:1 1 auto;display:grid;padding:16px;overflow:auto;min-height:0;\n  /* The row and column are the stage's own size rather than the content's.\n     place-items:center used to size this grid's one item from what was in it,\n     which left the column with no height or width to measure against — so the\n     frame's width:100% and max-height:100% had nothing to resolve to and it\n     sized itself from the image again. Centring moved inside the column. */\n  grid-template-rows:minmax(0,1fr);grid-template-columns:minmax(0,1fr)}\n/* One column, kept from the first step to the last: the stage is never left\n   with nothing in it and never dips through its own black between steps. What\n   changes inside it is reconciled rather than rebuilt, so the spotlight and the\n   card slide to their next places. The grid cell is still stated because the\n   stage is a grid and the column is its only item. */\n.sim-col{\n  grid-area:1/1;\n  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;\n  width:100%;height:100%;max-width:100%;min-width:0;min-height:0;\n}\n.co.dock{position:static!important;left:auto!important;top:auto!important;width:100%!important;\n  max-width:none;height:auto!important;box-shadow:none;animation:none}\n.zoomwin{overflow:hidden;width:100%;max-width:100%;position:relative}\n.zoomwin > .sim-frame{transform-origin:50% 50%;transition:transform .3s cubic-bezier(.4,0,.2,1)}\n.zoomtip{font-size:11px;color:#8b95a5;text-align:center}\n/* The frame carries the capture's own shape and then takes everything the\n   stage will give it: width:100% grows it, max-height:100% shrinks it back\n   when the stage is the shorter way round, and the aspect ratio keeps it\n   honest between the two. That is what stops the black.\n\n   It used to size from the image's natural pixels, capped at 100vh - 150px.\n   Two faults in one line. The capture was never scaled UP, so a 1280px\n   screenshot in a wider frame left black down both sides for ever; and the\n   150px was reserved for bars that an author may have switched off, so it\n   left a band top and bottom that nothing was ever going to fill.\n   --cap-ar is set from the image's natural size as it loads. */\n.sim-frame{\n  position:relative;line-height:0;box-shadow:0 18px 50px rgba(0,0,0,.55);background:#000;\n  aspect-ratio:var(--cap-ar,16/9);width:100%;max-width:100%;max-height:100%;min-height:0;\n}\n.sim-frame > img.cap{display:block;width:100%;height:100%}\n/* the step before, laid over the one arriving and faded out. The capture\n   underneath is the frame's own and the one that sizes it, so the spotlight\n   and the card over the top are the same elements from step to step and can\n   slide between their places rather than being rebuilt. */\n.sim-frame > img.ghost{\n  position:absolute;left:0;top:0;width:100%;height:100%;z-index:1;\n  transition:opacity .26s ease;\n}\n.sim-frame > img.ghost.gone{opacity:0}\n.sim-frame .noshot{width:100%;height:100%;display:grid;place-items:center;color:#4a5361;line-height:1.5;\n  background:repeating-linear-gradient(45deg,#101419,#101419 10px,#141a21 10px,#141a21 20px)}\n.sim-catch{position:absolute;inset:0;z-index:4;cursor:default}\n.spot{position:absolute;z-index:5;pointer-events:none;transition:all .32s cubic-bezier(.4,0,.2,1)}\n.veil{position:absolute;inset:0;z-index:5;pointer-events:none}\n\n/* ---------- layers ---------- */\n.ov{position:absolute}\n.hs{\n  z-index:9;background:transparent;padding:0;display:block;\n  /* left/top/width/height are in here because the ring is kept from step to\n     step and slides to the next target with the spotlight around it. Without\n     it the hole travelled and the ring appeared at the far end first. */\n  transition:transform .12s,box-shadow .2s,\n             left .32s cubic-bezier(.4,0,.2,1),top .32s cubic-bezier(.4,0,.2,1),\n             width .32s cubic-bezier(.4,0,.2,1),height .32s cubic-bezier(.4,0,.2,1);\n}\n.hs:focus-visible{outline:3px solid #fff;outline-offset:3px}\n.hs.pulse{animation:hspulse 1.9s ease-out infinite}\n@keyframes hspulse{\n  0%{box-shadow:0 0 0 0 var(--pc),0 0 0 0 rgba(0,0,0,0)}\n  70%{box-shadow:0 0 0 12px rgba(0,0,0,0),0 0 22px var(--pc)}\n  100%{box-shadow:0 0 0 0 rgba(0,0,0,0),0 0 0 rgba(0,0,0,0)}\n}\n.hs.flash{animation:hsflash .5s ease-in-out 3}\n@keyframes hsflash{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}\n/* a wrong attempt: the target itself says so, and nothing else moves */\n.hs.bad,.ov-input.bad{\n  border-color:var(--sim-bad,#ef4444)!important;\n  box-shadow:0 0 0 3px var(--sim-bad-soft,rgba(239,68,68,.26));\n  animation:none;\n}\n.ov-input.bad{outline:none}\n.hs.bad.wrong,.ov-input.bad.wrong{animation:badpulse .6s ease-out 2}\n@keyframes badpulse{\n  0%{box-shadow:0 0 0 0 var(--sim-bad-glow,rgba(239,68,68,.55))}\n  70%{box-shadow:0 0 0 11px var(--sim-bad-gone,rgba(239,68,68,0))}\n  100%{box-shadow:0 0 0 3px var(--sim-bad-soft,rgba(239,68,68,.26))}\n}\n.ov-text{display:flex;align-items:center;line-height:1.35;padding:2px 5px;z-index:8}\n.ov-mask{z-index:7;display:grid;place-items:center;font-size:11px;letter-spacing:1px;color:#5b6675}\n.ov-arrow{z-index:8;pointer-events:none}\n.ov-input{\n  z-index:10;border-style:solid;font:inherit;font-size:13px;padding:0 8px;\n}\n.ov-input:focus{outline:2px solid var(--sim-accent);outline-offset:1px}\n/* A wrong entry tints the field as well as reddening its edge: a screenshot is\n   full of bordered boxes and an edge alone is easy to miss. The wash is a\n   background-image, which lays over the author's own background-color rather\n   than replacing it — the field keeps the colour it was given and wears the\n   wash on top. The red comes from the kit, like every other wrong-attempt\n   mark; the literal one that used to be here ignored it. */\n.ov-input.bad{background-image:linear-gradient(var(--sim-bad-wash),var(--sim-bad-wash))}\n/* and an accepted one says so in the field the learner is looking at */\n.ov-input.good{\n  border-color:var(--sim-good,#15803d)!important;\n  box-shadow:0 0 0 3px var(--sim-good-soft,rgba(21,128,61,.26));\n  background-image:linear-gradient(var(--sim-good-wash,rgba(21,128,61,.11)),var(--sim-good-wash,rgba(21,128,61,.11)));\n  animation:none;\n}\n\n/* ---------- hotspot markers ----------\n   The button a learner opens to read about a part of the screen. Its size is\n   one number — the width — and the circle takes its height from that, so it\n   stays round at every size of screen and nothing has to measure anything. */\n.mk-wrap{z-index:15}\n.mk-wrap.open{z-index:40}\n.mk{\n  width:100%;height:100%;border:0;border-radius:50%;padding:0;display:block;cursor:pointer;\n  box-shadow:0 2px 8px rgba(0,0,0,.35);transition:transform .12s,opacity .2s,background .2s;\n}\n.mk:hover{transform:scale(1.08)}\n.mk:focus-visible{outline:3px solid #fff;outline-offset:3px}\n.mk svg{width:100%;height:100%;display:block}\n/* opened and neutral: it stays where it is, quieter, so a learner can see\n   which parts of the screen they have already read */\n.mk.faded{opacity:.62}\n.mk-card{\n  position:absolute;width:min(70vw,280px);border-radius:10px;overflow:hidden;\n  box-shadow:0 16px 40px rgba(0,0,0,.45);left:calc(100% + 10px);top:0;text-align:left;\n}\n.mk-card[hidden]{display:none}\n/* a marker near the right edge opens inwards, and one near the foot opens\n   upwards, from the percentages it is stored at — no measuring, so the card\n   goes to the same side in the tool, the export and a recorded video */\n.mk-card.l{left:auto;right:calc(100% + 10px)}\n.mk-card.up{top:auto;bottom:0}\n.mk-card h5{margin:0;padding:9px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px;line-height:1.35}\n.mk-card h5 svg{width:15px;height:15px;flex:0 0 auto}\n.mk-body{padding:10px 12px;font-size:12px;line-height:1.5}\n.mk-body p{margin:0}\n.mk-body p + p,.mk-body ul + p,.mk-body p + ul{margin-top:6px}\n.mk-body ul{margin:0;padding-left:17px}\n.mk-body li{margin:2px 0}\n\n/* ---------- callout ---------- */\n.co{\n  z-index:14;border-style:solid;padding:13px 15px;line-height:1.5;\n  box-shadow:0 16px 40px rgba(0,0,0,.5);\n  max-width:min(92vw,560px);\n  /* the card is the same card from step to step, so it moves to its next\n     place rather than being drawn again somewhere else */\n  transition:left .32s cubic-bezier(.4,0,.2,1),top .32s cubic-bezier(.4,0,.2,1),\n             width .32s cubic-bezier(.4,0,.2,1);\n}\n/* the card an answer has been accepted on: a ring in the green of the note\n   inside it, outside the author's own border rather than in place of it, and\n   carrying the card's own shadow along so the ring does not cost it. */\n.co.ok{box-shadow:0 0 0 2px var(--sim-good,#15803d),0 16px 40px rgba(0,0,0,.5)}\n/* docked under the screen on a phone the card has no shadow, and gaining one\n   with the ring would be the card lifting off the page for being right */\n.co.ok.dock{box-shadow:0 0 0 2px var(--sim-good,#15803d)}\n.co h4{margin:0 0 6px;font-size:14px;line-height:1.35;font-weight:600}\n.co p{margin:0;font-size:13px;opacity:.86;white-space:pre-wrap}\n/* the body is prose: paragraphs and dot points, drawn the same on the canvas\n   in the tool and painted the same again into a recorded video */\n.co p + p,.co ul + p,.co p + ul{margin-top:6px}\n.co ul{margin:0;padding-left:18px;font-size:13px;opacity:.86}\n.co li{margin:2px 0}\n/* bolder rather than 700: a heading is already heavy, so a fixed 700 landed on\n   the same face it was sitting in and bold in a heading could not be seen at\n   all. This steps up from whatever it is inside — 400 to 700 in the body, 600\n   to 900 in a heading — so it cannot collapse again. */\n/* a highlight is paper, so it gets a little room round the words and a soft\n   corner; ink is only ink */\n.hl{border-radius:3px;padding:0 2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}\n.co strong,.card strong,.ov-text strong{font-weight:bolder}\n.co em,.card em,.ov-text em{font-style:italic}\n/* the verb reads as the lead-in and the control it names as the payload */\n.co h4 em,.card h2 em{font-weight:500}\n.co .note{margin-top:8px;font-size:12px;opacity:.7;border-left:2px solid var(--sim-accent);padding-left:8px}\n/* the second wrong attempt earns a note, attached to the callout that carries\n   the step — not a banner somewhere else on the screen */\n.co .miss{\n  margin-top:11px;padding:8px 11px;border-radius:7px;\n  border-left:3px solid var(--sim-bad,#ef4444);\n  background:var(--sim-bad-wash,rgba(239,68,68,.11));font-size:12.5px;line-height:1.5;\n  animation:coin .2s ease-out;\n}\n.co .miss b{display:block;color:var(--sim-bad-ink,var(--sim-bad,#ef4444));font-weight:700;margin-bottom:1px}\n.co .miss em{font-style:normal;font-weight:700}\n/* the same note, in green, for an answer that was right. Nothing else about it\n   changes: it arrives in the same place, in the same shape, so a learner who\n   has read one wrong note knows where to look for this one. */\n.co .miss.good{\n  border-left-color:var(--sim-good,#15803d);\n  background:var(--sim-good-wash,rgba(21,128,61,.11));\n}\n.co .miss.good b{color:var(--sim-good-ink,var(--sim-good,#15803d))}\n.co .nav{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:12px}\n.co .nav .n{font-size:11.5px;opacity:.6;font-variant-numeric:tabular-nums;white-space:nowrap}\n/* the first thing on the right-hand side of the row carries the gap. A growing\n   spacer element did this before, and on a narrow card it wrapped onto a line\n   of its own and left a blank band across the foot; an auto margin has nothing\n   to wrap. */\n.co .nav .far{margin-left:auto}\n.co .nav button{border-radius:7px;padding:4px 12px;font-size:12.5px;border:1px solid rgba(255,255,255,.16);background:transparent}\n.co .nav button.go{background:var(--sim-accent);border-color:var(--sim-accent);color:var(--sim-ink,#1a1206);font-weight:650}\n.co .nav button[disabled]{opacity:.35;cursor:not-allowed}\n/* the acknowledgement sits in the foot's left corner and the button that leaves\n   in its right, so the press that opens the way onward is never under the\n   pointer that has just pressed something else. Both wear the accent, because\n   at any moment only one of them is on the card. */\n.co .nav button.ack,.co .nav button.on{animation:none;white-space:nowrap}\n/* the button's own colour, not the wrong-attempt red: nothing was got wrong\n   here, the press simply has not happened yet */\n.co .nav button.ack.nudge,.co .nav button.on.nudge{animation:gopulse 1.1s ease-out 2}\n@keyframes gopulse{\n  0%{box-shadow:0 0 0 0 var(--sim-go-glow,rgba(245,158,11,.55))}\n  70%{box-shadow:0 0 0 11px var(--sim-go-gone,rgba(245,158,11,0))}\n  100%{box-shadow:0 0 0 0 var(--sim-go-gone,rgba(245,158,11,0))}\n}\n\n/* ---------- multiple choice ----------\n   One question, its answers, and why. The card is the callout's paper and ink\n   because it is the same kind of thing — something to read, over the capture —\n   and right and wrong are not the author's colours to choose, so they are the\n   green a tick is drawn in and the kit's own wrong-attempt colour. */\n.qz{\n  z-index:16;border-style:solid;padding:15px 16px;line-height:1.5;\n  box-shadow:0 16px 40px rgba(0,0,0,.5);max-width:min(94vw,620px);\n  display:flex;flex-direction:column;gap:11px;\n}\n.qz-q{margin:0;font-size:14.5px;font-weight:650;line-height:1.35}\n.qz-list{display:flex;flex-direction:column;gap:7px}\n/* An answer is a button, so a keyboard reaches it and the reader knows it can\n   be pressed. Left-aligned and full width, because a row of centred pills\n   reads as navigation rather than as a list of answers. */\n.qz-op{\n  display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;\n  padding:9px 11px;border-radius:8px;font-size:13.5px;line-height:1.45;\n  border:1px solid var(--sim-edge,rgba(255,255,255,.22));background:transparent;\n  transition:background .14s ease,border-color .14s ease;\n}\n.qz-op:hover:not([disabled]){background:var(--sim-hover,rgba(255,255,255,.07))}\n.qz-op:focus-visible{outline:2px solid var(--sim-accent);outline-offset:2px}\n.qz-op[disabled]{cursor:default}\n/* the letter down the left: A, B, C, D. A circle rather than a square, so an\n   answer is never mistaken for a checkbox the learner can tick several of. */\n.qz-key{\n  flex:0 0 auto;width:21px;height:21px;border-radius:50%;display:grid;\n  place-items:center;font-size:11.5px;font-weight:700;\n  border:1px solid var(--sim-edge,rgba(255,255,255,.28));\n}\n/* :not(.qz-key) or this reaches the letter too. It is a direct-child span of\n   the row, and .qz-op > span outranks .qz-key on specificity, so the badge\n   took flex-grow:1, stretched to 157px beside a 21px height, and came out an\n   ellipse in every export. The editor never showed it: its rule is\n   .ly-choice .qz-key, which outranks anything the row can say. */\n.qz-op > span:not(.qz-key){flex:1 1 auto;min-width:0}\n/* answered: the pick is marked, and the right answer is shown whichever way it\n   went. The mark is a shape on the 24 grid, the same as a hotspot's face. */\n.qz-op.right{border-color:var(--sim-good,#15803d);background:var(--sim-good-wash,rgba(21,128,61,.11))}\n.qz-op.right .qz-key{background:var(--sim-good,#15803d);border-color:var(--sim-good,#15803d);\n  color:var(--sim-good-key,#fff)}\n.qz-op.wrong{border-color:var(--sim-bad,#ef4444);background:var(--sim-bad-wash,rgba(239,68,68,.11))}\n.qz-op.wrong .qz-key{background:var(--sim-bad,#ef4444);border-color:var(--sim-bad,#ef4444)}\n.qz-op.wrong .qz-key svg{stroke:var(--sim-bad-key,#fff)}\n.qz-key svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:3;\n  stroke-linecap:round;stroke-linejoin:round}\n/* the answers not in play once it is answered: still readable, plainly out */\n.qz-op.past{opacity:.5}\n/* why, in the ink of the outcome it explains */\n.qz-why{\n  margin:0;padding:9px 11px;border-radius:7px;font-size:12.5px;line-height:1.5;\n  border-left:3px solid var(--sim-good,#15803d);\n  background:var(--sim-good-wash,rgba(21,128,61,.11));\n  animation:coin .2s ease-out;\n}\n.qz-why.bad{border-left-color:var(--sim-bad,#ef4444);background:var(--sim-bad-wash,rgba(239,68,68,.11))}\n.qz-why b{display:block;font-weight:700;margin-bottom:1px;color:var(--sim-good-ink,var(--sim-good,#15803d))}\n.qz-why.bad b{color:var(--sim-bad-ink,var(--sim-bad,#ef4444))}\n.qz-foot{display:flex;justify-content:flex-end;margin-top:1px}\n.qz-foot button{\n  border-radius:7px;padding:5px 14px;font-size:12.5px;font-weight:650;\n  background:var(--sim-accent);border:1px solid var(--sim-accent);color:var(--sim-ink,#1a1206);\n}\n.qz-foot button.nudge{animation:gopulse 1.1s ease-out 2}\n/* docked under the screen on a phone, the same as a callout */\n.qz.dock{position:static!important;left:auto!important;top:auto!important;\n  width:100%!important;max-width:none;height:auto!important;box-shadow:none}\n\n/* ---------- glossary ---------- */\n.gl{\n  background:none;border:0;padding:0;margin:0;font:inherit;text-align:inherit;\n  color:var(--sim-link,#4583f9);\n  border-bottom:1px dashed var(--sim-link,#4583f9);cursor:help;border-radius:2px;\n}\n.gl:hover{border-bottom-style:solid;background:var(--sim-link-wash,rgba(69,131,249,.14))}\n.gl:focus-visible{outline:2px solid var(--sim-accent);outline-offset:2px}\n.gtip{\n  position:absolute;z-index:80;max-width:min(340px,88vw);background:#0e1218;color:#c3cbd8;\n  border:1px solid #2f3743;border-radius:11px;padding:11px 13px;font-size:12.5px;line-height:1.55;\n  box-shadow:0 18px 44px rgba(0,0,0,.62);animation:coin .14s ease-out;pointer-events:none;\n}\n.gtip b{\n  display:block;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;\n  color:var(--sim-accent);margin-bottom:5px;font-weight:700;\n}\n.gtip i{display:block;margin-top:7px;font-style:normal;font-size:11px;color:#7d8798}\n.card.wide{max-width:720px}\n.gsearch{\n  width:100%;background:#171b22;border:1px solid #2f3743;border-radius:9px;\n  padding:9px 12px;color:#e7ebf2;font:inherit;font-size:13px;\n}\n.gsearch:focus{outline:2px solid var(--sim-accent);outline-offset:1px}\n.gcount{margin:9px 0 4px;font-size:11.5px;color:#8b95a5}\n.glist{max-height:min(50vh,420px);overflow:auto;margin:0 -4px;padding:0 4px}\n.gent{padding:11px 0;border-top:1px solid #232a34}\n.gent:first-child{border-top:0}\n.gent h5{margin:0 0 3px;font-size:13px;font-weight:650;color:#e7ebf2}\n.gent p{margin:0;font-size:12.5px;color:#a9b3c2;line-height:1.55}\n.gent.hit{background:rgba(245,158,11,.09);border-radius:9px;padding-left:9px;padding-right:9px;margin:0 -9px;\n  box-shadow:inset 3px 0 0 var(--sim-accent)}\n.gempty{padding:18px 0;color:#8b95a5;font-size:12.5px}\n\n/* ---------- feedback ---------- */\n.ripple{position:absolute;z-index:20;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;\n  border:2px solid #ef4444;pointer-events:none;animation:rip .6s ease-out forwards}\n@keyframes rip{from{transform:scale(.4);opacity:1}to{transform:scale(2.4);opacity:0}}\n\n/* ---------- footer: where you are, and everything you can do ---------- */\n.sim-foot{\n  display:flex;align-items:center;gap:10px;padding:9px 16px;background:#11141a;\n  border-top:1px solid #232a34;flex:0 0 auto;font-size:12px;color:#9aa4b4;\n}\n.sim-foot .grow{flex:1}\n/* the progress bar is the space between the two sets of buttons */\n.sim-foot .sim-progress{\n  flex:1 1 auto;min-width:60px;height:4px;border-radius:2px;background:#242b36;\n  overflow:hidden;margin:0 4px;\n}\n.sim-foot .sim-progress > i{display:block;height:100%;width:0;background:var(--sim-accent);transition:width .3s ease}\n\n/* ---------- panels (intro / summary) ---------- */\n.sheet{\n  position:absolute;inset:0;z-index:60;display:grid;place-items:center;padding:22px;\n  background:rgba(6,8,11,.86);backdrop-filter:blur(3px);\n}\n.card{\n  background:#12161d;border:1px solid #2f3743;border-radius:14px;padding:26px 28px;\n  max-width:560px;width:100%;box-shadow:0 24px 70px rgba(0,0,0,.6);animation:coin .3s ease-out;\n}\n.card h2{margin:0 0 10px;font-size:20px;font-weight:600}\n.card p{margin:0 0 14px;color:#c3cbd8;line-height:1.6;white-space:pre-wrap}\n.card ul{margin:0 0 14px;padding-left:20px;color:#c3cbd8;line-height:1.6}\n.card li{margin:3px 0}\n.card .row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:18px}\n.card .foot-note{margin:14px 0 0;color:#8b95a5;font-size:11.5px;line-height:1.5}\n/* the one place an export says who built it: quiet, on the closing screen,\n   never over a step. The mark i hich is the only place a browser honours the request.\n               If the embedding page withholds the permission, canFull() is\n               false and it simply starts inline rather than promising it. */\n            if (embedded && canFull() && !fullNow()) toggleFull();\n            closeSheet(s);\n            render();\n          }\n        })\n      ])\n    ], S.allowSkip);\n  }\n\n  function finish() {\n    st.finished = true;\n    var total = SLIDES.filter(scored).length;\n    var clean = 0, missTotal = 0;\n    SLIDES.forEach(function (sl) {\n      if (st.firstTry[sl.id]) clean++;\n      missTotal += (st.misses[sl.id] || 0);\n    });\n    var score = total ? Math.round(clean / total * 100) : 100;\n    var pass = score >= (S.passMark || 0);\n    /* to the second: a seven-step task takes well under a minute, and \"1m\"\n       for everything told the learner nothing */\n    var secs = Math.max(1, Math.round((Date.now() - st.started) / 1000));\n    var taken = secs < 60\n      ? secs + 's'\n      : Math.floor(secs / 60) + 'm ' + (secs % 60) + 's';\n\n    /* the LMS gets the score either way — the learner only sees it if the\n       author asked for it */\n    report(score, pass);\n\n    if (S.showSummary === false) return;\n\n    /* \"first time\" was the same information as \"second tries\" read backwards */\n    var tiles = [\n      ['steps done', SLIDES.length + ' of ' + SLIDES.length],\n      ['second tries', String(missTotal)],\n      ['time taken', taken]\n    ];\n    if (S.showScore) tiles.splice(1, 0, ['accuracy', score + '%']);\n\n    var kids = [\n      rich('h2', null, S.completionTitle || 'Simulation complete'),\n      richBlocks(null, S.completionBody || '')\n    ];\n    if (S.showScore) {\n      kids.push(el('div', {}, [\n        el('span', { class: 'verdict ' + (pass ? 'pass' : 'fail'),\n                     text: pass ? 'Passed' : 'Below the pass mark' })\n      ]));\n    }\n    kids.push(el('div', { class: 'stats' }, tiles.map(function (t) {\n      return el('div', { class: 'stat' }, [el('b', { text: t[1] }), el('span', { text: t[0] })]);\n    })));\n\n    var s = sheet(kids.concat([\n      el('div', { class: 'row' }, [\n        el('button', { class: 'tbtn primary', text: 'Replay Sim', onclick: function () { closeSheet(s); restart(); } }),\n        el('button', { class: 'tbtn', text: 'Review the steps', onclick: function () { closeSheet(s); st.idx = 0; render(); } })\n      ]),\n      el('p', { class: 'foot-note', text: 'Nothing you did here touched the live system, so practice as often as you like.' }),\n      S.attribution === false ? null\n        : el('div', { class: 'madewith' }, [el('i', {}), el('span', { text: 'Built with SimStudio' })])\n    ]));\n  }\n\n  function restart() {\n    st.done = {}; st.misses = {}; st.note = {}; st.firstTry = {}; st.typed = {};\n    st.picked = {};\n    st.ack = {}; pulsed = null;\n    /* a marker that has been opened is part of the run, so a restart puts\n       every one of them back to the face the author drew */\n    st.seen = {}; st.open = null;\n    st.idx = 0; st.started = Date.now(); st.finished = false;\n    render();\n  }\n\n  /* completion signals for the host LMS ------------------------- */\n  function report(score, pass) {\n    var payload = { type: 'simulation:complete', title: plain(P.title) || '', score: score, passed: !!pass, steps: SLIDES.length };\n    try { if (window.parent && window.parent !== window) window.parent.postMessage(payload, '*'); } catch (e) {}\n    try { reportScorm(score, pass); } catch (e) {}\n  }\n\n  /* walk up the frame chain looking for a SCORM runtime */\n  function findScorm() {\n    var w = window, n = 0;\n    while (w && n++ < 10) {\n      try {\n        if (w.API_1484_11 && w.API_1484_11.Initialize) return { api: w.API_1484_11, version: '2004' };\n        if (w.API && w.API.LMSInitialize) return { api: w.API, version: '1.2' };\n      } catch (e) { /* cross-origin frame — keep walking */ }\n      if (w.parent === w) break;\n      w = w.parent;\n    }\n    if (window.opener) {\n      try {\n        if (window.opener.API_1484_11) return { api: window.opener.API_1484_11, version: '2004' };\n        if (window.opener.API) return { api: window.opener.API, version: '1.2' };\n      } catch (e) {}\n    }\n    return null;\n  }\n\n  function reportScorm(score, pass) {\n    var found = findScorm();\n    if (!found) return;\n    var api = found.api;\n    if (found.version === '2004') {\n      api.Initialize('');\n      api.SetValue('cmi.score.raw', String(score));\n      api.SetValue('cmi.score.min', '0');\n      api.SetValue('cmi.score.max', '100');\n      api.SetValue('cmi.score.scaled', (score / 100).toFixed(4));\n      api.SetValue('cmi.completion_status', 'completed');\n      api.SetValue('cmi.success_status', pass ? 'passed' : 'failed');\n      api.Commit('');\n      api.Terminate('');\n    } else {\n      api.LMSInitialize('');\n      api.LMSSetValue('cmi.core.score.raw', String(score));\n      api.LMSSetValue('cmi.core.score.min', '0');\n      api.LMSSetValue('cmi.core.score.max', '100');\n      api.LMSSetValue('cmi.core.lesson_status', pass ? 'passed' : 'failed');\n      api.LMSCommit('');\n      api.LMSFinish('');\n    }\n  }\n\n  /* ---------------- keyboard ---------------- */\n  document.addEventListener('keydown', function (e) {\n    /* Escape first: it has to work even from inside a typed field, and the key\n       never reaches a host page while focus is in this document — so pass it on.\n       The authoring tool's preview closes on it. */\n    if (e.key === 'Escape') {\n      hideTip();\n      /* the glossary is the innermost thing open, so it closes first and the\n         host page keeps its preview */\n      if (glossSheet) { closeGlossary(); return; }\n      /* then an open marker card: it is the next thing in, and closing it must\n         not carry the press out to the host page's preview either */\n      if (st.open) { closeMarkers(null); return; }\n      try {\n        if (window.parent && window.parent !== window) {\n          window.parent.postMessage({ type: 'simulation:escape' }, '*');\n        }\n      } catch (err) {}\n      return;\n    }\n    if (/^(INPUT|TEXTAREA)$/.test((e.target.tagName || ''))) return;\n    /* Enter and Space on an underlined term belong to the term */\n    if (glTarget(e) && (e.key === 'Enter' || e.key === ' ')) return;\n    if (e.key === 'ArrowRight' || e.key === 'Enter') { next(); e.preventDefault(); }\n    else if (e.key === 'ArrowLeft') { prev(); e.preventDefault(); }\n    else if (e.key === 'h' || e.key === 'H') { showMe(); }\n    else if ((e.key === 'g' || e.key === 'G') && glossOn) { openGlossary(null); }\n  });\n\n  /* geometry is percentage based, so only the narrow/wide switch needs a redraw */\n  var wasNarrow = isNarrow();\n  var rzTimer = null;\n  window.addEventListener('resize', function () {\n    clearTimeout(rzTimer);\n    rzTimer = setTimeout(function () {\n      if (isNarrow() !== wasNarrow) { wasNarrow = isNarrow(); render(); }\n    }, 180);\n  });\n\n  /* ---------------- go ---------------- */\n  document.documentElement.style.setProperty('--sim-accent', T.accent || '#f59e0b');\n  /* one brand colour, four uses: the border, the resting ring, the pulse it\n     grows out of, and the wash behind the note */\n  var badc = T.badColor || '#ef4444';\n  var css = document.documentElement.style;\n  css.setProperty('--sim-bad', badc);\n  css.setProperty('--sim-bad-soft', rgba(badc, 0.26));\n  css.setProperty('--sim-bad-glow', rgba(badc, 0.55));\n  css.setProperty('--sim-bad-gone', rgba(badc, 0));\n  css.setProperty('--sim-bad-wash', rgba(badc, 0.11));\n  css.setProperty('--sim-bad-ink', readable(badc, T.calloutBg || '#12161d', T.calloutFg || '#e7ebf2'));\n  /* right is not the author's colour to choose either, so an accepted answer\n     wears the same green as a hotspot's tick — one green in the player. Only\n     its ink is walked towards the card's own text, for the same reason the\n     wrong-attempt ink is: the callout can be a white card or a near-black one. */\n  css.setProperty('--sim-good', MK_GOOD);\n  css.setProperty('--sim-good-soft', rgba(MK_GOOD, 0.26));\n  css.setProperty('--sim-good-wash', rgba(MK_GOOD, 0.11));\n  css.setProperty('--sim-good-ink', readable(MK_GOOD, T.calloutBg || '#12161d', T.calloutFg || '#e7ebf2'));\n  /* the ink that lands on each of those two fills, by the same rule the\n     hotspot's tick and cross go through — one of them is white and the other\n     depends on the colour the kit chose, and neither is worth hardcoding */\n  css.setProperty('--sim-good-key', inkOn(MK_GOOD));\n  css.setProperty('--sim-bad-key', inkOn(badc));\n  /* A multiple choice's answers are bordered boxes on the author's own callout\n     paper, so the border and the hover cannot be keyed to white: on a white\n     card they would not be there at all. Both are the card's own ink at low\n     alpha, which puts a light edge on a dark card and a dark edge on a light\n     one without measuring anything. */\n  var qink = T.calloutFg || '#e7ebf2';\n  css.setProperty('--sim-edge', rgba(qink, 0.3));\n  css.setProperty('--sim-hover', rgba(qink, 0.08));\n  /* a hyperlink blue, walked towards the card's own text until it clears AA:\n     the callout can be a white card or a dark one, and one fixed blue cannot\n     be legible on both */\n  var link = readable('#0056FC', T.calloutBg || '#12161d', T.calloutFg || '#e7ebf2');\n  css.setProperty('--sim-link', link);\n  css.setProperty('--sim-link-wash', rgba(link, 0.14));\n  /* the same trick the wrong-attempt ring uses, on the accent: a pulse that is\n     the button's own colour rather than a red one on a step nothing went wrong on */\n  var acc = T.accent || '#f59e0b';\n  css.setProperty('--sim-go-glow', rgba(acc, 0.55));\n  css.setProperty('--sim-go-gone', rgba(acc, 0));\n  document.documentElement.style.setProperty('--sim-ink', ink(T.accent || '#f59e0b'));\n  buildChrome();\n  if (!SLIDES.length) border: var(--sim-border) solid var(--sim-highlight); font-size: 13px; color: var(--text); margin-top: 4px; }\n.done .mark { color: var(--primary); }\n@media (max-height: 460px) { .mark { width: 40px; } #intro { display: none; } .stage { gap: 10px; padding: 16px; } .card { padding: 12px 14px; } }\n@media (max-height: 300px) { .mark, .k { display: none; } h1 { font-size: 16px; } }\n</style>\n</head>\n<body>\n<svg width=\"0\" height=\"0\" style=\"position:absolute\" aria-hidden=\"true\"><defs><symbol id=\"logo\" viewBox=\"0 0 216 80\"><g fill=\"none\" stroke=\"#8DCA76\" stroke-width=\"3.4\" stroke-linejoin=\"round\" stroke-linecap=\"round\" transform=\"translate(-4 6) scale(0.86)\">\n    <polygon points=\"11,26 60,8 94,34 78,64 36,70 14,51\"/>\n    <polyline points=\"11,26 36,70 94,34\"/>\n    <line x1=\"11\" y1=\"26\" x2=\"64\" y2=\"34\" stroke-width=\"2.2\"/>\n  </g>\n  \n  <g fill=\"#ACACAC\" fill-rule=\"evenodd\" transform=\"translate(92 8)\">\n    <path d=\"M7,0 H24 V42 H0 V7 Z M7.5,7.5 V34.5 H16.5 V7.5 Z\"/>\n    <path transform=\"translate(30 0)\" d=\"M0,0 H7.5 L16.5,24 V0 H24 V42 H16.5 L7.5,18 V42 H0 Z\"/>\n    <path transform=\"translate(60 0)\" d=\"M0,0 H8 L12,15 L16,0 H24 L15.75,24 V42 H8.25 V24 Z\"/>\n    <path transform=\"translate(90 0)\" d=\"M0,0 H8 L12,13 L16,0 H24 L15.75,21 L24,42 H16 L12,29 L8,42 H0 L8.25,21 Z\"/>\n  </g>\n  \n  <g fill=\"#8DCA76\" font-family=\"Poppins, 'Segoe UI', Arial, sans-serif\" font-weight=\"600\" font-size=\"8.5\" letter-spacing=\"1.3\">\n    <line x1=\"96\" y1=\"66.5\" x2=\"110\" y2=\"66.5\" stroke=\"#8DCA76\" stroke-width=\"1.4\"/>\n    <text x=\"154\" y=\"69.5\" text-anchor=\"middle\">GYM &amp; FITNESS</text>\n    <line x1=\"198\" y1=\"66.5\" x2=\"212\" y2=\"66.5\" stroke=\"#8DCA76\" stroke-width=\"1.4\"/>\n  </g></symbol>\n    <symbol id=\"mark\" viewBox=\"4 2 96 74\"><g fill=\"none\" stroke=\"#8DCA76\" stroke-width=\"3.6\" stroke-linejoin=\"round\" stroke-linecap=\"round\">\n    <polygon points=\"11,26 60,8 94,34 78,64 36,70 14,51\"/>\n    <polyline points=\"11,26 36,70 94,34\"/>\n    <line x1=\"11\" y1=\"26\" x2=\"64\" y2=\"34\" stroke-width=\"2.4\"/>\n  </g></symbol></defs></svg>\n<div class=\"stage\" id=\"stage\">\n  <svg class=\"mark\" viewBox=\"0 0 100 78\"><use href=\"#mark\"/></svg>\n  <div class=\"k\">Simulation placeholder</div>\n  <h1 id=\"title\">Simulation</h1>\n  <p id=\"intro\">This frame is where the SimStudio export for this step lands. Until then, walk the steps below to see completion flow back into the portal.</p>\n  <div class=\"card\" id=\"card\">\n    <h2><em>Step</em> <span id=\"n\">1</span> of <span id=\"total\">3</span></h2>\n    <p id=\"text\">Each real step will show a captured screen with a highlighted target and this callout beside it.</p>\n    <div class=\"target\" id=\"target\">Click here to continue</div>\n    <div class=\"row\"><span id=\"pos\"></span><button id=\"next\" type=\"button\">Next</button></div>\n  </div>\n</div>\n<div class=\"foot\"><span id=\"counter\">1 / 3</span><div class=\"bar\"><i id=\"bar\" style=\"width:0%\"></i></div><span>Placeholder</span></div>\n<script>\n(function () {\n  /* Loaded from a file, the query string carries the title and step count.\n     Inlined into a self-contained portal there is no URL to carry them, so the\n     frame's name does instead — one copy of this page serves every placeholder\n     item rather than one copy per item. */\n  const q = new URLSearchParams(location.search.slice(1) || window.name || '');\n  const title = q.get('title') || 'Simulation';\n  const total = Math.max(2, Math.min(30, parseInt(q.get('steps') || '3', 10) || 3));\n  document.getElementById('title').textContent = title; document.title = title + ' · placeholder';\n  document.getElementById('total').textContent = total;\n  let n = 1, misses = 0; const t0 = Date.now();\n  const paint = () => { document.getElementById('n').textContent = n; document.getElementById('counter').textContent = n + ' / ' + total; document.getElementById('bar').style.width = Math.round((n - 1) / total * 100) + '%'; document.getElementById('next').textContent = n === total ? 'Finish' : 'Next'; document.getElementById('pos').textContent = n === total ? 'Last step' : ''; };\n  const finish = () => {\n    const payload = { type: 'simulation:complete', score: 100, passed: true, steps: total, misses: misses, seconds: Math.round((Date.now() - t0) / 1000) };\n    try { window.parent.postMessage(payload, '*'); } catch (e) {}\n    try { const api = window.parent.API; if (api) { api.LMSInitialize(''); api.LMSSetValue('cmi.core.score.raw', '100'); api.LMSSetValue('cmi.core.lesson_status', 'passed'); api.LMSCommit(''); api.LMSFinish(''); } } catch (e) {}\n    document.body.classList.add('done');\n    document.getElementById('card').innerHTML = '<h2>Completed.</h2><p>The completion message has been handed back to the portal, which has recorded it. A real export does exactly this on its closing screen.</p>';\n    document.getElementById('bar').style.width = '100%'; document.getElementById('counter').textContent = total + ' / ' + total;\n  };\n  document.getElementById('next').addEventListener('click', () => { if (n >= total) { finish(); return; } n++; paint(); });\n  document.getElementById('stage').addEventListener('click', e => { if (!e.target.closest('.card') && !e.target.closest('.mark')) misses++; });\n  paint();\n})();\n<\/script>\n</body>\n</html>\n"}</script>
<script>
(function () {
  'use strict';
  const CFG = JSON.parse(document.getElementById('portal-config').textContent);
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const byId = Object.fromEntries(CFG.items.map(i => [i.id, i]));
  /* Sent as a single file the portal cannot reach a sibling content/ folder, so the
     build inlines each simulation and the frame is given srcdoc instead of src. One
     copy of a file serves every item pointing at it; the query string that used to
     carry the placeholder's title and step count rides on the frame's name. */
  const SIMS = (() => { const n = document.getElementById('portal-sims'); try { return n ? JSON.parse(n.textContent) : null; } catch (e) { return null; } })();
  const simSrc = it => { if (!SIMS || !it.src) return null; const [f, q] = it.src.split('?'); return SIMS[f] ? { html: SIMS[f], name: q || '' } : null; };
  const TYPE = { simulation: 'Simulation', hotspot: 'Interactive photo', video: 'Video', guide: 'Guide', checklist: 'Checklist', article: 'Article', link: 'Link' };

  // ---- state ------------------------------------------------------------
  const KEY = CFG.storageKey;
  const fresh = () => ({ name: '', audience: 'employee', landed: false, returnTo: null, unlocked: {}, drafts: [], posts: [], items: {}, checks: {}, favs: [], lastOpened: null, created: new Date().toISOString() });
  let S = fresh();
  try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

  const aud = () => CFG.audiences.find(a => a.id === S.audience) || CFG.audiences[0];
  const unlocked = id => { const a = CFG.audiences.find(x => x.id === id); return !a || !a.key || !!S.unlocked[id]; };
  /* Who sees whose content. It used to be a rule — everyone above an employee sees
     employee content — which was right until members arrived, who must see none of it.
     Each audience now says so itself, and the old rule is the default. */
  const seesOf = a => a.sees || (a.id === 'employee' ? ['employee'] : ['employee', a.id]);
  const visible = () => { const s = seesOf(aud()); return CFG.items.filter(i => s.includes(i.audience)); };
  const pathFor = a => CFG.paths.find(p => p.audience === a);
  /* Favourites: the one you keep coming back for — the sauna speaker, every time.
     Most recent first, kept on the device like everything else here, so it is a
     shortcut rather than an account. */
  const isFav = id => (S.favs || []).includes(id);
  const favs = () => (S.favs || []).map(id => byId[id]).filter(i => i && seesOf(aud()).includes(i.audience));
  function toggleFav(id) { S.favs = S.favs || []; const i = S.favs.indexOf(id);
    if (i < 0) S.favs.unshift(id); else S.favs.splice(i, 1); save(); return i < 0; }
  const status = id => (S.items[id] && S.items[id].status) || 'new';
  const isDone = id => status(id) === 'complete';
  const pathProgress = p => { const done = p.items.filter(isDone).length; return { done, total: p.items.length, pct: p.items.length ? Math.round(done / p.items.length * 100) : 0 }; };

  function complete(id, extra) {
    const it = byId[id]; if (!it) return;
    const was = isDone(id);
    S.items[id] = Object.assign({}, S.items[id], { status: 'complete', completedAt: new Date().toISOString() }, extra || {});
    save();
    if (!was) toast('Completed: ' + it.title);
    render();
  }
  function start(id) {
    if (!S.items[id]) { S.items[id] = { status: 'in-progress', startedAt: new Date().toISOString() }; }
    S.lastOpened = id; save();
  }

  // ---- routing ----------------------------------------------------------
  function route() {
    const h = location.hash.replace(/^#\/?/, '') || 'home';
    const [pathPart, qs] = h.split('?');
    const seg = pathPart.split('/');
    return { view: seg[0] || 'home', id: seg[1] || null, q: new URLSearchParams(qs || '') };
  }
  const go = h => { location.hash = '#/' + String(h).replace(/^#?\/?/, ''); };
  window.addEventListener('hashchange', render);

  // ---- chrome -----------------------------------------------------------
  const navIcon = { home: 'i-home', lookaround: 'i-plan', learn: 'i-learn', reports: 'i-reports', news: 'i-news', support: 'i-support', me: 'i-me' };
  const navItems = () => CFG.nav.filter(n => !n.audiences || n.audiences.includes(S.audience));
  function renderNav() {
    const r = route(); const cur = r.view === 'item' ? 'learn' : (r.view === 'process' ? 'processes' : r.view); const nav = navItems();
    const link = n => `<a href="#/${n.id}" ${cur === n.id ? 'aria-current="page"' : ''}><svg><use href="#${navIcon[n.id]}"/></svg><span>${esc(n.label)}</span></a>`;
    $('#tabbar').innerHTML = nav.map(link).join('');
    $('#tabbar').style.gridTemplateColumns = `repeat(${nav.length}, 1fr)`;
    $('#tabbar').dataset.n = nav.length;
    $('#rail-nav').innerHTML = nav.map(link).join('');
    $('#menu-nav').innerHTML = nav.map(n => `<a href="#/${n.id}" data-close>${esc(n.label)}</a>`).join('');
    const audHtml = CFG.audiences.map(a => `<button type="button" data-aud="${a.id}" data-c="${a.colour}" class="${a.id === S.audience ? 'on' : ''}" aria-pressed="${a.id === S.audience}">${a.key && !S.unlocked[a.id] ? '<svg><use href="#i-lock"/></svg>' : ''}${esc(a.label)}</button>`).join('');
    ['#rail-aud', '#menu-aud'].forEach(s => { $(s).innerHTML = audHtml; });
    $('#rail-login').href = CFG.client.memberLogin; $('#menu-login').href = CFG.client.memberLogin;
    $('#rail-foot').textContent = CFG.client.tradingName + ' · ' + CFG.client.site;
    $('#menu-fine').textContent = CFG.client.tradingName + ' · ' + CFG.client.address;
    $('#footer').textContent = CFG.footer;
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-aud]'); if (b) { switchAudience(b.dataset.aud); return; }
    const fb = e.target.closest('[data-fav]');
    if (fb) { e.preventDefault(); const on = toggleFav(fb.dataset.fav); toast(on ? 'Added to favourites' : 'Removed from favourites'); renderBody(); return; }
    const cp = e.target.closest('[data-copy]');
    if (cp) { const v = cp.dataset.copy; copyText(v).then(ok => toast(ok ? (cp.dataset.what || 'Value') + ' copied: ' + v : 'Copy is blocked here. Long-press the text to select it.')); return; }
    const g = e.target.closest('[data-contact]'); if (g) { openContact(+g.dataset.contact); return; }
    if (e.target.closest('[data-close]')) closeMenu();
  });
  function switchAudience(id) {
    const a = CFG.audiences.find(x => x.id === id); if (!a) return;
    if (a.key && !S.unlocked[id]) { askKey(a); return; }
    S.audience = id; save(); closeMenu(); enter();
  }
  function enter() {
    const back = S.returnTo && !/welcome/.test(S.returnTo) ? S.returnTo : '#/home';
    S.landed = true; S.returnTo = null; save();
    if (location.hash === back) render(); else location.hash = back;
  }
  const openMenu = () => { $('#menu').classList.add('open'); document.body.style.overflow = 'hidden'; };
  const closeMenu = () => { $('#menu').classList.remove('open'); document.body.style.overflow = ''; };
  $('#open-menu').addEventListener('click', openMenu);
  $('#close-menu').addEventListener('click', closeMenu);
  $('#menu-export').addEventListener('click', () => { closeMenu(); exportCard(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMenu(); });

  // ---- dialogs ----------------------------------------------------------
  function askName() {
    const d = $('#dlg-name'); $('#name-input').value = S.name || '';
    d.showModal();
    $('#name-save').onclick = () => { S.name = $('#name-input').value.trim(); save(); d.close(); render(); };
    $('#name-skip').onclick = () => { S.name = ''; S.nameSkipped = true; save(); d.close(); render(); };
  }
  function askKey(a) {
    const d = $('#dlg-key'); $('#key-title').textContent = a.label + ' area'; $('#key-text').textContent = a.intro + ' Enter the access key to continue. It is remembered on this device.';
    $('#key-input').value = ''; $('#key-err').textContent = '';
    d.showModal(); setTimeout(() => $('#key-input').focus(), 30);
    const tryKey = () => {
      const v = $('#key-input').value.trim().toUpperCase();
      if (v && v === String(a.key).toUpperCase()) { S.unlocked[a.id] = true; S.audience = a.id; save(); d.close(); closeMenu(); enter(); toast(a.label + ' area unlocked'); }
      else { $('#key-err').textContent = 'That key does not match. Check with the manager on duty.'; $('#key-input').select(); }
    };
    $('#key-unlock').onclick = tryKey;
    $('#key-input').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); tryKey(); } };
    $('#key-cancel').onclick = () => d.close();
  }
  function openContact(i) {
    const c = (CFG.support.assistance || [])[i]; if (!c) return;
    const d = $('#dlg-contact');
    $('#contact-name').textContent = c.name;
    $('#contact-role').textContent = c.role;
    const row = (icon, k, v, href, open) => `<div class="crow"><button type="button" class="copy" data-copy="${esc(v)}" data-what="${esc(k)}"><svg><use href="#${icon}"/></svg><span><span class="k">${esc(k)} · tap to copy</span><span class="v">${esc(v)}</span></span></button><a class="open" href="${esc(href)}" aria-label="${esc(open)}"><svg><use href="#i-ext"/></svg></a></div>`;
    $('#contact-rows').innerHTML = [
      c.email ? row('i-mail', 'Email', c.email, 'mailto:' + encodeURI(c.email), 'Open in your email app') : '',
      c.phone ? row('i-phone', 'Phone', c.phoneLabel || c.phone, 'tel:' + String(c.phone).replace(/[^+0-9]/g, ''), 'Call this number') : ''
    ].join('');
    $('#contact-how').textContent = (c.how || '') + (c.demo ? ' These contact details are placeholders for ONYX to replace.' : '');
    d.showModal();
    $('#contact-close').onclick = () => d.close();
  }
  async function copyText(t) {
    try { if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(t); return true; } } catch (e) {}
    try {
      const ta = document.createElement('textarea');
      ta.value = t; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none';
      document.body.appendChild(ta); ta.focus(); ta.select(); ta.setSelectionRange(0, t.length);
      const ok = document.execCommand('copy'); ta.remove(); return ok;
    } catch (e) { return false; }
  }
  /* The import panel. Nothing is wired to a file picker yet and the copy says so:
     an owner shown this should come away knowing which exports to dig out, not
     thinking the page already reads them. */
  function importPanel() {
    const I = (CFG.reports || {}).import; if (!I) return;
    const list = (label, rows) => rows && rows.length
      ? `<div class="label">${esc(label)}</div><ul>${rows.map(r => `<li>${esc(r)}</li>`).join('')}</ul>` : '';
    $('#imp-title').textContent = I.title || 'Importing your own numbers';
    $('#imp-intro').textContent = I.intro || '';
    $('#imp-body').innerHTML = list('What it takes', I.takes) + list('What it does with them', I.does);
    $('#imp-status').textContent = I.status || '';
    const cta = $('#imp-cta');
    cta.textContent = I.cta || 'Talk to us';
    cta.href = '#/' + (I.to || 'support');
    const d = $('#dlg-import');
    cta.onclick = () => d.close();
    $('#imp-close').onclick = () => d.close();
    d.showModal();
    /* This one is long enough to scroll, and the first thing a dialog focuses is
       its first focusable child — Close, at the very bottom. So it opened at the
       end of itself. The dialog takes focus instead and starts at the top. */
    d.scrollTop = 0; d.focus();
  }
  function confirm(title, text, yes) {
    const d = $('#dlg-confirm'); $('#confirm-title').textContent = title; $('#confirm-text').textContent = text;
    d.showModal(); $('#confirm-yes').onclick = () => { d.close(); yes(); }; $('#confirm-no').onclick = () => d.close();
  }
  let toastT;
  function toast(msg) { $('#toast-text').textContent = msg; $('#toast').classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => $('#toast').classList.remove('show'), 2800); }

  // ---- pieces -----------------------------------------------------------
  const stateIcon = id => isDone(id) ? '<svg class="state" aria-label="Complete"><use href="#i-check"/></svg>' : status(id) === 'in-progress' ? '<svg class="state prog" aria-label="In progress"><use href="#i-prog"/></svg>' : '';
  const metaOf = (it, withArea = true) => [it.minutes ? it.minutes + ' min' : null, it.steps && it.type === 'simulation' ? it.steps + ' steps' : null, it.hotspots ? it.hotspots + ' hotspots' : null, Array.isArray(it.steps) ? it.steps.length + ' steps' : null, it.checks ? it.checks.length + ' items' : null, withArea ? groupLabel(groupOf(it)) : null].filter(Boolean).join(' · ');
  const demoBar = list => (CFG.client.demoNote && list.some(i => i.demo))
    ? `<div class="demobar"><svg><use href="#i-alert"/></svg><span><b>Demo content</b>${esc(CFG.client.demoNote)}</span></div>` : '';
  const areaLabel = id => (CFG.areas.find(a => a.id === id) || {}).label || '';

  const groupOf = it => it.group || it.area;
  const groupLabel = id => (groups().find(g => g.id === id) || {}).label || '';
  const favBtn = (id, cls = '') => `<button type="button" class="fav ${cls}${isFav(id) ? ' on' : ''}" data-fav="${esc(id)}" aria-pressed="${isFav(id)}" aria-label="${isFav(id) ? 'Remove from favourites' : 'Add to favourites'}"><svg><use href="#i-star"/></svg></button>`;
  function card(it, opts = {}) {
    const done = isDone(it.id);
    return `<div class="cw">${favBtn(it.id)}<a class="card ${done ? 'done' : ''} ${opts.active ? 'active' : ''}" href="#/item/${it.id}">
      <div class="type ${opts.amber ? 'amber' : ''}"><svg class="ti"><use href="#t-${it.type}"/></svg>${esc(opts.prefix ? opts.prefix + ' · ' : '')}${TYPE[it.type]} <span class="dot">·</span> ${esc(metaOf(it, false))}${stateIcon(it.id)}</div>
      <h4>${esc(it.title)}</h4>

    </a></div>`;
  }
  function rowCard(it, n) {
    return `<a class="card ${isDone(it.id) ? 'done' : ''}" href="#/item/${it.id}"><span class="n">${String(n).padStart(2, '0')}</span><span><h4>${esc(it.title)}</h4><div class="meta"><svg class="ti"><use href="#t-${it.type}"/></svg>${TYPE[it.type]} · ${esc(it.minutes ? it.minutes + ' min' : '')}</div></span>${stateIcon(it.id) || '<span></span>'}</a>`;
  }
  const itemPct = it => {

    const c = S.checks[it.id]; const total = Array.isArray(it.steps) ? it.steps.length : it.checks ? it.checks.length : 0;
    if (c && total) return Math.round(c.filter(Boolean).length / total * 100);

  // ---- views ------------------------------------------------------------

    if (a.homeLink) html += `<a class="homelink" href="#/${esc(a.homeLink.to)}"><span><span class="t">${esc(a.homeLink.label)}</span><span class="b">${esc(a.homeLink.blurb || '')}</span></span><svg><use href="#i-arrow-r"/></svg></a>`;

  function viewLearn(r) {
    const q = (r.q.get('q') || '').toLowerCase(); const sel = r.q.get('area') || 'all';
    const items = visible().filter(i => (sel === 'all' || i.area === sel) && (!q || (i.title + ' ' + i.blurb + ' ' + groupLabel(groupOf(i))).toLowerCase().includes(q)));
    const present = new Set(visible().map(i => i.area));
    const areas = CFG.areas.filter(a => present.has(a.id));
    const chips = [['all', 'All']].concat(areas.map(a => [a.id, a.label]));
    const selArea = CFG.areas.find(a => a.id === sel);
    const A = aud(); const seesTeam = seesOf(A).length > 1;
    let html = `<div class="hero"><h1>${esc(A.learnTitle || 'Learn')}</h1><p>${A.learnIntro ? esc(A.learnIntro) + ' ' : `${visible().length} items for ${esc(A.label.toLowerCase())}s${seesTeam ? ', including everything the team sees' : ''}. `}${selArea && selArea.blurb ? esc(selArea.blurb) : ''}</p></div>
      <label class="search"><svg><use href="#i-search"/></svg><input id="q" type="search" placeholder="Search titles and descriptions" value="${esc(r.q.get('q') || '')}" aria-label="Search"></label>
      <div class="chips">${chips.map(([k, l]) => `<button type="button" data-area="${k}" class="${sel === k ? 'on' : ''}">${esc(l)}</button>`).join('')}</div>${demoBar(items)}`;
    if (!items.length) html += `<div class="empty" style="margin-top:16px">Nothing matches. Clear the search or pick another filter.</div>`;
    const fv = favs().filter(i => items.includes(i));
    if (fv.length) html += `<div class="section"><div class="section-head"><h3><svg style="color:var(--cta)"><use href="#i-star"/></svg>Favourites</h3><span class="muted" style="font-size:13px">${fv.length}</span></div><div class="grid2">${fv.map(i => card(i)).join('')}</div></div>`;
    groups().forEach(g => {
      const list = items.filter(i => groupOf(i) === g.id); if (!list.length) return;
      html += `<div class="section"><div class="section-head"><h3>${esc(g.label)}</h3><span class="muted" style="font-size:13px">${list.filter(i => isDone(i.id)).length} of ${list.length} done</span></div>${g.blurb ? `<p class="muted" style="font-size:14px;margin:-4px 0 12px">${esc(g.blurb)}</p>` : ''}<div class="grid2">${list.map(i => card(i)).join('')}</div></div>`;

  function wireLearn() {
    const input = $('#q'); if (!input) return;
    const setQ = () => { const r = route(); const p = new URLSearchParams(r.q); if (input.value) p.set('q', input.value); else p.delete('q'); history.replaceState(null, '', '#/learn' + (p.toString() ? '?' + p : '')); renderBody(); const i2 = $('#q'); if (i2) { i2.focus(); i2.setSelectionRange(i2.value.length, i2.value.length); } };
    let tm; input.addEventListener('input', () => { clearTimeout(tm); tm = setTimeout(setQ, 180); });
    document.querySelectorAll('[data-area]').forEach(b => b.addEventListener('click', () => { const p = new URLSearchParams(route().q); if (b.dataset.area === 'all') p.delete('area'); else p.set('area', b.dataset.area); go('/learn' + (p.toString() ? '?' + p : '')); }));
  }

  let currentSim = null;
  function viewItem(r) {
    const it = byId[r.id]; if (!it) return `<div class="empty" style="margin-top:24px">That item does not exist. <a href="#/learn">Back to Learn</a></div>`;
    if (!seesOf(aud()).includes(it.audience)) { go('home'); return ''; }
    if (!isDone(it.id)) start(it.id); else { S.lastOpened = it.id; save(); }
    currentSim = (it.type === 'simulation' || it.type === 'hotspot') ? it.id : null;
    const rec = S.items[it.id] || {};
    let html = `<a class="back" href="#/learn"><svg><use href="#i-back"/></svg>Learn</a>
      <div class="item-head"><div class="type"><svg class="ti"><use href="#t-${it.type}"/></svg>${TYPE[it.type]}${it.demo ? ' <span class="demo">Demo</span>' : ''}</div><h1>${esc(it.title)}</h1><div class="meta">${esc(metaOf(it))}</div><p class="blurb">${esc(it.blurb)}</p>
      <div class="actions" style="margin-top:14px">${favBtn(it.id, 'wide')}<span class="note" id="fav-note">${isFav(it.id) ? 'Saved. It is at the top of the list next time.' : 'Save it and it sits at the top of the list next time.'}</span></div></div>`;
    if (isDone(it.id)) {
      const score = rec.score != null ? ` Score ${rec.score}${rec.passed === false ? ', not yet a pass' : ''}.` : '';
      html += `<div class="done-banner"><svg><use href="#i-check"/></svg><span><b>Completed</b> ${esc(fmtDate(rec.completedAt))}.${esc(score)}</span></div>`;
    }
    if (it.type === 'simulation' || it.type === 'hotspot') {
      // A hotspot photo has no click-through to reach an end on, so the player never
      // reports a completion the way a step-by-step export does. The frame still
      // listens for one in case a later export carries steps; the button is what
      // actually closes it off.
      const shaped = it.ratio ? ` class="frame shaped" style="--ratio:${esc(it.ratio)}"` : ' class="frame"';
      const inl = simSrc(it);
      // srcdoc is set from script rather than written into the attribute: the file is
      // most of a megabyte and belongs in the page once, not once per item.
      html += `<div${shaped}><iframe id="sim"${inl ? ` name="${esc(inl.name)}"` : ` src="${esc(it.src)}"`} title="${esc(it.title)}" allow="fullscreen" allowfullscreen loading="eager"></iframe></div>
        <div class="frame-actions"><button class="btn outline small" id="sim-full" type="button"><svg><use href="#i-full"/></svg>Full screen</button><a class="btn ghost small" id="sim-open" href="${esc(it.src)}" target="_blank" rel="noopener"><svg><use href="#i-ext"/></svg>Open on its own</a>
        ${it.type === 'hotspot'
          ? `${isDone(it.id) ? '' : `<button class="btn small" id="mark-done" type="button">Mark as read</button>`}<span class="note">Tap each marker on the photo to read it, then mark it off. ${esc(it.hotspots ? it.hotspots + ' markers' : 'Every marker')} — open them all before you close it.</span>`
          : `<span class="note">Completion is recorded here the moment the simulation finishes. Nothing to tick.</span>`}</div>`;
    } else if (it.type === 'video') {
      if (it.src) html += `<video id="vid" controls playsinline preload="metadata" src="${esc(it.src)}"${it.poster ? ` poster="${esc(it.poster)}"` : ''}></video><div class="actions"><span class="note">Marked as watched when the video ends.</span></div>`;
      else html += `<div class="video-ph"><svg><use href="#i-play"/></svg><div><b style="color:var(--text)">Video to come.</b><br>${esc(it.minutes)} minutes, filmed at ${esc(CFG.client.site)}. The frame is ready; the file drops in.</div></div>
        <div class="actions">${isDone(it.id) ? '' : `<button class="btn small" id="mark-done" type="button">Mark as watched</button>`}<span class="note">Placeholder until the video is supplied. Marking it watched keeps the path moving.</span></div>`;
    } else if (it.type === 'guide' || it.type === 'checklist') {
      const list = it.type === 'guide' ? it.steps : it.checks; const c = S.checks[it.id] || [];
      const done = c.filter(Boolean).length;
      html += `<ol class="steps" id="steps">${list.map((s, i) => `<li class="${c[i] ? 'done' : ''}" data-i="${i}"><span class="n"></span><p>${esc(s)}</p><button type="button" class="tick" aria-pressed="${!!c[i]}" aria-label="Step ${i + 1} ${c[i] ? 'done' : 'not done'}"><svg><use href="#i-tick"/></svg></button></li>`).join('')}</ol>
        <div class="prog green" style="margin-top:18px"><i style="width:${Math.round(done / list.length * 100)}%"></i></div>
        <div class="actions"><span class="muted" style="font-size:14px;flex:1">${done} of ${list.length} ${it.type === 'guide' ? 'steps' : 'items'} ticked</span>
        ${isDone(it.id) ? `<button class="btn ghost small" id="reset-steps" type="button">Reset</button>` : `<button class="btn small" id="mark-done" type="button" ${done === list.length ? '' : 'disabled'}>Mark complete</button>`}</div>`;
    } else if (it.type === 'article') {
      html += `<div class="article">${it.body.map(p => `<p>${esc(p)}</p>`).join('')}</div><div class="actions">${isDone(it.id) ? '' : `<button class="btn small" id="mark-done" type="button">Mark as read</button>`}</div>`;
    } else if (it.type === 'link') {
      html += `<div class="actions"><a class="btn" id="open-link" href="${esc(it.href)}" target="_blank" rel="noopener"><svg><use href="#i-ext"/></svg>Open</a><span class="note">Opens in a new tab and is marked as visited.</span></div>`;
    }
    const p = pathFor(it.audience) || pathFor('employee'); const idx = p ? p.items.indexOf(it.id) : -1;
    if (idx >= 0) {
      const prev = p.items[idx - 1], next = p.items[idx + 1];
      html += `<div class="pager">${prev ? `<a href="#/item/${prev}"><span class="k">Previous</span><span class="t">${esc(byId[prev].title)}</span></a>` : '<span></span>'}${next ? `<a class="next" href="#/item/${next}"><span class="k">Next</span><span class="t">${esc(byId[next].title)}</span></a>` : `<a class="next" href="#/me"><span class="k">Path end</span><span class="t">See your progress</span></a>`}</div>`;
    }
    return html;
  }
  function wireItem(r) {
    const it = byId[r.id]; if (!it) return;
    const mark = $('#mark-done'); if (mark) mark.addEventListener('click', () => complete(it.id, { selfMarked: true }));
    const inl = simSrc(it); const frame = $('#sim');
    if (inl && frame) frame.srcdoc = inl.html;
    const open = $('#sim-open');
    // An inlined simulation has no file to link to, so it opens from a blob of itself.
    if (inl && open) open.addEventListener('click', e => {
      e.preventDefault();
      const u = URL.createObjectURL(new Blob([inl.html], { type: 'text/html' }));
      window.open(u, '_blank', 'noopener');
      setTimeout(() => URL.revokeObjectURL(u), 60000);
    });
    const full = $('#sim-full'); if (full) full.addEventListener('click', () => { const f = $('#sim'); if (f.requestFullscreen) f.requestFullscreen().catch(() => {}); else if (f.webkitRequestFullscreen) f.webkitRequestFullscreen(); });
    const vid = $('#vid'); if (vid) vid.addEventListener('ended', () => complete(it.id));
    const link = $('#open-link'); if (link) link.addEventListener('click', () => setTimeout(() => complete(it.id), 300));
    const steps = $('#steps'); if (steps) steps.addEventListener('click', e => {
      const li = e.target.closest('li'); if (!li) return;
      const i = +li.dataset.i; const list = it.type === 'guide' ? it.steps : it.checks;
      const c = S.checks[it.id] || Array(list.length).fill(false); c[i] = !c[i]; S.checks[it.id] = c;
      if (!isDone(it.id)) S.items[it.id] = Object.assign({ status: 'in-progress', startedAt: new Date().toISOString() }, S.items[it.id]);
      save();
      if (c.every(Boolean) && !isDone(it.id)) complete(it.id, { selfMarked: true }); else renderBody();
    });
    const reset = $('#reset-steps'); if (reset) reset.addEventListener('click', () => { delete S.checks[it.id]; delete S.items[it.id]; save(); renderBody(); });
  }

  function viewWelcome() {
