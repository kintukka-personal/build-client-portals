        if (picked && isRight) key.innerHTML = mkGlyph('tick', 0, 'currentColor');
        else if (picked && isPick) key.innerHTML = mkGlyph('cross', 0, 'currentColor');
        else key.textContent = String.fromCharCode(65 + oi);
        b.appendChild(key);
        b.appendChild(rich('span', null, op.text, null, qpaper));
        if (picked) b.setAttribute('disabled', '');
        else b.addEventListener('click', function (e) {
          e.stopPropagation();
          answer(sl, ly, op);
        });
        list.appendChild(b);
      });
      qcard.appendChild(list);

      if (picked) {
        var won = !!right && picked === right.id;
        var why = el('div', { class: 'qz-why' + (won ? '' : ' bad'), role: 'status' });
        why.appendChild(el('b', { text: won ? 'Correct.' : 'Not quite.' }));
        if (ly.explain) why.appendChild(richBlocks(null, ly.explain, {}, qpaper));
        qcard.appendChild(why);
        var last = st.idx === SLIDES.length - 1;
        qcard.appendChild(el('div', { class: 'qz-foot' }, [
          el('button', { type: 'button', class: 'go on',
                         text: last ? 'Finish' : 'Continue', onclick: next })
        ]));
      }
      return qcard;
    }

    if (ly.type === 'box') {
      return el('div', {
        class: 'ov', style: Object.assign({}, box, {
          border: ly.strokeWidth + 'px ' + (ly.strokeStyle || 'solid') + ' ' + ly.stroke,
          borderRadius: (ly.radius || 0) + 'px',
          background: rgba(ly.fill, ly.fillOpacity),
          pointerEvents: 'none'
        })
      });
    }

    if (ly.type === 'input') {
      var inp = el('input', {
        class: 'ov ov-input' +
               (st.done[sl.id] ? ' good'
                 : (st.misses[sl.id] || 0) > 0 ? ' bad' : ''),
        type: 'text', placeholder: ly.placeholder || '',
        'aria-label': ly.placeholder || 'Entry field',
        value: st.done[sl.id] && st.typed && st.typed[ly.id] ? st.typed[ly.id] : '',
        style: Object.assign({}, box, {
          borderWidth: ly.strokeWidth + 'px', borderColor: ly.stroke,
          /* the colour, not the shorthand: background alone would reset the
             background-image with it, and the wash that marks a wrong or an
             accepted entry is a background-image laid over this */
          borderRadius: (ly.radius || 0) + 'px', backgroundColor: ly.bg, color: ly.fg
        })
      });
      inp.addEventListener('click', function (e) { e.stopPropagation(); });
      inp.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); checkInput(sl, ly, inp); }
      });
      inp.addEventListener('blur', function () { if (inp.value.trim()) checkInput(sl, ly, inp, true); });
      /* an accepted answer is not edited back into a wrong one while the
         learner sits on the step reading the confirmation */
      if (st.done[sl.id]) inp.readOnly = true;
      setTimeout(function () { if (!st.done[sl.id]) { try { inp.focus({ preventScroll: true }); } catch (e) {} } }, 120);
      return inp;
    }

    if (ly.type === 'text') {
      var tn = el('div', {
        class: 'ov ov-text',
        style: Object.assign({}, box, {
          color: ly.fg, background: rgba(ly.bg, ly.bgOpacity),
          fontSize: ly.size + 'px', fontWeight: ly.weight, borderRadius: (ly.radius || 0) + 'px',
          textAlign: ly.align, pointerEvents: 'none',
          justifyContent: ly.align === 'center' ? 'center' : ly.align === 'right' ? 'flex-end' : 'flex-start'
        })
      });
      tn.innerHTML = md(ly.body);
      return tn;
    }

    if (ly.type === 'mask') {
      return el('div', {
        class: 'ov ov-mask', text: ly.label || '',
        style: Object.assign({}, box, {
          background: ly.style === 'solid' ? ly.color : 'transparent',
          backdropFilter: ly.style === 'blur' ? 'blur(' + ly.blur + 'px)'
                        : ly.style === 'pixel' ? 'blur(3px) contrast(.75)' : 'none',
          WebkitBackdropFilter: ly.style === 'blur' ? 'blur(' + ly.blur + 'px)' : 'none',
          borderRadius: (ly.radius || 0) + 'px', pointerEvents: 'none'
        })
      });
    }

    if (ly.type === 'arrow') {
      /* An arrow is its two ends, which are two opposite corners of its own
         box; diag says which corner the start sits on. The tool's canvas and
         js/video.js read the same rule off the same four keys.

         There is deliberately no viewBox. A viewBox with
         preserveAspectRatio="none" shears everything inside it, a <marker> is
         inside it, and the line escaped through vector-effect — so the head
         alone came out squashed by whatever shape the box happened to be.
         Without one, user units are CSS pixels: percentages resolve against
         the box, markerUnits="userSpaceOnUse" sizes the head in pixels, and
         orient takes its angle in pixels too. Nothing left to shear. */
      /* drawn over the whole capture, with the two ends in the capture's own
         percentages — which is what the layer stores. Inside the arrow's own
         box would be the obvious place and it does not work: a horizontal
         arrow has a box with no height, and an SVG viewport with a zero
         dimension is not rendered at all, so the arrow would disappear. */
      var ends = arrowEnds(ly);
      var wrap = el('div', {
        class: 'ov ov-arrow',
        style: { left: 0, top: 0, width: '100%', height: '100%', zIndex: z + i, pointerEvents: 'none' }
      });
      var heads = ly.heads || 'end';
      var hd = arrowHeadPx(ly), dash = arrowDash(ly);
      var pts = 'x1="' + ends[0].x + '%" y1="' + ends[0].y + '%" x2="' +
                ends[1].x + '%" y2="' + ends[1].y + '%"';
      wrap.innerHTML =
        '<svg style="position:absolute;inset:0;width:100%;height:100%;overflow:visible">' +
        '<defs><marker id="m' + ly.id + '" viewBox="0 0 10 10" refX="10" refY="5"' +
        ' markerUnits="userSpaceOnUse" markerWidth="' + hd + '" markerHeight="' + hd +
        '" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="' + ly.stroke +
        '"/></marker></defs>' +
        '<line ' + pts + ' stroke="' + ly.stroke + '" stroke-width="' + ly.strokeWidth + '"' +
        (dash ? ' stroke-dasharray="' + dash + '"' : '') +
        (ly.strokeStyle === 'dotted' ? ' stroke-linecap="round"' : '') +
        (heads === 'start' || heads === 'both' ? ' marker-start="url(#m' + ly.id + ')"' : '') +
        (heads === 'end' || heads === 'both' ? ' marker-end="url(#m' + ly.id + ')"' : '') +
        '/></svg>';
      return wrap;
    }

    if (ly.type === 'callout') {
      /* Test me hides callouts because a callout names the thing to click, and
         naming it is the help an assessment withholds. A step with nothing to
         click gives nothing away — the note the author wrote is the whole of
         that step — and hiding it left the learner on a bare screen with no
         instruction and nothing on it to press. So a review step keeps its card
         in every mode. What it does not keep in Test me is the gate: an
         assessment does not ask to be acknowledged, and the step scores
         nothing either way, since the total counts only the steps with
         something to do. */
      var hideInTry = st.mode === 'try' && !noteDue(sl) &&
                      (st.misses[sl.id] || 0) < (S.hintAfterMisses || 2) &&
                      needsAction(sl) && !st.done[sl.id];
      if ((st.mode === 'test' && needsAction(sl)) || hideInTry) return null;

      var card = el('div', {
        class: 'ov co', role: 'note',
        style: Object.assign({}, box, {
          height: ly.autosize !== false ? 'auto' : pct(ly.h),
          background: ly.bg, color: ly.fg,
          borderWidth: ly.borderWidth + 'px', borderColor: ly.border,
          borderRadius: (ly.radius || 0) + 'px', textAlign: ly.align
        })
      });
      card.addEventListener('click', function (e) { e.stopPropagation(); });
      /* one map for the whole card: a term explained in the heading is not
         underlined again three words later in the body */
      var seen = {};
      /* the heading is the step's name — a link in it competes with the thing
         the learner is being told to click, and it used to take the term off
         the body, where the explanation actually belongs. No seen map is
         passed, so it neither links nor consumes. */
      var paper = { bg: ly.bg, fg: ly.fg };
      if (ly.heading) card.appendChild(rich('h4', null, ly.heading, null, paper));
      if (ly.body) card.appendChild(richBlocks('co-body', ly.body, seen, paper));
      (sl.meta && sl.meta.tips || []).forEach(function (t) {
        card.appendChild(rich('div', 'note', t, seen));
      });
      if (noteDue(sl)) card.appendChild(missNode(sl));

      /* A reading step carries its own way onward, whatever the author set for
         Back and Next — first the button that acknowledges it, in the foot's
         left corner, then the one that leaves, in its right. Without the second
         the card went blank the moment it was acknowledged and the only way on
         was a control at the far foot of the screen, which is not where the
         learner is looking; with the two apart, the press that carries on is
         never under the pointer that has just acknowledged the note. */
      var last = st.idx === SLIDES.length - 1;
      var mine = reading(sl) && !S.allowFreeNav && ly.id === (calloutOf(sl) || {}).id;
      /* an accepted typed answer waits here too, and for the same reason: the
         way onward belongs on the card that has just confirmed it rather than
         at the far foot of the screen. There is no acknowledgement to make
         first — the answer was the acknowledgement. */
      var right = (st.note[sl.id] || {}).kind === 'right' && st.done[sl.id] &&
                  ly.id === (calloutOf(sl) || {}).id;
      if (right) card.className += ' ok';
      var showNav = ly.showNav !== false;
      if (showNav || mine || right) {
        var nav = el('div', { class: 'nav' });
        if (showNav) nav.appendChild(el('span', { class: 'n', text: (st.idx + 1) + ' of ' + SLIDES.length }));
        if (mine && !st.ack[sl.id]) {
          nav.appendChild(el('button', { class: 'go ack', text: 'I understand', onclick: acknowledge }));
        }
        var far = [];
        if (showNav) {
          var b = el('button', { text: 'Back', onclick: prev });
          if (st.idx === 0) b.setAttribute('disabled', '');
          far.push(b);
        }
        if ((mine && st.ack[sl.id]) || right) {
          /* Continue rather than Next: the task is behind the learner either
             way, so what the button does is carry on rather than advance past
             something still waiting to be done */
          far.push(el('button', { class: 'go on', text: last ? 'Finish' : 'Continue', onclick: next }));
        } else if (!mine && showNav) {
          var g = el('button', { class: 'go', text: last ? 'Finish' : 'Next', onclick: next });
          if (!canGoNext()) g.setAttribute('disabled', '');
          far.push(g);
        }
        if (far.length) far[0].classList.add('far');
        for (var fi = 0; fi < far.length; fi++) nav.appendChild(far[fi]);
        card.appendChild(nav);
      }
      return card;
    }
    return null;
  }

  /* the step on screen. One column holds it and holds it for the whole run, so
     this is the stage's own contents — the helper stays because everything that
     decorates a target (the miss paint, Show me) asks through it. */
  function onStage(sel) {
    var col = stage.querySelector('.sim-col') || stage;
    return col.querySelectorAll(sel);
  }

  /* ---------------- chrome paint ---------------- */
  function paintChrome() {
    var sl = slide();
    if (footCount) footCount.textContent = (st.idx + 1) + ' / ' + SLIDES.length;
    if (bar) bar.style.width = ((st.idx) / Math.max(1, SLIDES.length - 1) * 100) + '%';
    backBtn.disabled = st.idx === 0;
    nextBtn.textContent = st.idx === SLIDES.length - 1 ? 'Finish' : 'Next';
    nextBtn.disabled = !canGoNext();
    /* why Next is dead, on Next itself — the foot is a row of controls now and
       has no room for a sentence */
    nextBtn.title = canGoNext() ? ''
      : (needsAction(sl)
          ? (targets(sl)[0] && targets(sl)[0].type === 'input'
              ? 'Type in the highlighted field, then press Enter'
              : 'Click the highlighted area of the screen to continue')
          : (sl && reading(sl) ? 'Read the note, then choose I understand' : ''));
    if (fullBtn) fullBtn.textContent = fullNow() ? 'Exit full screen' : 'Full screen';
  }

  /* ---------------- interaction ----------------
     Getting it right used to raise a note at the foot of the screen and redraw
     the slide, half a second before the slide changed anyway. Both are gone:
     the target stops pulsing, anything the learner got wrong on the way is
     cleared, and the step is left still until it is replaced. Being right is
     answered by moving on. */
  /* hold keeps the step on screen instead of moving on by itself — see
     checkInput, which is the only caller that asks for it. */
  function hit(sl, ly, hold) {
    if (st.done[sl.id]) { advanceSoon(); return; }
    st.done[sl.id] = true;
    if (!st.misses[sl.id]) st.firstTry[sl.id] = true;
    var live = onStage('.hs, .ov-input');
    for (var i = 0; i < live.length; i++) {
      live[i].classList.remove('pulse');
      live[i].classList.remove('bad');
      live[i].classList.remove('wrong');
    }
    var note = stage.querySelector('.co .miss');
    if (note) note.remove();
    paintChrome();
    if (hold) {
      /* a render, not a paint: the confirmation brings a button with it and
         that button is built with the card. Nothing jumps — the card is the
         same element and keeps its place. */
      render();
      var on = onStage('.co .nav .on')[0];
      if (on) setTimeout(function () { try { on.focus(); } catch (e) {} }, 40);
      return;
    }
    advanceSoon();
  }

  function checkInput(sl, ly, inp, quiet) {
    /* answered already: the blur that follows an accepted answer would
       otherwise come straight back in here and move the run on, which is the
       one thing the confirmation exists to stop */
    if (st.done[sl.id]) return;
    var v = inp.value;
    var want = ly.expected || '';
    var ok;
    if (ly.matchMode === 'any' || !want) ok = v.trim().length > 0;
    else if (ly.matchMode === 'exact') ok = v === want;
    else ok = v.trim().toLowerCase().replace(/\s+/g, ' ') === want.trim().toLowerCase().replace(/\s+/g, ' ');

    if (ok) {
      st.typed = st.typed || {}; st.typed[ly.id] = v;
      inp.classList.remove('bad');
      /* A typed answer is confirmed and the step is left when the learner says
         so. On a click step there is nothing to confirm — the screen changing
         is the answer — but here the learner is looking at the field, not at
         the card, and an auto-advance takes the screen away at the moment they
         earned the confirmation. Where the mode withholds the card there is
         nowhere to confirm it, so the run moves on as it did. */
      var hold = st.mode !== 'test' && !!calloutOf(sl);
      if (hold) st.note[sl.id] = { kind: 'right' };
      else delete st.note[sl.id];
      hit(sl, ly, hold);
    } else if (!quiet) {
      st.misses[sl.id] = (st.misses[sl.id] || 0) + 1;
      st.note[sl.id] = { kind: 'value', want: want, exact: ly.matchMode === 'exact' };
      paintMiss(sl);
      /* selected, not merely focused: what is in the field is wrong, so the
         next keystroke should replace it rather than land on the end of it */
      inp.select();
    }
  }

  /* One pick, recorded and then final. A wrong one counts as a miss, the same
     as a misplaced click, so the score says the same thing about both — and
     since the question is the step, answering it at all is the step done. */
  function answer(sl, ly, op) {
    if (st.picked[sl.id]) return;
    var right = correctOption(ly);
    var won = !!right && op.id === right.id;
    st.picked[sl.id] = op.id;
    if (!won) st.misses[sl.id] = (st.misses[sl.id] || 0) + 1;
    else if (!st.misses[sl.id]) st.firstTry[sl.id] = true;
    st.done[sl.id] = true;
    /* a render rather than a paint: the marks, the explanation and Continue all
       arrive together, and the card is the same element so nothing jumps */
    render();
    var on = onStage('.qz-foot .go')[0];
    if (on) setTimeout(function () { try { on.focus(); } catch (e) {} }, 40);
  }
  /* the answer marked correct, or the first — the model keeps it to one, and a
     choice that somehow has none marked still has a right answer to show */
  function correctOption(ly) {
    var os = ly.options || [];
    for (var i = 0; i < os.length; i++) if (os[i].correct) return os[i];
    return os[0] || null;
  }

  /* A wrong attempt reddens the target and pulses it, and nothing else on the
     screen moves. On the second one the step earns a note, inside the callout
     that carries it — the callout grows downwards, it never jumps. */
  function onMiss(e) {
    /* with a card open, the click that dismisses it is not a wrong attempt —
       the learner is putting away something they opened, not guessing */
    if (st.open) { closeMarkers(null); return; }
    var sl = slide();
    if (!sl || !needsAction(sl) || st.done[sl.id]) return;
    st.misses[sl.id] = (st.misses[sl.id] || 0) + 1;

    if (st.mode === 'test') {
      /* nothing is highlighted to redden, so the click itself answers */
      var frame = e.currentTarget.parentNode;
      var r = frame.getBoundingClientRect();
      frame.appendChild(el('div', {
        class: 'ripple', style: { left: (e.clientX - r.left) + 'px', top: (e.clientY - r.top) + 'px' }
      }));
      setTimeout(function () {
        var rs = frame.querySelectorAll('.ripple');
        for (var i = 0; i < rs.length; i++) rs[i].remove();
      }, 620);
      return;
    }

    var t = targets(sl)[0];
    st.note[sl.id] = { kind: t && t.type === 'input' ? 'type' : (t && t.action) || 'click' };
    paintMiss(sl);
  }

  function noteDue(sl) {
    var n = st.note[sl.id];
    if (!n) return false;
    /* Test me withholds prompts because they would be help with a scored task.
       A reading step is not scored and has nothing to get wrong, so withholding
       this one leaves a learner stuck with no way to find the press. */
    if (n.kind === 'read') return true;
    /* an accepted answer is not help with a scored task, it is the learner's
       own answer read back to them, so it outlives the step being done */
    if (n.kind === 'right') return true;
    if (st.mode === 'test' || st.done[sl.id]) return false;
    if (n.force) return true;
    /* A wrong typed entry earns its note on the first try. A red border round
       a field says something is wrong with what was typed and nothing about
       what — and unlike a misplaced click, the learner cannot see for himself
       where he went wrong. Clicks still wait for the miss threshold: there the
       highlight already says where to aim. */
    if (n.kind === 'value') return true;
    return (st.misses[sl.id] || 0) >= (S.hintAfterMisses || 2);
  }

  var SAYS = {
    click: 'You need to click inside the highlighted area.',
    dblclick: 'You need to double-click inside the highlighted area.',
    rightclick: 'You need to right-click inside the highlighted area.',
    hover: 'You need to hover over the highlighted area.',
    type: 'You need to type inside the highlighted field.',
    blocked: 'Finish this step before moving on — the target is highlighted.',
    read: 'Read the note, then choose the button on it to carry on.'
  };

  function missNode(sl) {
    var n = st.note[sl.id] || {};
    var body;
    if (n.kind === 'right') {
      /* the same note in green, saying what the press is rather than leaving
         the learner to find it: the button arrives with this line */
      var word = st.idx === SLIDES.length - 1 ? 'Finish' : 'Continue';
      return el('div', { class: 'miss good', role: 'status' },
        [el('b', { text: 'Correct.' }),
         el('span', {}, [document.createTextNode('Choose '), el('em', { text: word }),
                         document.createTextNode(' when you are ready to carry on.')])]);
    }
    if (n.kind === 'value') {
      /* first time round, say that it is wrong and let him think. Second time,
         stop making him guess and name the value and the key that submits it —
         a learner stuck on a spelling learns nothing from being told again
         that he is wrong. */
      if ((st.misses[sl.id] || 1) < 2) {
        body = [document.createTextNode('That is not the value we need. Try again.')];
      } else if (n.want) {
        body = n.exact
          ? [document.createTextNode('Type the word '), el('em', { text: n.want }),
             document.createTextNode(' exactly into the field, then press '),
             el('em', { text: 'Enter' }), document.createTextNode('.')]
          : [document.createTextNode('Type '), el('em', { text: n.want }),
             document.createTextNode(' into the field, then press '),
             el('em', { text: 'Enter' }), document.createTextNode('.')];
      } else {
        body = [document.createTextNode('Type your answer into the highlighted field, then press '),
                el('em', { text: 'Enter' }), document.createTextNode('.')];
      }
    } else if (n.kind === 'read') {
      var btn = onStage('.co .nav .go')[0];
      var label = btn ? btn.textContent : 'I understand';
      body = [document.createTextNode('Choose '), el('em', { text: label }),
              document.createTextNode(' on this note to carry on.')];
    } else {
      body = [document.createTextNode(SAYS[n.kind] || SAYS.click)];
    }
    /* "Not quite" is for something got wrong. Nothing was got wrong on a step
       with nothing to do — the press has just not happened yet — so that one
       leads differently while wearing the same treatment. */
    return el('div', { class: 'miss', role: 'status' },
      [el('b', { text: n.kind === 'read' ? 'Not yet.' : 'Not quite.' }), el('span', {}, body)]);
  }

  /* paint the wrong attempt without redrawing the slide: a render would replay
     the callout's entry animation, which is the movement this is avoiding */
  function paintMiss(sl) {
    var hs = onStage('.hs, .ov-input');
    for (var i = 0; i < hs.length; i++) {
      hs[i].classList.add('bad');
      hs[i].classList.remove('wrong');
      void hs[i].offsetWidth;                 /* restart the pulse */
      hs[i].classList.add('wrong');
    }
    var card = stage.querySelector('.co');
    if (!card) { if (noteDue(sl)) render(); return; }   /* try mode: the callout is due too */
    var old = card.querySelector('.miss');
    if (old) old.remove();
    if (!noteDue(sl)) return;
    var nav = card.querySelector('.nav');
    if (nav) card.insertBefore(missNode(sl), nav); else card.appendChild(missNode(sl));
  }

  /* the card on screen — the one the column is holding, which is the card the
     learner is reading whether or not the capture behind it is still fading */
  function nudgeGo() {
    var b = onStage('.co .nav .ack, .co .nav .on')[0];
    if (!b) return;
    b.classList.remove('nudge');
    void b.offsetWidth;                       /* restart the pulse */
    b.classList.add('nudge');
    /* two turns of the pulse, plus a margin, so the class is not stripped off
       mid-cycle — this has to track the animation's own length above */
    setTimeout(function () { b.classList.remove('nudge'); }, 2400);
  }

  function showMe() {
    var hs = onStage('.hs, .ov-input');
    if (!hs.length) return;
    for (var i = 0; i < hs.length; i++) {
      hs[i].classList.add('flash');
      (function (n) { setTimeout(function () { n.classList.remove('flash'); }, 1600); })(hs[i]);
    }
  }

  var advTimer = null;
  function advanceSoon() {
    clearTimeout(advTimer);
    /* long enough to register that the click landed, short enough that it
       does not read as a wait. There is nothing to read in between now, and
       the dissolve carries the change, so this does not have to. */
    advTimer = setTimeout(function () { next(true); }, 240);
  }

  function next(auto) {
    var sl = slide();
    if (!sl) return;
    if (!canGoNext()) {
      if (!auto) {
        var here = slide();
        /* nothing was got wrong here — the note has simply not been
           acknowledged yet, and there is no target to point at. Saying "not
           quite" and flashing a highlight that does not exist would be two
           lies at once, so the button itself answers. */
        if (here && reading(here)) {
          st.note[here.id] = { kind: 'read', force: true };
          paintMiss(here);
          nudgeGo();
          return;
        }
        if (here && st.mode !== 'test') { st.note[here.id] = { kind: 'blocked', force: true }; paintMiss(here); }
        showMe();
      }
      return;
    }
    if (st.idx >= SLIDES.length - 1) { finish(); return; }
    st.idx++;
    render();
  }
  function prev() {
    if (st.idx === 0) return;
    st.idx--;
    render();
  }

  /* ---------------- intro / summary ---------------- */
  /* Inside the root, not on the document's body. Appended to the body it
     landed in the host's page when this export was embedded — outside the
     block, over the whole lesson — which is half of what "it takes over the
     screen" was. The other half was position:fixed. */
  function sheet(kids, skip) {
    var s = el('div', { class: 'sheet' }, [el('div', { class: 'card' }, kids)]);
    root.appendChild(s);
    if (skip) {
      var b = el('button', { class: 'skiplink', text: 'Skip introduction', onclick: function () { closeSheet(s); } });
      root.appendChild(b);
      s.addEventListener('click', function (e) { if (e.target === s) closeSheet(s); });
    }
    return s;
  }

  function closeSheet(s) {
    s.remove();
    var sk = root.querySelector('.skiplink');
    if (sk) sk.remove();
  }

  function intro() {
    var modeText = {
      guide: 'Guide me — every step is explained and the target is highlighted.',
      try: 'Try it — targets are highlighted, prompts appear only if you get stuck.',
      test: 'Test me — no prompts, and your accuracy is scored.'
    };
    var s = sheet([
      rich('h2', null, S.introTitle || 'Before you start'),
      richBlocks(null, S.introBody || ''),
      el('ul', {}, [
        el('li', { text: SLIDES.length + ' steps in this simulation.' }),
        el('li', { text: modeText[st.mode] }),
        el('li', { text: 'Nothing here touches the live system — practise freely.' })
      ]),
      el('div', { class: 'row' }, [
        el('button', {
          class: 'tbtn primary', text: 'Start',
          onclick: function () {
            /* embedded in a lesson page the block is too small for a
               screenshot, so starting asks for full screen — from inside the
               click, which is the only place a browser honours the request.
               If the embedding page withholds the permission, canFull() is
               false and it simply starts inline rather than promising it. */
            if (embedded && canFull() && !fullNow()) toggleFull();
            closeSheet(s);
            render();
          }
        })
      ])
    ], S.allowSkip);
  }

  function finish() {
    st.finished = true;
    var total = SLIDES.filter(scored).length;
    var clean = 0, missTotal = 0;
    SLIDES.forEach(function (sl) {
      if (st.firstTry[sl.id]) clean++;
      missTotal += (st.misses[sl.id] || 0);
    });
    var score = total ? Math.round(clean / total * 100) : 100;
    var pass = score >= (S.passMark || 0);
    /* to the second: a seven-step task takes well under a minute, and "1m"
       for everything told the learner nothing */
    var secs = Math.max(1, Math.round((Date.now() - st.started) / 1000));
    var taken = secs < 60
      ? secs + 's'
      : Math.floor(secs / 60) + 'm ' + (secs % 60) + 's';

    /* the LMS gets the score either way — the learner only sees it if the
       author asked for it */
    report(score, pass);

    if (S.showSummary === false) return;

    /* "first time" was the same information as "second tries" read backwards */
    var tiles = [
      ['steps done', SLIDES.length + ' of ' + SLIDES.length],
      ['second tries', String(missTotal)],
      ['time taken', taken]
    ];
    if (S.showScore) tiles.splice(1, 0, ['accuracy', score + '%']);

    var kids = [
      rich('h2', null, S.completionTitle || 'Simulation complete'),
      richBlocks(null, S.completionBody || '')
    ];
    if (S.showScore) {
      kids.push(el('div', {}, [
        el('span', { class: 'verdict ' + (pass ? 'pass' : 'fail'),
                     text: pass ? 'Passed' : 'Below the pass mark' })
      ]));
    }
    kids.push(el('div', { class: 'stats' }, tiles.map(function (t) {
      return el('div', { class: 'stat' }, [el('b', { text: t[1] }), el('span', { text: t[0] })]);
    })));

    var s = sheet(kids.concat([
      el('div', { class: 'row' }, [
        el('button', { class: 'tbtn primary', text: 'Replay Sim', onclick: function () { closeSheet(s); restart(); } }),
        el('button', { class: 'tbtn', text: 'Review the steps', onclick: function () { closeSheet(s); st.idx = 0; render(); } })
      ]),
      el('p', { class: 'foot-note', text: 'Nothing you did here touched the live system, so practice as often as you like.' }),
      S.attribution === false ? null
        : el('div', { class: 'madewith' }, [el('i', {}), el('span', { text: 'Built with SimStudio' })])
    ]));
  }

  function restart() {
    st.done = {}; st.misses = {}; st.note = {}; st.firstTry = {}; st.typed = {};
    st.picked = {};
    st.ack = {}; pulsed = null;
    /* a marker that has been opened is part of the run, so a restart puts
       every one of them back to the face the author drew */
    st.seen = {}; st.open = null;
    st.idx = 0; st.started = Date.now(); st.finished = false;
    render();
  }

  /* completion signals for the host LMS ------------------------- */
  function report(score, pass) {
    var payload = { type: 'simulation:complete', title: plain(P.title) || '', score: score, passed: !!pass, steps: SLIDES.length };
    try { if (window.parent && window.parent !== window) window.parent.postMessage(payload, '*'); } catch (e) {}
    try { reportScorm(score, pass); } catch (e) {}
  }

  /* walk up the frame chain looking for a SCORM runtime */
  function findScorm() {
    var w = window, n = 0;
    while (w && n++ < 10) {
      try {
        if (w.API_1484_11 && w.API_1484_11.Initialize) return { api: w.API_1484_11, version: '2004' };
        if (w.API && w.API.LMSInitialize) return { api: w.API, version: '1.2' };
      } catch (e) { /* cross-origin frame — keep walking */ }
      if (w.parent === w) break;
      w = w.parent;
    }
    if (window.opener) {
      try {
        if (window.opener.API_1484_11) return { api: window.opener.API_1484_11, version: '2004' };
        if (window.opener.API) return { api: window.opener.API, version: '1.2' };
      } catch (e) {}
    }
    return null;
  }

  function reportScorm(score, pass) {
    var found = findScorm();
    if (!found) return;
    var api = found.api;
    if (found.version === '2004') {
      api.Initialize('');
      api.SetValue('cmi.score.raw', String(score));
      api.SetValue('cmi.score.min', '0');
      api.SetValue('cmi.score.max', '100');
      api.SetValue('cmi.score.scaled', (score / 100).toFixed(4));
      api.SetValue('cmi.completion_status', 'completed');
      api.SetValue('cmi.success_status', pass ? 'passed' : 'failed');
      api.Commit('');
      api.Terminate('');
    } else {
      api.LMSInitialize('');
      api.LMSSetValue('cmi.core.score.raw', String(score));
      api.LMSSetValue('cmi.core.score.min', '0');
      api.LMSSetValue('cmi.core.score.max', '100');
      api.LMSSetValue('cmi.core.lesson_status', pass ? 'passed' : 'failed');
      api.LMSCommit('');
      api.LMSFinish('');
    }
  }

  /* ---------------- keyboard ---------------- */
  document.addEventListener('keydown', function (e) {
    /* Escape first: it has to work even from inside a typed field, and the key
       never reaches a host page while focus is in this document — so pass it on.
       The authoring tool's preview closes on it. */
    if (e.key === 'Escape') {
      hideTip();
      /* the glossary is the innermost thing open, so it closes first and the
         host page keeps its preview */
      if (glossSheet) { closeGlossary(); return; }
      /* then an open marker card: it is the next thing in, and closing it must
         not carry the press out to the host page's preview either */
      if (st.open) { closeMarkers(null); return; }
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'simulation:escape' }, '*');
        }
      } catch (err) {}
      return;
    }
    if (/^(INPUT|TEXTAREA)$/.test((e.target.tagName || ''))) return;
    /* Enter and Space on an underlined term belong to the term */
    if (glTarget(e) && (e.key === 'Enter' || e.key === ' ')) return;
    if (e.key === 'ArrowRight' || e.key === 'Enter') { next(); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { prev(); e.preventDefault(); }
    else if (e.key === 'h' || e.key === 'H') { showMe(); }
    else if ((e.key === 'g' || e.key === 'G') && glossOn) { openGlossary(null); }
  });

  /* geometry is percentage based, so only the narrow/wide switch needs a redraw */
  var wasNarrow = isNarrow();
  var rzTimer = null;
  window.addEventListener('resize', function () {
    clearTimeout(rzTimer);
    rzTimer = setTimeout(function () {
      if (isNarrow() !== wasNarrow) { wasNarrow = isNarrow(); render(); }
    }, 180);
  });

  /* ---------------- go ---------------- */
  document.documentElement.style.setProperty('--sim-accent', T.accent || '#f59e0b');
  /* one brand colour, four uses: the border, the resting ring, the pulse it
     grows out of, and the wash behind the note */
  var badc = T.badColor || '#ef4444';
  var css = document.documentElement.style;
  css.setProperty('--sim-bad', badc);
  css.setProperty('--sim-bad-soft', rgba(badc, 0.26));
  css.setProperty('--sim-bad-glow', rgba(badc, 0.55));
  css.setProperty('--sim-bad-gone', rgba(badc, 0));
  css.setProperty('--sim-bad-wash', rgba(badc, 0.11));
  css.setProperty('--sim-bad-ink', readable(badc, T.calloutBg || '#12161d', T.calloutFg || '#e7ebf2'));
  /* right is not the author's colour to choose either, so an accepted answer
     wears the same green as a hotspot's tick — one green in the player. Only
     its ink is walked towards the card's own text, for the same reason the
     wrong-attempt ink is: the callout can be a white card or a near-black one. */
  css.setProperty('--sim-good', MK_GOOD);
  css.setProperty('--sim-good-soft', rgba(MK_GOOD, 0.26));
  css.setProperty('--sim-good-wash', rgba(MK_GOOD, 0.11));
  css.setProperty('--sim-good-ink', readable(MK_GOOD, T.calloutBg || '#12161d', T.calloutFg || '#e7ebf2'));
  /* the ink that lands on each of those two fills, by the same rule the
     hotspot's tick and cross go through — one of them is white and the other
     depends on the colour the kit chose, and neither is worth hardcoding */
  css.setProperty('--sim-good-key', inkOn(MK_GOOD));
  css.setProperty('--sim-bad-key', inkOn(badc));
  /* A multiple choice's answers are bordered boxes on the author's own callout
     paper, so the border and the hover cannot be keyed to white: on a white
     card they would not be there at all. Both are the card's own ink at low
     alpha, which puts a light edge on a dark card and a dark edge on a light
     one without measuring anything. */
  var qink = T.calloutFg || '#e7ebf2';
  css.setProperty('--sim-edge', rgba(qink, 0.3));
  css.setProperty('--sim-hover', rgba(qink, 0.08));
  /* a hyperlink blue, walked towards the card's own text until it clears AA:
     the callout can be a white card or a dark one, and one fixed blue cannot
     be legible on both */
  var link = readable('#0056FC', T.calloutBg || '#12161d', T.calloutFg || '#e7ebf2');
  css.setProperty('--sim-link', link);
  css.setProperty('--sim-link-wash', rgba(link, 0.14));
  /* the same trick the wrong-attempt ring uses, on the accent: a pulse that is
     the button's own colour rather than a red one on a step nothing went wrong on */
  var acc = T.accent || '#f59e0b';
  css.setProperty('--sim-go-glow', rgba(acc, 0.55));
  css.setProperty('--sim-go-gone', rgba(acc, 0));
  document.documentElement.style.setProperty('--sim-ink', ink(T.accent || '#f59e0b'));
  buildChrome();
  if (!SLIDES.length) {
    stage.appendChild(el('div', { class: 'card' }, [
      el('h2', { text: 'Nothing to show yet' }),
      el('p', { text: 'This simulation has no slides.' })
    ]));
  } else {
    render();
    if (S.showIntro !== false) intro();
  }
})();

</script>
</body>
</html>
